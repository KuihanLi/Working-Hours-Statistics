<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>工时统计系统</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pinyin-pro@3.24.2/dist/index.js"></script>
<link rel="stylesheet" href="./assets/css/styles.css">
</head>
<body>
<div id="root"></div>
<script>document.body.classList.toggle("light",localStorage.getItem("wh_theme")==="light")</script>
<script src="./assets/js/core.js"></script>
<script type="text/babel">
const { useState, useEffect, useRef, useMemo, useCallback } = React;

/* ═══ Pinyin Search (via pinyin-pro) ══════════════════════════════════════ */
function App() {
  const [personnel, setPersonnel] = useState(()=>loadLS('wh_personnel', DEF_PERSONNEL));
  const [types, setTypes]         = useState(()=>loadLS('wh_types', DEF_TYPES));
  const [records, setRecords]     = useState(()=>loadLS('wh_records', {}));
  const [view, setView]           = useState('day');
  const [weekMode, setWeekMode]   = useState('stats');
  const [curDate, setCurDate]     = useState(new Date());
  const [search, setSearch]       = useState('');
  const [modal, setModal]         = useState(null);
  const [confirmCb, setConfirmCb] = useState(null);
  const [theme, setTheme]         = useState(()=>loadLS('wh_theme','dark'));
  const [template, setTemplate]   = useState(()=>loadLS('wh_template', null));   // {name, data:{relDay(0-6):{pid_name:{tid_name:count}}}}
  const [hiddenIds, setHiddenIds] = useState(()=>{ try{ return new Set(JSON.parse(localStorage.getItem('wh_hidden')||'[]')); }catch{ return new Set(); } });
  const [autoHide,  setAutoHide]  = useState(()=>loadLS('wh_autohide', false));
  const [showDiff,  setShowDiff]  = useState(false);
  const [scheduleRules, setScheduleRules] = useState(()=>normalizeScheduleRules(loadLS('wh_schedule_rules', makeEmptyScheduleRules())));
  const [flowCollapsed, setFlowCollapsed] = useState(()=>loadLS('wh_flow_collapsed', false));
  const importRecRef = useRef();
  const importPplRef = useRef();
  const importTplRef = useRef();

  useEffect(()=>{ localStorage.setItem('wh_personnel',JSON.stringify(personnel)); },[personnel]);
  useEffect(()=>{ localStorage.setItem('wh_types',JSON.stringify(types)); },[types]);
  useEffect(()=>{ localStorage.setItem('wh_records',JSON.stringify(records)); },[records]);
  useEffect(()=>{
    localStorage.setItem('wh_hidden', JSON.stringify([...hiddenIds]));
  },[hiddenIds]);
  useEffect(()=>{
    localStorage.setItem('wh_autohide', JSON.stringify(autoHide));
  },[autoHide]);
  useEffect(()=>{
    localStorage.setItem('wh_schedule_rules', JSON.stringify(scheduleRules));
  },[scheduleRules]);
  useEffect(()=>{
    if (template) localStorage.setItem('wh_template', JSON.stringify(template));
    else localStorage.removeItem('wh_template');
  },[template]);
  useEffect(()=>{
    localStorage.setItem('wh_flow_collapsed', JSON.stringify(flowCollapsed));
  },[flowCollapsed]);
  // Auto-hide zero-hours people when autoHide is on and view/date changes
  useEffect(()=>{
    if (!autoHide) return;
    setHiddenIds(()=>{
      const n = new Set();
      for (const p of personnel) {
        const h = view==='day'
          ? records?.[fmt(curDate)]?.[p.id]
            ? types.reduce((s,t)=>s+((records[fmt(curDate)][p.id][t.id]||0)*t.hours),0)
            : 0
          : weekDates(getMonday(curDate)).reduce((s,d)=>{
              const dr=records?.[fmt(d)]?.[p.id]||{};
              return s+types.reduce((ss,t)=>ss+(dr[t.id]||0)*t.hours,0);
            },0);
        if (h===0) n.add(p.id);
      }
      return n;
    });
  },[autoHide, view, curDate, records]);
  useEffect(()=>{
    localStorage.setItem('wh_theme', theme);
    document.body.classList.toggle('light', theme==='light');
  },[theme]);

  const monday  = useMemo(()=>getMonday(curDate),[curDate]);
  const wDates  = useMemo(()=>weekDates(monday),[monday]);
  const filtered        = useMemo(()=>{
    const lib = window.pinyinPro;
    return personnel
      .filter(p=>matchSearch(p.name,search))
      .sort((a,b)=>{
        try {
          if (lib) {
            const pa = lib.pinyin(a.name,{toneType:'none',separator:''}).toLowerCase();
            const pb = lib.pinyin(b.name,{toneType:'none',separator:''}).toLowerCase();
            return pa.localeCompare(pb,'zh');
          }
        } catch{}
        return a.name.localeCompare(b.name,'zh');
      });
  },[personnel,search]);
  // When searching: ignore hiddenIds so all matches appear in table
  const tablePersonnel  = useMemo(()=>search
    ? filtered
    : filtered.filter(p=>!hiddenIds.has(p.id)),
  [filtered, hiddenIds, search]);
  const curStr  = fmt(curDate);

  // diffPersonnel: when diff mode on, add people who appear in template but not in tablePersonnel
  const diffPersonnel = useMemo(()=>{
    if (!showDiff || !template) return tablePersonnel;
    const inTable = new Set(tablePersonnel.map(p=>p.id));
    const extra = [];
    // for day view: check relDay; for week view: check all 7 days
    const checkDays = view==='day'
      ? [curDate.getDay()===0?6:curDate.getDay()-1]
      : [0,1,2,3,4,5,6];
    for (const p of personnel) {
      if (inTable.has(p.id)) continue;
      const hasInTpl = checkDays.some(wd=>{
        const d = template.data[wd];
        return d && d[p.name] && Object.values(d[p.name]).some(v=>v>0);
      });
      if (hasInTpl) extra.push(p);
    }
    return [...tablePersonnel, ...extra];
  },[showDiff, template, tablePersonnel, personnel, view, curDate]);
  const todayStr= fmt(new Date());

  /* ── Record helpers ── */
  function getCount(dateStr, pid, tid) { return records?.[dateStr]?.[pid]?.[tid] || 0; }
  function getTplCount(relDay, personName, typeName) {
    return template?.data?.[relDay]?.[personName]?.[typeName] || 0;
  }
  function dayHours(dateStr, pid) {
    const dr = records?.[dateStr]?.[pid] || {};
    return types.reduce((s,t)=>s+(dr[t.id]||0)*t.hours, 0);
  }
  function weekHours(pid) {
    return wDates.reduce((s,d)=>s+dayHours(fmt(d),pid), 0);
  }
  function totalHoursEver(pid) {
    return Object.keys(records).reduce((s,d)=>s+dayHours(d,pid), 0);
  }
  function sidebarHours(pid) {
    if (view==='day') return dayHours(curStr, pid);
    return weekHours(pid);
  }

  function update(dateStr, pid, tid, delta) {
    setRecords(prev => {
      const r = JSON.parse(JSON.stringify(prev));
      r[dateStr] = r[dateStr] || {};
      r[dateStr][pid] = r[dateStr][pid] || {};
      const cur = r[dateStr][pid][tid] || 0;
      const nxt = Math.max(0, cur + delta);
      if (nxt===0) {
        delete r[dateStr][pid][tid];
        if (!Object.keys(r[dateStr][pid]).length) delete r[dateStr][pid];
        if (!Object.keys(r[dateStr]).length) delete r[dateStr];
      } else {
        r[dateStr][pid][tid] = nxt;
      }
      return r;
    });
  }

  function navigate(delta) {
    setCurDate(d => addDays(d, view==='week' ? delta*7 : delta));
  }

  /* ── Date label ── */
  const dateLabel = useMemo(() => {
    if (view==='day') {
      return `${curDate.getFullYear()}年${curDate.getMonth()+1}月${curDate.getDate()}日 ${WD_FULL[curDate.getDay()]}`;
    }
    const sun = wDates[6];
    return `${monday.getMonth()+1}月${monday.getDate()}日 — ${sun.getMonth()+1}月${sun.getDate()}日`;
  }, [curDate, view, monday, wDates]);

  const isCurrentToday = view==='day' && curStr===todayStr;
  const isCurrentWeekHasToday = view==='week' && wDates.some(d=>fmt(d)===todayStr);
  const stats = {
    totalRecordDays: Object.keys(records).length,
    totalEntries: Object.values(records).reduce((sum, day) =>
      sum + Object.values(day).reduce((ss, person) =>
        ss + Object.values(person).reduce((n,v)=>n+(parseInt(v,10)||0),0), 0), 0),
    aliasRuleCount: Object.keys(scheduleRules.personAliases).length,
    parserRuleCount: scheduleRules.typeRules.length + scheduleRules.weekdayRules.length + scheduleRules.ignoreRules.length,
  };

  /* ── Export Excel ── */
  function exportExcel(mode, rangeStart, rangeEnd, bonusHours = {}) {
    let allDates = Object.keys(records).sort();
    if (!allDates.length) { alert('暂无记录可导出'); return; }
    if (rangeStart) allDates = allDates.filter(d=>d>=rangeStart);
    if (rangeEnd)   allDates = allDates.filter(d=>d<=rangeEnd);
    if (!allDates.length) { alert('所选时间段内无记录'); return; }
    const wb = XLSX.utils.book_new();

    /* Sheet: 小时统计(按日) */
    if (mode==='day'||mode==='both') {
      const hdr = ['姓名', ...allDates.map(d=>d.slice(5)), '奖励工时(h)', '合计(h)'];
      const body = personnel.map(p => {
        let tot=0;
        const bonus = parseFloat(bonusHours[p.id]) || 0;
        const row = [p.name, ...allDates.map(d=>{ const h=dayHours(d,p.id); tot+=h; return h||0; }), bonus||0, tot + bonus];
        return row;
      });
      const bonusTotal = personnel.reduce((s,p)=>s+(parseFloat(bonusHours[p.id])||0),0);
      const foot = ['合计', ...allDates.map(d=>personnel.reduce((s,p)=>s+dayHours(d,p.id),0)),
                    bonusTotal,
                    personnel.reduce((s,p)=>s+allDates.reduce((h,d)=>h+dayHours(d,p.id),0),0) + bonusTotal];
      const ws = XLSX.utils.aoa_to_sheet([hdr,...body,foot]);
      _styleSheet(ws, allDates.length+2);
      XLSX.utils.book_append_sheet(wb, ws, '小时统计(按日)');
    }

    /* Sheet: 小时统计(按周) */
    if (mode==='week'||mode==='both') {
      const weekMap = {};
      for (const d of allDates) {
        const mon = getMonday(new Date(d));
        const key = fmt(mon);
        const sun = addDays(mon,6);
        if (!weekMap[key]) weekMap[key]={label:`${fmtMid(mon)}~${fmtMid(sun)}`,dates:[]};
        weekMap[key].dates.push(d);
      }
      const wks = Object.keys(weekMap).sort();
      const hdr = ['姓名', ...wks.map(k=>weekMap[k].label), '奖励工时(h)', '合计(h)'];
      const body = personnel.map(p => {
        let tot=0;
        const bonus = parseFloat(bonusHours[p.id]) || 0;
        const row = [p.name, ...wks.map(k=>{ const h=weekMap[k].dates.reduce((s,d)=>s+dayHours(d,p.id),0); tot+=h; return h||0; }), bonus||0, tot + bonus];
        return row;
      });
      const bonusTotal = personnel.reduce((s,p)=>s+(parseFloat(bonusHours[p.id])||0),0);
      const foot = ['合计', ...wks.map(k=>personnel.reduce((s,p)=>s+weekMap[k].dates.reduce((ss,d)=>ss+dayHours(d,p.id),0),0)),
                    bonusTotal,
                    body.reduce((s,row)=>s+(parseFloat(row[row.length-1])||0),0)];
      const ws = XLSX.utils.aoa_to_sheet([hdr,...body,foot]);
      XLSX.utils.book_append_sheet(wb, ws, '小时统计(按周)');
    }

    /* Sheet: 工时明细 (importable raw data) */
    {
      const hdr = ['姓名','日期', ...types.map(t=>`${t.name}(次)`), ...types.map(t=>`${t.name}(h)`), '总计(h)'];
      const rows = [];
      for (const d of allDates) {
        for (const p of personnel) {
          const dr = records?.[d]?.[p.id];
          if (!dr) continue;
          const row = [p.name, d,
            ...types.map(t=>dr[t.id]||0),
            ...types.map(t=>(dr[t.id]||0)*t.hours),
            dayHours(d,p.id)];
          rows.push(row);
        }
      }
      if (rows.length) {
        const ws = XLSX.utils.aoa_to_sheet([hdr,...rows]);
        XLSX.utils.book_append_sheet(wb, ws, '工时明细');
      }
    }

    XLSX.writeFile(wb, `工时统计_${fmt(new Date())}.xlsx`);
  }

  function _styleSheet(ws, colCount) {
    // Set column widths
    ws['!cols'] = [{ wch:10 }, ...Array(colCount).fill({ wch:8 })];
  }

  /* ── Import Records ── */
  function handleImportRecords(e) {
    const file = e.target.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const wb = XLSX.read(ev.target.result, {type:'binary'});
        const shName = wb.SheetNames.find(n=>n.includes('明细')) || wb.SheetNames[0];
        const ws = wb.Sheets[shName];
        const rows = XLSX.utils.sheet_to_json(ws, {header:1,defval:0});
        if (rows.length < 2) { alert('表格格式不正确，请导入"工时明细"表'); return; }
        const hdr = rows[0];
        // Find type columns (after 姓名, 日期)
        const typeNames = types.map(t=>t.name);
        const typeColIdxs = typeNames.map(n => hdr.findIndex(h=>String(h).startsWith(n)&&String(h).endsWith('次)')));
        const newRec = JSON.parse(JSON.stringify(records));
        let count = 0;
        for (let i=1;i<rows.length;i++) {
          const row = rows[i];
          const name = String(row[0]||'').trim();
          const date = String(row[1]||'').trim();
          if (!name||!date||!/^\d{4}-\d{2}-\d{2}$/.test(date)) continue;
          const person = personnel.find(p=>p.name===name);
          if (!person) continue;
          types.forEach((t,j) => {
            const idx = typeColIdxs[j];
            if (idx<0) return;
            const cnt = parseInt(row[idx])||0;
            if (cnt>0) {
              newRec[date]=newRec[date]||{};
              newRec[date][person.id]=newRec[date][person.id]||{};
              newRec[date][person.id][t.id]=cnt;
              count++;
            }
          });
        }
        setRecords(newRec);
        alert(`✅ 导入完成，共导入 ${count} 条记录`);
      } catch(err) { alert('导入失败：'+err.message); }
    };
    reader.readAsBinaryString(file);
    e.target.value='';
  }

  /* ── Template import ── */
  function handleImportTemplate(e) {
    const file = e.target.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const wb = XLSX.read(ev.target.result, {type:'binary'});
        const shName = wb.SheetNames.find(n=>n.includes('明细')) || wb.SheetNames[0];
        const ws = wb.Sheets[shName];
        const rows = XLSX.utils.sheet_to_json(ws, {header:1, defval:0});
        if (rows.length < 2) { alert('表格格式不正确'); return; }
        const hdr = rows[0];
        const typeNames = types.map(t=>t.name);
        const typeColIdxs = typeNames.map(n=>hdr.findIndex(h=>String(h).startsWith(n)&&String(h).endsWith('次)')));
        // Parse dates, compute weekday offset (Mon=0..Sun=6)
        const data = {}; // {relDay: {personName: {typeName: count}}}
        let count = 0;
        for (let i=1;i<rows.length;i++) {
          const row = rows[i];
          const name = String(row[0]||'').trim();
          const dateStr = String(row[1]||'').trim();
          if (!name||!dateStr||!/^\d{4}-\d{2}-\d{2}$/.test(dateStr)) continue;
          const d = new Date(dateStr);
          const dow = d.getDay(); // 0=Sun
          const relDay = dow===0 ? 6 : dow-1; // Mon=0..Sun=6
          if (!data[relDay]) data[relDay]={};
          if (!data[relDay][name]) data[relDay][name]={};
          types.forEach((t,j)=>{
            const idx=typeColIdxs[j]; if(idx<0) return;
            const cnt=parseInt(row[idx])||0;
            if(cnt>0){ data[relDay][name][t.name]=cnt; count++; }
          });
        }
        if (!count) { alert('未在模板中找到有效工时数据'); return; }
        setTemplate({name: file.name.replace(/\.[^.]+$/,''), data});
        alert(`✅ 模板「${file.name}」已缓存（${count} 条），切换到目标日期/周后点击「应用模板」覆盖`);
      } catch(err) { alert('导入失败：'+err.message); }
    };
    reader.readAsBinaryString(file);
    e.target.value='';
  }

  /* ── Apply template to current view ── */
  function applyTemplate() {
    if (!template) return;
    const apply = () => {
      setRecords(prev => {
        const r = JSON.parse(JSON.stringify(prev));
        const applyDay = (dateStr, relDay) => {
          const dayData = template.data[relDay];
          if (!dayData) return;
          for (const p of personnel) {
            const pData = dayData[p.name];
            if (!pData) continue;
            r[dateStr] = r[dateStr] || {};
            r[dateStr][p.id] = r[dateStr][p.id] || {};
            for (const t of types) {
              if (pData[t.name] != null) {
                r[dateStr][p.id][t.id] = pData[t.name];
              }
            }
          }
        };
        if (view==='week') {
          wDates.forEach((d,i) => applyDay(fmt(d), i));
        } else {
          const dow = curDate.getDay();
          const relDay = dow===0?6:dow-1;
          applyDay(curStr, relDay);
        }
        return r;
      });
      setModal(null);
    };
    setConfirmCb(()=>apply);
    setModal('confirm-tpl');
  }

  /* ── Visibility helpers ── */
  function toggleHidden(id) {
    setHiddenIds(prev => {
      const n = new Set(prev);
      n.has(id) ? n.delete(id) : n.add(id);
      return n;
    });
  }
  function hideUnworked() {
    setHiddenIds(prev => {
      const n = new Set(prev);
      for (const p of personnel) {
        const h = view==='day' ? dayHours(curStr, p.id) : weekHours(p.id);
        if (h === 0) n.add(p.id);
      }
      return n;
    });
  }
  function showAll() { setHiddenIds(new Set()); setAutoHide(false); }

  /* ── Remove person ── */
  function removePerson(id) {
    setPersonnel(prev=>prev.filter(p=>p.id!==id));
  }

  /* ── Clear records only ── */
  function clearAll() {
    setConfirmCb(()=>()=>{ setRecords({}); setModal(null); });
    setModal('confirm');
  }

  /* ── Clear ALL data ── */
  function clearAllData() {
    setConfirmCb(()=>()=>{
      setRecords({}); setPersonnel([]); setTypes(DEF_TYPES);
      setHiddenIds(new Set()); setTemplate(null);
      localStorage.removeItem('wh_hidden');
      setModal(null);
    });
    setModal('confirm-all');
  }

  /* ══ RENDER ══ */
  return (
    <div style={{display:'flex',flexDirection:'column',height:'100vh'}}>

      {/* ── Header ── */}
      <div className="header">
        <div className="logo"><span>⏱</span>工时统计系统</div>
        <div className="sep"/>

        <div className="view-toggle">
          <button className={view==='day'?'active':''} onClick={()=>setView('day')}>按天</button>
          <button className={view==='week'?'active':''} onClick={()=>setView('week')}>按周</button>
        </div>

        <div className="date-nav">
          <button className="btn-icon" onClick={()=>navigate(-1)}>‹</button>
          <CalendarPicker
            curDate={curDate}
            setCurDate={setCurDate}
            view={view}
            records={records}
            dateLabel={dateLabel}
            isHighlight={isCurrentToday||isCurrentWeekHasToday}
          />
          <button className="btn-icon" onClick={()=>navigate(1)}>›</button>
          <button className="btn btn-sm" onClick={()=>setCurDate(new Date())}>今天</button>
        </div>

        <div className="spacer"/>

        {template && (
          <div className="tpl-badge">
            <span>📋</span>
            <span className="tpl-name" title={template.name}>{template.name}</span>
            <button className="btn btn-sm" style={{padding:'1px 7px',fontSize:'11px'}} onClick={applyTemplate}>应用模板</button>
            <span style={{cursor:'pointer',fontSize:'12px',opacity:.7}} onClick={()=>setTemplate(null)}>✕</span>
          </div>
        )}
        <div className="sep"/>
        <button className="btn btn-sm" onClick={()=>setModal('types')}>⚙ 工时类型</button>
        <button className="btn btn-sm" onClick={()=>setModal('people')}>👥 人员</button>
        <input ref={importPplRef} type="file" accept=".xlsx,.xls,.csv" style={{display:'none'}}/>
        <input ref={importRecRef} type="file" accept=".xlsx,.xls" style={{display:'none'}} onChange={handleImportRecords}/>
        <input ref={importTplRef} type="file" accept=".xlsx,.xls" style={{display:'none'}} onChange={handleImportTemplate}/>
        <button className="btn btn-sm" onClick={()=>importRecRef.current.click()}>📂 导入记录</button>
        <button className="btn btn-sm" style={{color:'var(--yellow)',borderColor:'var(--yellow)'}} onClick={()=>importTplRef.current.click()}>📋 导入模板</button>
        <button className="btn btn-sm" style={{color:'var(--green)',borderColor:'var(--green)'}} onClick={()=>setModal('schedule')}>📅 排班转模板</button>
        <button className="btn btn-sm btn-primary" onClick={()=>setModal('export')}>📊 导出</button>
        <button className="theme-btn" onClick={()=>setTheme(t=>t==='dark'?'light':'dark')} title="切换主题">
          {theme==='dark'?'☀️':'🌙'}
        </button>
      </div>

      <div className="app-body">

        {/* ── Sidebar ── */}
        <div className="sidebar">
          <div className="sidebar-head">
            <div className="search-wrap">
              <input placeholder="搜索姓名 / 拼音首字母…" value={search} onChange={e=>setSearch(e.target.value)}/>
              {search && (
                <span onClick={()=>setSearch('')} style={{
                  position:'absolute',right:'7px',cursor:'pointer',fontSize:'13px',
                  color:'var(--muted)',lineHeight:1,userSelect:'none',padding:'2px'
                }} title="清空搜索">✕</span>
              )}
            </div>
          </div>

          {/* Visibility toolbar */}
          <div className="sidebar-toolbar">
            {/* Auto-hide toggle */}
            <label style={{display:'flex',alignItems:'center',gap:'4px',cursor:'pointer',
              fontSize:'10px',padding:'2px 4px',borderRadius:'var(--radius)',
              border:'1px solid var(--border)',background: autoHide?'var(--yellow)22':'var(--surface2)',
              color: autoHide?'var(--yellow)':'var(--muted)',transition:'all .15s',flex:1,
              userSelect:'none'}}

            </button>
          </div>
          <div className="sidebar-toolbar" style={{gap:'4px'}}>

                const allHidden = filtered.every(p=>hiddenIds.has(p.id));

                  const n=new Set(prev);
                  filtered.forEach(p=>allHidden?n.delete(p.id):n.add(p.id));
                  return n;
                });
              }} style={{flex:1}} title="切换当前列表全选/全不选">
              {filtered.every(p=>hiddenIds.has(p.id))?'✓ 全选显示':'— 全部隐藏'}

      {modal==='confirm'    && <ConfirmModal msg="确认清空所有记录？此操作不可撤销。" onOk={confirmCb} close={()=>setModal(null)}/>}
      {modal==='confirm-all'&& <ConfirmModal msg="将清空全部数据：所有工时记录、人员名单（工时类型恢复默认）。此操作不可撤销！" onOk={confirmCb} close={()=>setModal(null)} okLabel="全部清空"/>}

      {modal==='view-tpl'   && <TemplateViewModal template={template} types={types} onClear={()=>{setTemplate(null);setModal(null);}} close={()=>setModal(null)}/>}
    </div>
  );
}

/* ═══ Day View ══════════════════════════════════════════════════════════════ */
function DayView({ personnel, types, dateStr, getCount, update, dayHours, showDiff, getTplCount, curDate }) {
  if (!personnel.length) return (
    <div className="empty"><div className="icon">👥</div><p>暂无人员，点击左下角「+ 人员」或「导入人员」</p></div>
  );
  if (!types.length) return (
    <div className="empty"><div className="icon">⚙</div><p>暂无工时类型，请先在「工时类型」中添加</p></div>
  );
  const d = curDate ? curDate : new Date(dateStr);
  const relDay = d.getDay()===0 ? 6 : d.getDay()-1;

  function diffBadge(delta) {
    if (!showDiff) return null;
    const cls = delta>0?'pos':delta<0?'neg':'zero';
    const label = delta>0?`+${delta}`:delta<0?`${delta}`:'=';
    return <span className={`diff-badge ${cls}`}>{label}</span>;
  }

  return (
    <div className={`grid-wrap${showDiff?' diff-on':''}`}>
      <table className="grid-table">
        <thead>
          <tr>
            <th className="col-name">姓名</th>
            {types.map(t=>(
              <th key={t.id} className="th-type" style={{borderTopColor:t.color,minWidth:'130px'}}>
                <div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:'2px'}}>
                  <span style={{color:t.color}}>{t.name}</span>
                  <span style={{fontSize:'11px',color:'var(--muted)',fontWeight:400}}>{t.hours} h / 次</span>
                </div>
              </th>
            ))}
            <th className="col-total" style={{minWidth:'75px'}}>合计(h)</th>
          </tr>
        </thead>
        <tbody>
          {personnel.map(p => {
            const th = dayHours(dateStr, p.id);
            return (
              <tr key={p.id}>
                <td className="col-name">{p.name}</td>
                {types.map(t => {
                  const cnt = getCount(dateStr, p.id, t.id);
                  const tplCnt = showDiff ? getTplCount(relDay, p.name, t.name) : 0;
                  const delta = cnt - tplCnt;
                  return (
                    <td key={t.id}>
                      <div className="counter-wrap" style={{position:'relative'}}>
                        <button className="cbtn minus" disabled={cnt===0}
                          onClick={()=>update(dateStr,p.id,t.id,-1)}>−</button>
                        <div>
                          <div className="cval" style={{color:cnt>0?t.color:'var(--muted)'}}>{cnt}</div>
                          {cnt>0&&<div className="chours">{(cnt*t.hours).toFixed(1)}h</div>}
                        </div>
                        <button className="cbtn plus" onClick={()=>update(dateStr,p.id,t.id,1)}>+</button>
                        {showDiff && (cnt>0||tplCnt>0) && diffBadge(delta)}
                      </div>
                    </td>
                  );
                })}
                <td className="col-total" style={{fontSize:'15px'}}>
                  {th>0 ? th.toFixed(1) : <span style={{color:'var(--muted)'}}>—</span>}
                </td>
              </tr>
            );
          })}
          {/* Totals row */}
          <tr className="row-total">
            <td className="col-name">合计</td>
            {types.map(t=>{
              const cnt = personnel.reduce((s,p)=>s+getCount(dateStr,p.id,t.id),0);
              const hrs = cnt * t.hours;
              return (
                <td key={t.id} style={{fontFamily:"'SF Mono','Consolas',monospace",fontSize:'12px'}}>
                  {cnt>0 ? <><span style={{color:t.color}}>{cnt}次</span><span style={{color:'var(--muted)'}}> / {hrs.toFixed(1)}h</span></> : <span style={{color:'var(--muted)'}}>—</span>}
                </td>
              );
            })}
            <td style={{fontFamily:"'SF Mono','Consolas',monospace",fontSize:'15px',color:'var(--yellow)',fontWeight:700}}>
              {personnel.reduce((s,p)=>s+dayHours(dateStr,p.id),0).toFixed(1)}
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  );
}

/* ═══ Week View ═════════════════════════════════════════════════════════════ */
function WeekView({ personnel, types, wDates, dayHours, setCurDate, setView, showDiff, getTplCount, template, records, update, weekMode, setWeekMode }) {
  const wTotal = (pid) => wDates.reduce((s,d)=>s+dayHours(fmt(d),pid), 0);
  const colTotal = (d) => personnel.reduce((s,p)=>s+dayHours(fmt(d),p.id), 0);
  const grandTotal = () => wDates.reduce((s,d)=>s+colTotal(d), 0);
  const [activeDay, setActiveDay] = useState(0);
  const [reviseQuery, setReviseQuery] = useState('');
  const [revisePersonId, setRevisePersonId] = useState('');
  const [reviseZoom, setReviseZoom] = useState(1);
  const [selectedSlotKey, setSelectedSlotKey] = useState('');
  const [slotOverrides, setSlotOverrides] = useState({});
  const reviseTopScrollRef = useRef(null);
  const reviseGridWrapRef = useRef(null);
  const reviseInlineInputRef = useRef(null);
  const revisionCacheKey = useMemo(()=>{
    const weekStart = fmt(wDates[0] || new Date());
    const tplKey = template?.name || 'no-template';
    return `wh_revision_overrides::${tplKey}::${weekStart}`;
  },[template?.name, fmt(wDates[0] || new Date())]);

  function goDay(d) { setCurDate(new Date(d)); setView('day'); }

  // template hours for a person on a weekday (sum across all types)
  function tplDayHours(personName, relDay) {
    if (!template || !getTplCount) return 0;
    const dayData = template.data?.[relDay]?.[personName];
    if (!dayData) return 0;
    return Object.entries(dayData).reduce((s,[tn,cnt])=>{
      const t = types.find(t=>t.name===tn);
      return s + (t ? cnt*t.hours : 0);
    }, 0);
  }

  useEffect(()=>{
    setReviseQuery('');
    setRevisePersonId('');
  },[activeDay]);

  useEffect(()=>{
    setSelectedSlotKey('');
    setReviseQuery('');
    setRevisePersonId('');
    setSlotOverrides(()=>{
      if (!template) return {};
      return loadLS(revisionCacheKey, {});
    });
  },[template, revisionCacheKey]);

  useEffect(()=>{
    if (!template) return;
    localStorage.setItem(revisionCacheKey, JSON.stringify(slotOverrides || {}));
  },[template, revisionCacheKey, slotOverrides]);

  useEffect(()=>{
    if (selectedSlotKey && reviseInlineInputRef.current) reviseInlineInputRef.current.focus();
  },[selectedSlotKey]);

  const reviseCandidates = useMemo(()=>{
    const source = reviseQuery.trim()
      ? personnel.filter(p=>matchSearch(p.name, reviseQuery.trim()))
      : personnel;
    return source.slice(0, 18);
  },[personnel, reviseQuery]);

  const personIndex = useMemo(()=>Object.fromEntries(personnel.map(p=>[p.name, p])), [personnel]);
  const typeIndexByName = useMemo(()=>Object.fromEntries(types.map(t=>[t.name, t])), [types]);
  const previewMeta = template?.preview || null;
  const previewSlotEntries = useMemo(()=>{
    if (!previewMeta?.cellSlotMap) return [];
    return Object.entries(previewMeta.cellSlotMap)
      .map(([key, slot])=>{
        const [r, c] = key.split(',').map(Number);
        return { key, r, c, ...slot };
      })
      .sort((a,b)=>a.r-b.r || a.c-b.c);
  },[previewMeta]);

  const slotAssignments = useMemo(()=>{
    if (!previewSlotEntries.length) return { byKey:{}, extrasByDay:{} };
    const baselinePools = {};
    Object.entries(template?.data || {}).forEach(([wd, dayMap])=>{
      baselinePools[wd] = baselinePools[wd] || {};
      Object.entries(dayMap || {}).forEach(([personName, typeMap])=>{
        Object.entries(typeMap || {}).forEach(([typeName, cnt])=>{
          baselinePools[wd][typeName] = baselinePools[wd][typeName] || [];
          for (let i=0; i<(cnt || 0); i++) baselinePools[wd][typeName].push(personName);
        });
      });
      Object.values(baselinePools[wd]).forEach(arr=>arr.sort((a,b)=>a.localeCompare(b, 'zh')));
    });
    const byKey = {};
    for (const slot of previewSlotEntries) {
      const baseQueue = baselinePools[slot.weekday]?.[slot.typeName] || [];
      const baselinePerson = baseQueue.length ? baseQueue.shift() : null;
      const override = slotOverrides[slot.key];
      let currentPerson, state;
      if (override === 'empty') {
        currentPerson = null;
        state = 'removed';
      } else if (typeof override === 'string') {
        currentPerson = override;
        state = override === baselinePerson ? 'original' : 'changed';
      } else {
        currentPerson = baselinePerson;
        state = baselinePerson ? 'original' : 'empty';
      }
      byKey[slot.key] = { ...slot, baselinePerson, currentPerson, state };
    }

    const slotConsumed = {};
    Object.values(byKey).forEach(slot=>{
      if (!slot.currentPerson) return;
      slotConsumed[slot.weekday] = slotConsumed[slot.weekday] || {};
      slotConsumed[slot.weekday][slot.typeName] = slotConsumed[slot.weekday][slot.typeName] || [];
      slotConsumed[slot.weekday][slot.typeName].push(slot.currentPerson);
    });

    const recordCounts = {};
    wDates.forEach((d, wd)=>{
      const dayRec = records?.[fmt(d)] || {};
      types.forEach(t=>{
        personnel.forEach(p=>{
          const cnt = dayRec[p.id]?.[t.id] || 0;
          if (!cnt) return;
          recordCounts[wd] = recordCounts[wd] || {};
          recordCounts[wd][t.name] = recordCounts[wd][t.name] || {};
          recordCounts[wd][t.name][p.name] = (recordCounts[wd][t.name][p.name] || 0) + cnt;
        });
      });
    });

    const extrasByDay = {};
    Object.entries(recordCounts).forEach(([wd, typeMap])=>{
      Object.entries(typeMap).forEach(([typeName, personMap])=>{
        Object.entries(personMap).forEach(([personName, cnt])=>{
          const consumed = (slotConsumed[wd]?.[typeName] || []).filter(name=>name===personName).length;
          const extra = cnt - consumed;
          if (extra <= 0) return;
          extrasByDay[wd] = extrasByDay[wd] || [];
          extrasByDay[wd].push({ personName, typeName, count: extra });
        });
      });
    });
    return { byKey, extrasByDay };
  },[previewSlotEntries, slotOverrides, wDates, records, types, personnel, template]);

  if (!personnel.length) return (
    <div className="empty"><div className="icon">👥</div><p>暂无人员，请先导入</p></div>
  );

  function removeByNames(dateStr, personName, typeName, count=1) {
    const person = personIndex[personName];
    const type = typeIndexByName[typeName];
    if (!person || !type) return;
    for (let i=0; i<count; i++) update(dateStr, person.id, type.id, -1);
  }

  function addByNames(dateStr, personName, typeName, count=1) {
    const person = personIndex[personName];
    const type = typeIndexByName[typeName];
    if (!person || !type) return;
    for (let i=0; i<count; i++) update(dateStr, person.id, type.id, 1);
  }

  function handleRevisionSlotClick(slot) {
    const dateStr = fmt(wDates[slot.weekday]);
    setActiveDay(slot.weekday);
    if (selectedSlotKey === slot.key) {
      if (slot.currentPerson) removeByNames(dateStr, slot.currentPerson, slot.typeName, 1);
      if (slot.baselinePerson) addByNames(dateStr, slot.baselinePerson, slot.typeName, 1);
      setSlotOverrides(prev=>{ const next = {...prev}; delete next[slot.key]; return next; });
      setSelectedSlotKey('');
      return;
    }

    if (slot.currentPerson) {
      removeByNames(dateStr, slot.currentPerson, slot.typeName, 1);
      setSlotOverrides(prev=>({...prev, [slot.key]:'empty'}));
      setSelectedSlotKey('');
      return;
    }

    setSelectedSlotKey(slot.key);
    setReviseQuery('');
    setRevisePersonId('');
  }

  function addReplacementToSelectedSlot(personId = revisePersonId) {
    if (!selectedSlotKey || !personId) return;
    const slot = slotAssignments.byKey[selectedSlotKey];
    const targetPerson = personnel.find(p=>p.id===personId);
    if (!slot || !targetPerson) return;
    const dateStr = fmt(wDates[slot.weekday]);
    const targetTypeName = slot.typeName;
    if (slot.currentPerson) {
      removeByNames(dateStr, slot.currentPerson, targetTypeName, 1);
    }
    addByNames(dateStr, targetPerson.name, targetTypeName, 1);
    setSlotOverrides(prev=>({...prev, [selectedSlotKey]: targetPerson.name}));
    setSelectedSlotKey('');
    setReviseQuery('');
    setRevisePersonId('');
  }

  if (weekMode === 'revise') {
    const selectedSlot = slotAssignments.byKey[selectedSlotKey];

    if (!previewMeta?.rawGrid || !previewSlotEntries.length) {
      return (
        <div className="week-revision-shell">
          <div className="empty" style={{border:'1px solid var(--border)',borderRadius:16,background:'var(--surface)'}}>
            <div className="icon">🗂</div>
            <p>当前模板不含原始视图数据，无法进入原始 Excel 修订模式。</p>
          </div>
          <div className="rule-block" style={{marginBottom:0}}>
            <div className="rule-block-title">
              <strong>周修订模式</strong>
              <span style={{fontSize:'11px',color:'var(--muted)'}}>当前模板不带原始视图，请重新通过“排班转模板”生成一次模板。</span>
            </div>
            <div className="week-revision-form-row">
              <button className="btn" onClick={()=>setWeekMode('stats')}>回到周统计</button>
              <button className="btn" onClick={()=>goDay(wDates[activeDay])}>切到按天</button>
            </div>
          </div>
        </div>
      );
    }

    const mergeStarts = {};
    const mergeSkips = new Set();
    const mergedRows = new Set();
    const merges = previewMeta.rawMerges || [];
    const rawGrid = previewMeta.rawGrid || [];
    let maxR = rawGrid.length - 1;
    let maxC = (rawGrid[0]?.length || 1) - 1;
    for (const m of merges) {
      const rowSpan = m.e.r - m.s.r + 1;
      const colSpan = m.e.c - m.s.c + 1;
      mergeStarts[`${m.s.r},${m.s.c}`] = { rowSpan, colSpan };
      for (let rr=m.s.r; rr<=m.e.r; rr++) {
        mergedRows.add(rr);
        for (let cc=m.s.c; cc<=m.e.c; cc++) {
          if (rr===m.s.r && cc===m.s.c) continue;
          mergeSkips.add(`${rr},${cc}`);
        }
      }
    }
    const HEADER_KW_VALS = new Set(['签到','楼层','负责人','值班','洗板擦布','洗抹布','洗板','时间']);
    const displayRows = [];
    let blankRun = [];
    const flushBlankRun = () => {
      if (!blankRun.length) return;
      if (blankRun.length > 5) {
        blankRun.slice(0,2).forEach(r=>displayRows.push({type:'row', r}));
        displayRows.push({type:'collapsed', count: blankRun.length - 4});
        blankRun.slice(-2).forEach(r=>displayRows.push({type:'row', r}));
      } else blankRun.forEach(r=>displayRows.push({type:'row', r}));
      blankRun = [];
    };
    for (let r=0; r<=maxR; r++) {
      const rowHasData = Array.from({length:maxC+1},(_,cc)=>rawGrid[r]?.[cc]?.val).some(Boolean);
      const collapsibleBlank = !rowHasData && !mergedRows.has(r);
      if (collapsibleBlank) blankRun.push(r);
      else { flushBlankRun(); displayRows.push({type:'row', r}); }
    }
    flushBlankRun();

    function excelColName(idx) {
      let n = idx + 1;
      let s = '';
      while (n > 0) {
        const rem = (n - 1) % 26;
        s = String.fromCharCode(65 + rem) + s;
        n = Math.floor((n - 1) / 26);
      }
      return s;
    }
    function withAlpha(color, alpha='22') {
      if (!color) return null;
      if (color.startsWith('#') && color.length === 7) return `${color}${alpha}`;
      return color;
    }
    const colWidths = Array.from({length:maxC+1}, (_,cc)=>{
      let longest = excelColName(cc).length;
      for (const row of displayRows) {
        if (row.type !== 'row') continue;
        if (mergeSkips.has(`${row.r},${cc}`)) continue;
        const span = mergeStarts[`${row.r},${cc}`];
        if (span?.colSpan > 1) continue;
        longest = Math.max(longest, String(rawGrid[row.r]?.[cc]?.val || '').length);
      }
      return Math.max(72, Math.min(240, longest * 11 + 24));
    });
    const tableWidth = 48 + colWidths.reduce((s, w)=>s+w, 0);

    function getSlotCellView(key, defaultVal) {
      const slot = slotAssignments.byKey[key];
      if (!slot) {
        if (previewMeta.cellMatchType?.[key] === 'type') {
          const hitType = types.find(t=>t.name===previewMeta.cellTypeName?.[key]);
          return {
            label: defaultVal,
            style: hitType ? { background:withAlpha(hitType.color,'18'), color:hitType.color, border:`1px solid ${withAlpha(hitType.color,'66')}`, fontWeight:700 } : {},
            className:'',
            clickable:false,
          };
        }
        if (previewMeta.cellMatchType?.[key] === 'unmatched') {
          return { label:defaultVal, style:{background:'var(--yellow)18', color:'var(--yellow)', border:'1px solid var(--yellow)'}, className:'', clickable:false };
        }
        if (HEADER_KW_VALS.has(defaultVal)) {
          return { label:defaultVal, style:{background:'var(--surface2)', color:'var(--muted)', fontStyle:'italic'}, className:'', clickable:false };
        }
        return { label:defaultVal, style:{}, className:'', clickable:false };
      }
      const hitType = typeIndexByName[slot.typeName];
      const isSelected = selectedSlotKey === key;
      const displayName = slot.currentPerson || '';
      const isChanged = slot.state === 'changed';
      const isRemoved = slot.state === 'removed';
      const className = `week-revision-grid-cell${isRemoved?' removed':''}${showDiff && isChanged?' changed':''}${isSelected?' selected':''}`;
      const style = hitType ? {
        background: slot.currentPerson ? withAlpha(hitType.color,'22') : 'rgba(248,81,73,.08)',
        color: slot.currentPerson ? hitType.color : 'var(--red)',
        border: `1px solid ${withAlpha(hitType.color,'88')}`,
        fontWeight:700,
      } : {};
      let hint;
      if (isSelected) hint = '再次点击：恢复模板原数据';
      else if (slot.currentPerson) hint = `点击清空「${slot.currentPerson}」`;
      else hint = '点击选中此槽位，直接在当前位置搜索替补人员';
      return { label:displayName, style, className, clickable:true, slot, hint, isSelected };
    }

    return (
      <div className="week-revision-shell">
        <div className="rule-block" style={{marginBottom:0}}>
          <div className="rule-block-title">
            <strong>原始视图修订</strong>
            <span style={{fontSize:'11px',color:'var(--muted)'}}>与原 Excel 布局一致；第 1 下删除原人名，第 2 下选中待替换，第 3 下恢复模板原数据</span>
          </div>
          <div className="preview-toolbar">
            <button className="btn btn-sm" onClick={()=>setReviseZoom(z=>Math.max(0.6, +(z - 0.1).toFixed(2)))}>缩小</button>
            <span className="zoom-label">{Math.round(reviseZoom * 100)}%</span>
            <button className="btn btn-sm" onClick={()=>setReviseZoom(z=>Math.min(2, +(z + 0.1).toFixed(2)))}>放大</button>
            <button className="btn btn-sm" onClick={()=>setReviseZoom(1)}>重置</button>
            <button className="btn btn-sm" onClick={()=>goDay(wDates[activeDay])}>切到按天</button>
            <button className="btn btn-sm" onClick={()=>setWeekMode('stats')}>回到周统计</button>
            <span className={`flow-badge ${showDiff ? 'active' : 'todo'}`}>{showDiff ? '差异已显示' : '可打开差异'}</span>
            <span style={{fontSize:'11px',color:'var(--muted)'}}>
              替换边框会随主题切换：深色主题用白框，浅色主题用黑框；空红框表示该槽位已被清空等待补人。点第 2 下后，搜索框会直接出现在槽位位置。
            </span>
          </div>
          <div
            className="raw-grid-scroll-top"
            ref={reviseTopScrollRef}
            onScroll={e=>{ if (reviseGridWrapRef.current && reviseGridWrapRef.current.scrollLeft !== e.currentTarget.scrollLeft) reviseGridWrapRef.current.scrollLeft = e.currentTarget.scrollLeft; }}
          >
            <div style={{width:tableWidth * reviseZoom, height:1}} />
          </div>
          <div
            className="raw-grid-wrap raw-grid-wrap-lg"
            ref={reviseGridWrapRef}
            onScroll={e=>{ if (reviseTopScrollRef.current && reviseTopScrollRef.current.scrollLeft !== e.currentTarget.scrollLeft) reviseTopScrollRef.current.scrollLeft = e.currentTarget.scrollLeft; }}
            style={{maxHeight:'calc(100vh - 250px)'}}
          >
            <div style={{zoom:reviseZoom}}>
            <table className="raw-grid">
              <colgroup>
                <col style={{width:48}} />
                {colWidths.map((w, idx)=><col key={idx} style={{width:w}} />)}
              </colgroup>
              <thead>
                <tr>
                  <th className="row-hdr">#</th>
                  {Array.from({length:maxC+1},(_,i)=><th key={i}>{excelColName(i)}</th>)}
                </tr>
              </thead>
              <tbody>
                {displayRows.map((row, idx)=> row.type === 'collapsed' ? (
                  <tr key={`collapsed-${idx}`}>
                    <td className="row-hdr">…</td>
                    <td className="cell-collapsed" colSpan={maxC+1}>已折叠 {row.count} 行连续空白行</td>
                  </tr>
                ) : (
                  <tr key={row.r}>
                    <td className="row-hdr">{row.r+1}</td>
                    {Array.from({length:maxC+1},(_,cc)=>{
                      const key = `${row.r},${cc}`;
                      if (mergeSkips.has(key)) return null;
                      const span = mergeStarts[key];
                      const val = rawGrid[row.r]?.[cc]?.val || '';
                      const viewInfo = getSlotCellView(key, val);
                      const wd = viewInfo.slot?.weekday;
                      const isActiveDay = typeof wd === 'number' && wd === activeDay;
                      return (
                        <td
                          key={cc}
                          rowSpan={span?.rowSpan}
                          colSpan={span?.colSpan}
                          className={viewInfo.className + (isActiveDay ? ' active-day' : '')}
                          style={viewInfo.style}
                          title={viewInfo.hint || (viewInfo.slot ? `${WD[viewInfo.slot.weekday]} · ${viewInfo.slot.typeName}` : val)}
                          onClick={viewInfo.clickable ? ()=>handleRevisionSlotClick(viewInfo.slot) : undefined}
                        >
                          <div className="week-slot-cell-inner">
                            {viewInfo.label}
                            {viewInfo.isSelected && (
                              <div className="week-slot-editor" onClick={e=>e.stopPropagation()}>
                                <div className="week-slot-editor-head">
                                  <strong>{WD[viewInfo.slot.weekday]} · {viewInfo.slot.typeName}</strong>
                                  <span>模板：{viewInfo.slot.baselinePerson || '空槽位'}</span>
                                </div>
                                <input
                                  ref={reviseInlineInputRef}
                                  className="inp"
                                  value={reviseQuery}
                                  placeholder={`输入替补人员，可搜姓名 / 拼音首字母`}
                                  onChange={e=>{
                                    setReviseQuery(e.target.value);
                                    setRevisePersonId('');
                                  }}
                                  onKeyDown={e=>{
                                    if (e.key === 'Enter') {
                                      e.preventDefault();
                                      const exact = reviseCandidates.find(p=>p.name===reviseQuery.trim());
                                      const fallback = reviseCandidates[0];
                                      const chosen = exact || fallback;
                                      if (chosen) addReplacementToSelectedSlot(chosen.id);
                                    } else if (e.key === 'Escape') {
                                      e.preventDefault();
                                      setSelectedSlotKey('');
                                      setReviseQuery('');
                                      setRevisePersonId('');
                                    }
                                  }}
                                />
                                <div className="week-slot-editor-suggestions">
                                  {reviseCandidates.map(p=>(
                                    <button
                                      type="button"
                                      key={p.id}
                                      className={`week-slot-editor-chip${revisePersonId===p.id?' active':''}`}
                                      onClick={()=>{
                                        setRevisePersonId(p.id);
                                        addReplacementToSelectedSlot(p.id);
                                      }}
                                    >
                                      {p.name}
                                    </button>
                                  ))}
                                  {!reviseCandidates.length && <span className="week-slot-editor-empty">没有匹配人员</span>}
                                </div>
                                <div className="week-slot-editor-actions">
                                  <button className="btn btn-sm" onClick={()=>{
                                    setSelectedSlotKey('');
                                    setReviseQuery('');
                                    setRevisePersonId('');
                                  }}>取消</button>
                                </div>
                              </div>
                            )}
                          </div>
                        </td>
                      );
                    })}
                  </tr>
                ))}
              </tbody>
            </table>
            </div>
          </div>
        </div>
      </div>
    );
  }

  return (
    <div className={`grid-wrap${showDiff?' diff-on':''}`}>
      <table className="grid-table">
        <thead>
          <tr>
            <th className="col-name">姓名</th>
            {wDates.map((d,i)=>(
              <th key={i} style={{minWidth:'85px',cursor:'pointer'}} onClick={()=>goDay(d)} title="点击查看当日详情">
                <div className={`wdh${isToday(d)?' is-today':''}`}>
                  <span className="wd-name">{WD[i]}</span>
                  <span className="wd-date">{fmtShort(d)}</span>
                  {isToday(d)&&<span className="today-pill">今</span>}
                </div>
              </th>
            ))}
            <th className="col-total">合计(h)</th>
          </tr>
        </thead>
        <tbody>
          {personnel.map(p=>{
            const wt = wTotal(p.id);
            return (
              <tr key={p.id}>
                <td className="col-name">{p.name}</td>
                {wDates.map((d,i)=>{
                  const h = dayHours(fmt(d), p.id);
                  const relDay = i; // 0=Mon ... 6=Sun
                  const tplH = showDiff ? tplDayHours(p.name, relDay) : 0;
                  const deltaH = h - tplH;
                  const diffCls = deltaH>0?'pos':deltaH<0?'neg':'zero';
                  const diffLabel = deltaH>0?`+${deltaH.toFixed(1)}`:deltaH<0?deltaH.toFixed(1):'=';
                  return (
                    <td key={i} title={`${p.name} ${fmtShort(d)} → 点击录入`}>
                      <div className="wcell-wrap">
                        <span className={`wcell${h>0?' has-data':' zero'}`} onClick={()=>goDay(d)}>
                          {h>0 ? h.toFixed(1)+'h' : '—'}
                        </span>
                        {showDiff && (h>0||tplH>0) && (
                          <span className={`wdiff-badge ${diffCls}`}>{diffLabel}</span>
                        )}
                      </div>
                    </td>
                  );
                })}
                <td className="col-total">{wt>0?wt.toFixed(1):<span style={{color:'var(--muted)'}}>—</span>}</td>
              </tr>
            );
          })}
          <tr className="row-total">
            <td className="col-name">合计</td>
            {wDates.map((d,i)=>{
              const t = colTotal(d);
              return (
                <td key={i} style={{fontFamily:"'SF Mono','Consolas',monospace",fontSize:'13px'}}>
                  {t>0?<span style={{color:'var(--accent)'}}>{t.toFixed(1)}h</span>:<span style={{color:'var(--muted)'}}>—</span>}
                </td>
              );
            })}
            <td style={{fontFamily:"'SF Mono','Consolas',monospace",fontWeight:700,color:'var(--yellow)',fontSize:'15px'}}>
              {grandTotal().toFixed(1)}
            </td>
          </tr>
        </tbody>
      </table>
      <div style={{padding:'8px 12px',fontSize:'11px',color:'var(--muted)',borderTop:'1px solid var(--border)'}}>
        💡 点击日期列头或单元格可跳转到当日详细录入视图
      </div>
    </div>
  );
}

/* ═══ Work Type Modal ═══════════════════════════════════════════════════════ */
function TypeModal({ types, setTypes, close }) {
  const [list, setList] = useState(types.map(t=>({...t})));
  const [newName, setNewName] = useState('');
  const [newHrs, setNewHrs]   = useState('');
  const [newClr, setNewClr]   = useState('#58a6ff');

  function add() {
    if (!newName.trim()||!newHrs) return;
    setList(p=>[...p,{id:uid(),name:newName.trim(),hours:parseFloat(newHrs),color:newClr}]);
    setNewName(''); setNewHrs('');
  }
  function del(id) { setList(p=>p.filter(t=>t.id!==id)); }
  function upd(id,field,val) {
    setList(p=>p.map(t=>t.id===id?{...t,[field]:field==='hours'?parseFloat(val)||0:val}:t));
  }
  function save() { setTypes(list); close(); }

  return (
    <div className="overlay" onClick={e=>e.target===e.currentTarget&&close()}>
      <div className="modal">
        <div className="modal-title">⚙ 工时类型管理 <button className="close" onClick={close}>✕</button></div>

        {list.length===0&&<div style={{color:'var(--muted)',fontSize:'13px',marginBottom:'10px'}}>暂无类型</div>}

        {list.map(t=>(
          <div key={t.id} className="type-item">
            <div className="color-dot" style={{background:t.color}}/>
            <input className="inp" value={t.name} onChange={e=>upd(t.id,'name',e.target.value)} style={{flex:1}}/>
            <input className="inp inp-sm" type="number" min="0.5" step="0.5" value={t.hours}
              onChange={e=>upd(t.id,'hours',e.target.value)}/>
            <span style={{fontSize:'12px',color:'var(--muted)'}}>h</span>
            <input type="color" value={t.color} onChange={e=>upd(t.id,'color',e.target.value)}/>
            <button className="btn btn-sm btn-danger" onClick={()=>del(t.id)}>删除</button>
          </div>
        ))}

        <hr className="divider"/>
        <div className="tag-section">添加新类型</div>
        <div className="form-row">
          <input className="inp" placeholder="名称（如：值班3）" value={newName} onChange={e=>setNewName(e.target.value)}
            onKeyDown={e=>e.key==='Enter'&&add()}/>
          <input className="inp inp-sm" type="number" min="0.5" step="0.5" placeholder="小时" value={newHrs}
            onChange={e=>setNewHrs(e.target.value)}/>
          <span style={{fontSize:'12px',color:'var(--muted)'}}>h</span>
          <input type="color" value={newClr} onChange={e=>setNewClr(e.target.value)}/>
          <button className="btn btn-sm btn-primary" onClick={add}>添加</button>
        </div>

        <div style={{display:'flex',justifyContent:'flex-end',gap:'8px',marginTop:'16px'}}>
          <button className="btn" onClick={close}>取消</button>
          <button className="btn btn-primary" onClick={save}>保存</button>
        </div>
      </div>
    </div>
  );
}

/* ═══ People Modal ══════════════════════════════════════════════════════════ */
function PeopleModal({ personnel, setPersonnel, close }) {
  const [text, setText] = useState('');
  const [mode, setMode] = useState('add');
  const fileRef = useRef();

  function handleFile(e) {
    const file=e.target.files[0]; if(!file) return;
    const reader=new FileReader();
    reader.onload=ev=>{
      try {
        const wb=XLSX.read(ev.target.result,{type:'binary'});
        const ws=wb.Sheets[wb.SheetNames[0]];
        const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
        const names=rows.map(r=>String(r[0]||'').trim()).filter(n=>n&&n!=='姓名'&&n!=='name');
        setText(prev=>(prev?prev+'\n':'')+names.join('\n'));
      } catch { alert('读取失败'); }
    };
    reader.readAsBinaryString(file);
    e.target.value='';
  }

  function doImport() {
    const names=[...new Set(text.split(/[\n,，、;；]/).map(s=>s.trim()).filter(Boolean))];
    if(!names.length) return;
    const newPpl = names.map(name=>({id:uid(),name}));
    if (mode==='replace') {
      setPersonnel(newPpl);
    } else {
      const ex=new Set(personnel.map(p=>p.name));
      setPersonnel(prev=>[...prev,...newPpl.filter(p=>!ex.has(p.name))]);
    }
    close();
  }

  return (
    <div className="overlay" onClick={e=>e.target===e.currentTarget&&close()}>
      <div className="modal">

/* ═══ Export Modal ══════════════════════════════════════════════════════════ */
function ExportModal({ onExport, allDates, close, personnel, dayHours }) {
  const [sel, setSel]       = useState('both');
  const [previewMode, setPreviewMode] = useState('day');
  const [rangeType, setRangeType] = useState('all'); // 'all' | 'custom'
  const minDate = allDates[0] || '';
  const maxDate = allDates[allDates.length-1] || '';
  const [startDate, setStartDate] = useState(minDate);
  const [endDate,   setEndDate]   = useState(maxDate);
  const [bonusHours, setBonusHours] = useState({});

  const filtered = rangeType==='all' ? allDates
    : allDates.filter(d=>d>=startDate && d<=endDate);
  const weekMap = useMemo(()=>{
    const map = {};
    for (const d of filtered) {
      const mon = getMonday(new Date(d));
      const key = fmt(mon);
      const sun = addDays(mon, 6);
      if (!map[key]) map[key] = { label:`${fmtMid(mon)}~${fmtMid(sun)}`, dates:[] };
      map[key].dates.push(d);
    }
    return map;
  },[filtered]);
  const weekKeys = Object.keys(weekMap).sort();

  function go() {
    onExport(sel, rangeType==='all'?null:startDate, rangeType==='all'?null:endDate, bonusHours);
    close();
  }

  const dateInputStyle = {
    padding:'5px 8px',borderRadius:'var(--radius)',border:'1px solid var(--border)',
    background:'var(--bg)',color:'var(--text)',fontSize:'12px',fontFamily:'inherit',outline:'none'
  };

  function setBonus(pid, val) {
    setBonusHours(prev=>({...prev, [pid]: val}));
  }

  function renderPreviewTable(mode) {
    const cols = mode === 'day'
      ? filtered.map(d=>({ key:d, label:d.slice(5), getValue:pid=>dayHours(d,pid) }))
      : weekKeys.map(k=>({ key:k, label:weekMap[k].label, getValue:pid=>weekMap[k].dates.reduce((s,d)=>s+dayHours(d,pid),0) }));
    return (
      <div className="sched-table-wrap" style={{maxHeight:'260px', marginTop:'10px'}}>
        <table className="sched-table">
          <thead>
            <tr>
              <th style={{position:'sticky',left:0,zIndex:3}}>姓名</th>
              {cols.map(col=><th key={col.key}>{col.label}</th>)}
              <th>奖励工时</th>
              <th>总计</th>
            </tr>
          </thead>
          <tbody>
            {personnel.map(p=>{
              const values = cols.map(col=>col.getValue(p.id));
              const total = values.reduce((s,v)=>s+v,0);
              const bonus = parseFloat(bonusHours[p.id]) || 0;
              return (
                <tr key={p.id}>
                  <td className="col-name" style={{position:'sticky',left:0,zIndex:1}}>{p.name}</td>
                  {values.map((v, idx)=><td key={idx}>{v ? v.toFixed(1) : '—'}</td>)}
                  <td>
                    <input
                      className="inp inp-sm"
                      type="number"
                      step="0.5"
                      min="0"
                      value={bonusHours[p.id] ?? ''}
                      placeholder="0"
                      onChange={e=>setBonus(p.id, e.target.value)}
                    />
                  </td>
                  <td style={{fontWeight:700,color:'var(--yellow)'}}>{(total + bonus).toFixed(1)}</td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
    );
  }

  return (
    <div className="overlay" onClick={e=>e.target===e.currentTarget&&close()}>
      <div className="modal" style={{width:'min(1120px, 94vw)'}}>
        <div className="modal-title">📊 导出 Excel <button className="close" onClick={close}>✕</button></div>

        {/* Content type */}
        <div className="field">
          <label>导出内容</label>
          {[
            {v:'day',   label:'按日统计',       desc:'每列=一天'},
            {v:'week',  label:'按周汇总',       desc:'每列=一周'},
            {v:'both',  label:'日 + 周（推荐）', desc:'含两种统计 + 明细'},
          ].map(opt=>(
            <label key={opt.v} style={{display:'flex',alignItems:'center',gap:'8px',
              padding:'7px 10px',borderRadius:6,cursor:'pointer',
              background:sel===opt.v?'var(--accent)22':'transparent',
              border:`1px solid ${sel===opt.v?'var(--accent)':'var(--border)'}`,
              marginBottom:'6px',fontSize:'13px'}}>
              <input type="radio" value={opt.v} checked={sel===opt.v} onChange={()=>setSel(opt.v)}/>
              <div>
                <div style={{fontWeight:600,color:sel===opt.v?'var(--accent)':'var(--text)'}}>{opt.label}</div>
                <div style={{fontSize:'11px',color:'var(--muted)'}}>{opt.desc}</div>
              </div>
            </label>
          ))}
        </div>

        <hr className="divider"/>

        {/* Date range */}
        <div className="field">
          <label>时间范围</label>
          <div className="radio-row" style={{marginBottom:'10px'}}>
            <label><input type="radio" checked={rangeType==='all'} onChange={()=>setRangeType('all')}/> 全部记录（{allDates.length} 天）</label>
            <label><input type="radio" checked={rangeType==='custom'} onChange={()=>setRangeType('custom')}/> 自定义范围</label>
          </div>
          {rangeType==='custom' && (
            <div style={{display:'flex',alignItems:'center',gap:'8px',flexWrap:'wrap'}}>
              <input type="date" value={startDate} min={minDate} max={endDate||maxDate}
                onChange={e=>setStartDate(e.target.value)} style={dateInputStyle}/>
              <span style={{color:'var(--muted)',fontSize:'12px'}}>至</span>
              <input type="date" value={endDate} min={startDate||minDate} max={maxDate}
                onChange={e=>setEndDate(e.target.value)} style={dateInputStyle}/>
              <span style={{fontSize:'11px',color:'var(--muted)'}}>共 {filtered.length} 天</span>
            </div>
          )}
          {rangeType==='custom' && filtered.length===0 && (
            <div style={{fontSize:'11px',color:'var(--red)',marginTop:'5px'}}>⚠ 所选范围内无记录</div>
          )}
        </div>

        <div style={{fontSize:'11px',color:'var(--muted)',marginBottom:'14px'}}>
          导出前可先在预览里补奖励工时。奖励工时会出现在按天 / 按周统计表的总计前一列。
        </div>
        <div className="rule-block" style={{marginBottom:'14px'}}>
          <div className="rule-block-title">
            <strong>导出预览</strong>
            <div className="week-mode-toggle">
              <button className={previewMode==='day'?'active':''} onClick={()=>setPreviewMode('day')}>按天预览</button>
              <button className={previewMode==='week'?'active':''} onClick={()=>setPreviewMode('week')}>按周预览</button>
            </div>
          </div>
          <div style={{fontSize:'11px',color:'var(--muted)'}}>
            当前预览会按所选时间范围展示每列工时，奖励工时可单独录入，不会写回日常记录，只影响本次导出。
          </div>
          {renderPreviewTable(previewMode)}
        </div>
        <div style={{display:'flex',justifyContent:'flex-end',gap:'8px'}}>
          <button className="btn" onClick={close}>取消</button>
          <button className="btn btn-primary" disabled={rangeType==='custom'&&filtered.length===0} onClick={go}>导出</button>
        </div>
      </div>
    </div>
  );
}
