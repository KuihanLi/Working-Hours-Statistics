    const person = personIndex[personName];
    const type = typeIndexByName[typeName];
    if (!person || !type) return;
    const arr = normalizeWeekCellEntries(r?.[dateStr]?.[person.id]?.[type.id]);
    if (!arr.length) return;
    let idx = -1;
    if (currentRef?.entryId) idx = arr.findIndex(e=>e?.id===currentRef.entryId);
    const slotAbsKey = getSlotAbsKey(slot);
    if (idx < 0 && slotAbsKey) idx = arr.findIndex(e=>e?.absSlotKey===slotAbsKey);
    if (idx < 0 && Number.isFinite(slot?.r) && Number.isFinite(slot?.c)) {
      idx = arr.findIndex(e=>Number.isFinite(e?.absRow) && Number.isFinite(e?.absCol) && e.absRow===slot.r && e.absCol===slot.c);
    }
    if (idx < 0) return;
    arr.splice(idx, 1);

    if (!r[dateStr]) r[dateStr] = {};
    if (!r[dateStr][person.id]) r[dateStr][person.id] = {};
    if (arr.length) {
      r[dateStr][person.id][type.id] = arr;
    } else {
      delete r[dateStr][person.id][type.id];
      if (!Object.keys(r[dateStr][person.id]).length) delete r[dateStr][person.id];
      if (!Object.keys(r[dateStr]).length) delete r[dateStr];
    }
  }

  function addSlotEntry(r, dateStr, personName, typeName, slot) {
    const person = personIndex[personName];
    const type = typeIndexByName[typeName];
    if (!person || !type) return;
    const arr = normalizeWeekCellEntries(r?.[dateStr]?.[person.id]?.[type.id]);
    const slotAbsKey = getSlotAbsKey(slot);
    arr.push({
      id: uid(),
      source: 'revision',
      createdAt: Date.now(),
      absSlotKey: slotAbsKey,
      absRow: Number.isFinite(slot?.r) ? slot.r : null,
      absCol: Number.isFinite(slot?.c) ? slot.c : null,
      rowLimit: slot?.rowLimit || typeName,
      colLimit: slot?.colLimit || WD[slot?.weekday] || '',
      typeName,
    });
    r[dateStr] = r[dateStr] || {};
    r[dateStr][person.id] = r[dateStr][person.id] || {};
    r[dateStr][person.id][type.id] = arr;
  }

  // Atomically update records for slot operations.
  function applySlotRecordOps(ops) {
    setRecords(prev => {
      const r = JSON.parse(JSON.stringify(prev));
      for (const op of ops) {
        if (op.kind === 'remove' && op.personName) {
          removeSlotEntry(r, op.dateStr, op.personName, op.typeName, op.slot, op.currentRef || null);
        } else if (op.kind === 'add' && op.personName) {
          addSlotEntry(r, op.dateStr, op.personName, op.typeName, op.slot);
        }
      }
      return r;
    });
  }

  // Three-click slot interaction:
  //  Has currentPerson + not selected → click 1: clear (decrement record, set override=empty)
  //  Empty/removed + not selected     → click 2: select for replacement
  //  Already selected                 → click 3: restore baseline (undo override, fix records)
  function handleRevisionSlotClick(slot) {
    setActiveDay(slot.weekday);
    const dateStr = fmt(wDates[slot.weekday]);

    if (selectedSlotKey === slot.key) {
      // Third click: restore baseline. Atomically: remove current, add baseline.
      const ops = [];
      if (slot.currentPerson) ops.push({kind:'remove', dateStr, personName:slot.currentPerson, typeName:slot.typeName, slot, currentRef:slot.currentRef});
      if (slot.baselinePerson) ops.push({kind:'add', dateStr, personName:slot.baselinePerson, typeName:slot.typeName, slot});
      if (ops.length) applySlotRecordOps(ops);
      setSelectedSlotKey('');
      return;
    }

    if (slot.currentPerson) {
      // First click: clear this slot
      applySlotRecordOps([{kind:'remove', dateStr, personName:slot.currentPerson, typeName:slot.typeName, slot, currentRef:slot.currentRef}]);
      setSelectedSlotKey('');
      return;
    }

    // Second click: slot is empty — select it
    setSelectedSlotKey(slot.key);
    setReviseQuery('');
    setRevisePersonId('');
  }

  function addReplacementToSelectedSlot(personId = revisePersonId) {
    if (!selectedSlotKey || !personId) return;
    const slot = slotAssignments.byKey[selectedSlotKey];
    const targetPerson = personnel.find(p=>p.id===personId);
    if (!slot || !targetPerson) return;
    const dateStr = fmt(wDates[slot.weekday]);
    const ops = [];
    if (slot.currentPerson) ops.push({kind:'remove', dateStr, personName:slot.currentPerson, typeName:slot.typeName, slot, currentRef:slot.currentRef});
    ops.push({kind:'add', dateStr, personName:targetPerson.name, typeName:slot.typeName, slot});
    applySlotRecordOps(ops);
    setSelectedSlotKey('');
    setReviseQuery('');
    setRevisePersonId('');
  }

  if (weekMode === 'revise' && weekDayLocked) {
    return (
      <div className="week-revision-shell">
        <div className="empty" style={{border:'1px solid var(--border)',borderRadius:16,background:'var(--surface)'}}>
          <div className="icon">🔒</div>
          <p>本周已发生按天手工修改。为保证槽位定位准确，周修订已锁定。</p>
        </div>
        <div className="rule-block" style={{marginBottom:0}}>
          <div className="rule-block-title">
            <strong>周修订保护</strong>
            <span style={{fontSize:'11px',color:'var(--muted)'}}>先完成当前周按天录入；如需周修订，请切换到其他周。</span>
          </div>
          <div className="week-revision-form-row">
            <button className="btn" onClick={()=>setWeekMode('stats')}>回到周统计</button>
            <button className="btn" onClick={()=>goDay(wDates[activeDay])}>切到按天</button>
          </div>
        </div>
      </div>
    );
  }

  if (weekMode === 'revise') {
    const selectedSlot = slotAssignments.byKey[selectedSlotKey];

    if (!previewMeta?.rawGrid || !previewSlotEntries.length) {
      return (
        <div className="week-revision-shell">
          <div className="empty" style={{border:'1px solid var(--border)',borderRadius:16,background:'var(--surface)'}}>
            <div className="icon">🗂</div>
            <p>当前模板不含原始视图数据，无法进入原始 Excel 修订模式。</p>
          </div>
          <div className="rule-block" style={{marginBottom:0}}>
            <div className="rule-block-title">
              <strong>周修订模式</strong>
              <span style={{fontSize:'11px',color:'var(--muted)'}}>当前模板不带原始视图，请重新通过“排班转模板”生成一次模板。</span>
            </div>
            <div className="week-revision-form-row">
              <button className="btn" onClick={()=>setWeekMode('stats')}>回到周统计</button>
              <button className="btn" onClick={()=>goDay(wDates[activeDay])}>切到按天</button>
            </div>
          </div>
        </div>
      );
    }

    const mergeStarts = {};
    const mergeSkips = new Set();
    const mergedRows = new Set();
    const merges = previewMeta.rawMerges || [];
    const rawGrid = previewMeta.rawGrid || [];
    let maxR = rawGrid.length - 1;
    let maxC = (rawGrid[0]?.length || 1) - 1;
    for (const m of merges) {
      const rowSpan = m.e.r - m.s.r + 1;
      const colSpan = m.e.c - m.s.c + 1;
      mergeStarts[`${m.s.r},${m.s.c}`] = { rowSpan, colSpan };
      for (let rr=m.s.r; rr<=m.e.r; rr++) {
        mergedRows.add(rr);
        for (let cc=m.s.c; cc<=m.e.c; cc++) {
          if (rr===m.s.r && cc===m.s.c) continue;
          mergeSkips.add(`${rr},${cc}`);
        }
      }
    }
    const HEADER_KW_VALS = new Set(['签到','楼层','负责人','值班','洗板擦布','洗抹布','洗板','时间']);
    const displayRows = [];
    let blankRun = [];
    const flushBlankRun = () => {
      if (!blankRun.length) return;
      if (blankRun.length > 5) {
        blankRun.slice(0,2).forEach(r=>displayRows.push({type:'row', r}));
        displayRows.push({type:'collapsed', count: blankRun.length - 4});
        blankRun.slice(-2).forEach(r=>displayRows.push({type:'row', r}));
      } else blankRun.forEach(r=>displayRows.push({type:'row', r}));
      blankRun = [];
    };
    for (let r=0; r<=maxR; r++) {
      const rowHasData = Array.from({length:maxC+1},(_,cc)=>rawGrid[r]?.[cc]?.val).some(Boolean);
      const collapsibleBlank = !rowHasData && !mergedRows.has(r);
      if (collapsibleBlank) blankRun.push(r);
      else { flushBlankRun(); displayRows.push({type:'row', r}); }
    }
    flushBlankRun();

    function excelColName(idx) {
      let n = idx + 1;
      let s = '';
      while (n > 0) {
        const rem = (n - 1) % 26;
        s = String.fromCharCode(65 + rem) + s;
        n = Math.floor((n - 1) / 26);
      }
      return s;
    }
    function withAlpha(color, alpha='22') {
      if (!color) return null;
      if (color.startsWith('#') && color.length === 7) return `${color}${alpha}`;
      return color;
    }
    const colWidths = Array.from({length:maxC+1}, (_,cc)=>{
      let longest = excelColName(cc).length;
      for (const row of displayRows) {
        if (row.type !== 'row') continue;
        if (mergeSkips.has(`${row.r},${cc}`)) continue;
        const span = mergeStarts[`${row.r},${cc}`];
        if (span?.colSpan > 1) continue;
        longest = Math.max(longest, String(rawGrid[row.r]?.[cc]?.val || '').length);
      }
      return Math.max(72, Math.min(240, longest * 11 + 24));
    });
    const tableWidth = 48 + colWidths.reduce((s, w)=>s+w, 0);

    function getSlotCellView(key, defaultVal) {
      const slot = slotAssignments.byKey[key];
      if (!slot) {
        if (previewMeta.cellMatchType?.[key] === 'type') {
          const hitType = types.find(t=>t.name===previewMeta.cellTypeName?.[key]);
          return {
            label: defaultVal,
            style: hitType ? { background:withAlpha(hitType.color,'18'), color:hitType.color, border:`1px solid ${withAlpha(hitType.color,'66')}`, fontWeight:700 } : {},
            className:'',
            clickable:false,
          };
        }
        if (previewMeta.cellMatchType?.[key] === 'unmatched') {
          return { label:defaultVal, style:{background:'var(--yellow)18', color:'var(--yellow)', border:'1px solid var(--yellow)'}, className:'', clickable:false };
        }
        if (HEADER_KW_VALS.has(defaultVal)) {
          return { label:defaultVal, style:{background:'var(--surface2)', color:'var(--muted)', fontStyle:'italic'}, className:'', clickable:false };
        }
        return { label:defaultVal, style:{}, className:'', clickable:false };
      }
      const hitType = typeIndexByName[slot.typeName];
      const isSelected = selectedSlotKey === key;
      const displayName = slot.currentPerson || '';
      const isChanged = slot.state === 'changed';
      const isRemoved = slot.state === 'removed';
        const className = `week-revision-grid-cell${isRemoved?' removed':''}${showDiff && isChanged?' changed':''}${showDiff && isRemoved?' removed-diff':''}${isSelected?' selected':''}`;
      const style = hitType ? {
        background: slot.currentPerson ? withAlpha(hitType.color,'22') : 'rgba(248,81,73,.08)',
        color: slot.currentPerson ? hitType.color : 'var(--red)',
        border: `1px solid ${withAlpha(hitType.color,'88')}`,
        fontWeight:700,
      } : {};
      let hint;
      if (isSelected) hint = '再次点击：恢复模板原数据';
      else if (slot.currentPerson) hint = `点击清空「${slot.currentPerson}」`;
      else hint = '点击选中此槽位，直接在当前位置搜索替补人员';
      return { label:displayName, style, className, clickable:true, slot, hint, isSelected };
    }

    return (
      <div className="week-revision-shell">
        <div className="rule-block" style={{marginBottom:0}}>
          <div className="rule-block-title">
            <strong>原始视图修订</strong>
            <span style={{fontSize:'11px',color:'var(--muted)'}}>与原 Excel 布局一致；第 1 下删除原人名，第 2 下选中待替换，第 3 下恢复模板原数据</span>
          </div>
          <div className="preview-toolbar">
            <button className="btn btn-sm" onClick={()=>setReviseZoom(z=>Math.max(0.6, +(z - 0.1).toFixed(2)))}>缩小</button>
            <span className="zoom-label">{Math.round(reviseZoom * 100)}%</span>
            <button className="btn btn-sm" onClick={()=>setReviseZoom(z=>Math.min(2, +(z + 0.1).toFixed(2)))}>放大</button>
            <button className="btn btn-sm" onClick={()=>setReviseZoom(1)}>重置</button>
            <button className="btn btn-sm" onClick={()=>goDay(wDates[activeDay])}>切到按天</button>
            <button className="btn btn-sm" onClick={()=>setWeekMode('stats')}>回到周统计</button>
            <span className={`flow-badge ${showDiff ? 'active' : 'todo'}`}>{showDiff ? '差异已显示' : '可打开差异'}</span>
          </div>
          <div
            className="raw-grid-scroll-top"
            ref={reviseTopScrollRef}
            onScroll={e=>{ if (reviseGridWrapRef.current && reviseGridWrapRef.current.scrollLeft !== e.currentTarget.scrollLeft) reviseGridWrapRef.current.scrollLeft = e.currentTarget.scrollLeft; }}
          >
            <div style={{width:tableWidth * reviseZoom, height:1}} />
          </div>
          <div
            className="raw-grid-wrap raw-grid-wrap-lg"
            ref={reviseGridWrapRef}
            onScroll={e=>{ if (reviseTopScrollRef.current && reviseTopScrollRef.current.scrollLeft !== e.currentTarget.scrollLeft) reviseTopScrollRef.current.scrollLeft = e.currentTarget.scrollLeft; }}
            style={{maxHeight:'calc(100vh - 250px)'}}
          >
            <div style={{zoom:reviseZoom}}>
            <table className="raw-grid">
              <colgroup>
                <col style={{width:48}} />
                {colWidths.map((w, idx)=><col key={idx} style={{width:w}} />)}
              </colgroup>
              <thead>
                <tr>
                  <th className="row-hdr">#</th>
                  {Array.from({length:maxC+1},(_,i)=><th key={i}>{excelColName(i)}</th>)}
                </tr>
              </thead>
              <tbody>
                {displayRows.map((row, idx)=> row.type === 'collapsed' ? (
                  <tr key={`collapsed-${idx}`}>
                    <td className="row-hdr">…</td>
                    <td className="cell-collapsed" colSpan={maxC+1}>已折叠 {row.count} 行连续空白行</td>
                  </tr>
                ) : (
                  <tr key={row.r}>
                    <td className="row-hdr">{row.r+1}</td>
                    {Array.from({length:maxC+1},(_,cc)=>{
                      const key = `${row.r},${cc}`;
                      if (mergeSkips.has(key)) return null;
                      const span = mergeStarts[key];
                      const val = rawGrid[row.r]?.[cc]?.val || '';
                      const viewInfo = getSlotCellView(key, val);
                      const wd = viewInfo.slot?.weekday;
                      const isActiveDay = typeof wd === 'number' && wd === activeDay;
                      return (
                        <td
                          key={cc}
                          rowSpan={span?.rowSpan}
                          colSpan={span?.colSpan}
                          className={viewInfo.className + (isActiveDay ? ' active-day' : '')}
                          style={viewInfo.style}
                          title={viewInfo.hint || (viewInfo.slot ? `${WD[viewInfo.slot.weekday]} · ${viewInfo.slot.typeName} · 模板人员：${viewInfo.slot.baselinePerson || '空槽位'}` : val)}
                          onClick={viewInfo.clickable ? ()=>handleRevisionSlotClick(viewInfo.slot) : undefined}
                        >
                          <div className="week-slot-cell-inner">
                            {viewInfo.label}
                            {viewInfo.isSelected && (
                              <div className="week-slot-editor" onMouseDown={e=>e.stopPropagation()} onClick={e=>e.stopPropagation()}>
                                <div className="week-slot-editor-head">
                                  <strong>{WD[viewInfo.slot.weekday]} · {viewInfo.slot.typeName}</strong>
                                  <span>模板：{viewInfo.slot.baselinePerson || '空槽位'}</span>
                                </div>
                                <input
                                  ref={reviseInlineInputRef}
                                  className="inp"
                                  value={reviseQuery}
                                  placeholder={`输入替补人员，可搜姓名 / 拼音首字母`}
                                  onChange={e=>{
                                    setReviseQuery(e.target.value);
                                    setRevisePersonId('');
                                  }}
                                  onKeyDown={e=>{
                                    if (e.key === 'Enter') {
                                      e.preventDefault();
                                      const exact = reviseCandidates.find(p=>p.name===reviseQuery.trim());
                                      const fallback = reviseCandidates[0];
                                      const chosen = exact || fallback;
                                      if (chosen) addReplacementToSelectedSlot(chosen.id);
                                    } else if (e.key === 'Escape') {
                                      e.preventDefault();
                                      setSelectedSlotKey('');
                                      setReviseQuery('');
                                      setRevisePersonId('');
                                    }
                                  }}
                                />
                                <div className="week-slot-editor-suggestions">
                                  {reviseCandidates.map(p=>(
                                    <button
                                      type="button"
                                      key={p.id}
                                      className={`week-slot-editor-chip${revisePersonId===p.id?' active':''}`}
                                      onClick={()=>{
                                        setRevisePersonId(p.id);
                                        addReplacementToSelectedSlot(p.id);
                                      }}
                                    >
                                      {p.name}
                                    </button>
                                  ))}
                                  {!reviseCandidates.length && <span className="week-slot-editor-empty">没有匹配人员</span>}
                                </div>
                                <div className="week-slot-editor-actions">
                                  <button className="btn btn-sm" onClick={()=>{
                                    setSelectedSlotKey('');
                                    setReviseQuery('');
                                    setRevisePersonId('');
                                  }}>取消</button>
                                </div>
                              </div>
                            )}
                          </div>
                        </td>
                      );
                    })}
                  </tr>
                ))}
              </tbody>
            </table>
            </div>
          </div>
        </div>
      </div>
    );
  }

  return (
    <div className={`grid-wrap${showDiff?' diff-on':''}`}>
      <table className="grid-table">
        <thead>
          <tr>
            <th className="col-name">姓名</th>
            {wDates.map((d,i)=>(
              <th key={i} style={{minWidth:'85px',cursor:'pointer'}} onClick={()=>goDay(d)} title="点击查看当日详情">
                <div className={`wdh${isToday(d)?' is-today':''}`}>
                  <span className="wd-name">{WD[i]}</span>
                  <span className="wd-date">{fmtShort(d)}</span>
                  {isToday(d)&&<span className="today-pill">今</span>}
                </div>
              </th>
            ))}
            <th className="col-total">合计(h)</th>
          </tr>
        </thead>
        <tbody>
          {personnel.map(p=>{
            const wt = wTotal(p.id);
            return (
              <tr key={p.id}>
                <td className="col-name">{p.name}</td>
                {wDates.map((d,i)=>{
                  const h = dayHours(fmt(d), p.id);
                  const relDay = i; // 0=Mon ... 6=Sun
                  const tplH = showDiff ? tplDayHours(p.name, relDay) : 0;
                  const deltaH = h - tplH;
                  const diffCls = deltaH>0?'pos':deltaH<0?'neg':'zero';
                  const diffLabel = deltaH>0?`+${deltaH.toFixed(1)}`:deltaH<0?deltaH.toFixed(1):'=';
                  return (
                    <td key={i} title={`${p.name} ${fmtShort(d)} → 点击录入`}>
                      <div className="wcell-wrap">
                        <span className={`wcell${h>0?' has-data':' zero'}`} onClick={()=>goDay(d)}>
                          {h>0 ? h.toFixed(1)+'h' : '—'}
                        </span>
                        {showDiff && (h>0||tplH>0) && (
                          <span className={`wdiff-badge ${diffCls}`}>{diffLabel}</span>
                        )}
                      </div>
                    </td>
                  );
                })}
                <td className="col-total">{wt>0?wt.toFixed(1):<span style={{color:'var(--muted)'}}>—</span>}</td>
              </tr>
            );
          })}
          <tr className="row-total">
            <td className="col-name">合计</td>
            {wDates.map((d,i)=>{
              const t = colTotal(d);
              return (
                <td key={i} style={{fontFamily:"'SF Mono','Consolas',monospace",fontSize:'13px'}}>
                  {t>0?<span style={{color:'var(--accent)'}}>{t.toFixed(1)}h</span>:<span style={{color:'var(--muted)'}}>—</span>}
                </td>
              );
            })}
            <td style={{fontFamily:"'SF Mono','Consolas',monospace",fontWeight:700,color:'var(--yellow)',fontSize:'15px'}}>
              {grandTotal().toFixed(1)}
            </td>
          </tr>
        </tbody>
      </table>
      <div style={{padding:'8px 12px',fontSize:'11px',color:'var(--muted)',borderTop:'1px solid var(--border)'}}>
        💡 点击日期列头或单元格可跳转到当日详细录入视图
      </div>
    </div>
  );
}

/* ═══ Work Type Modal ═══════════════════════════════════════════════════════ */
function TypeModal({ types, setTypes, close }) {
  const [list, setList] = useState(types.map(t=>({...t})));
  const [newName, setNewName] = useState('');
  const [newHrs, setNewHrs]   = useState('');
  const [newClr, setNewClr]   = useState('#58a6ff');

  function add() {
    if (!newName.trim()||!newHrs) return;
    setList(p=>[...p,{id:uid(),name:newName.trim(),hours:parseFloat(newHrs),color:newClr}]);
    setNewName(''); setNewHrs('');
  }
  function del(id) { setList(p=>p.filter(t=>t.id!==id)); }
  function upd(id,field,val) {
    setList(p=>p.map(t=>t.id===id?{...t,[field]:field==='hours'?parseFloat(val)||0:val}:t));
  }
  function save() { setTypes(list); close(); }

  return (
    <div className="overlay" onClick={e=>e.target===e.currentTarget&&close()}>
      <div className="modal">
        <div className="modal-title">⚙ 工时类型管理 <button className="close" onClick={close}>✕</button></div>

        {list.length===0&&<div style={{color:'var(--muted)',fontSize:'13px',marginBottom:'10px'}}>暂无类型</div>}

        {list.map(t=>(
          <div key={t.id} className="type-item">
            <div className="color-dot" style={{background:t.color}}/>
            <input className="inp" value={t.name} onChange={e=>upd(t.id,'name',e.target.value)} style={{flex:1}}/>
            <input className="inp inp-sm" type="number" min="0.5" step="0.5" value={t.hours}
              onChange={e=>upd(t.id,'hours',e.target.value)}/>
            <span style={{fontSize:'12px',color:'var(--muted)'}}>h</span>
            <input type="color" value={t.color} onChange={e=>upd(t.id,'color',e.target.value)}/>
            <button className="btn btn-sm btn-danger" onClick={()=>del(t.id)}>删除</button>
          </div>
        ))}

        <hr className="divider"/>
        <div className="tag-section">添加新类型</div>
        <div className="form-row">
          <input className="inp" placeholder="名称（如：值班3）" value={newName} onChange={e=>setNewName(e.target.value)}
            onKeyDown={e=>e.key==='Enter'&&add()}/>
          <input className="inp inp-sm" type="number" min="0.5" step="0.5" placeholder="小时" value={newHrs}
            onChange={e=>setNewHrs(e.target.value)}/>
          <span style={{fontSize:'12px',color:'var(--muted)'}}>h</span>
          <input type="color" value={newClr} onChange={e=>setNewClr(e.target.value)}/>
          <button className="btn btn-sm btn-primary" onClick={add}>添加</button>
        </div>

        <div style={{display:'flex',justifyContent:'flex-end',gap:'8px',marginTop:'16px'}}>
          <button className="btn" onClick={close}>取消</button>
          <button className="btn btn-primary" onClick={save}>保存</button>
        </div>
      </div>
    </div>
  );
}

/* ═══ People Modal ══════════════════════════════════════════════════════════ */
function PeopleModal({ personnel, setPersonnel, close }) {
  const [text, setText] = useState('');
  const [mode, setMode] = useState('add');
  const fileRef = useRef();

  function handleFile(e) {
    const file=e.target.files[0]; if(!file) return;
    const reader=new FileReader();
    reader.onload=ev=>{
      try {
        const wb=XLSX.read(ev.target.result,{type:'binary'});
        const ws=wb.Sheets[wb.SheetNames[0]];
        const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
        const names=rows.map(r=>String(r[0]||'').trim()).filter(n=>n&&n!=='姓名'&&n!=='name');
        setText(prev=>(prev?prev+'\n':'')+names.join('\n'));
      } catch { alert('读取失败'); }
    };
    reader.readAsBinaryString(file);
    e.target.value='';
  }

  function doImport() {
    const names=[...new Set(text.split(/[\n,，、;；]/).map(s=>s.trim()).filter(Boolean))];
    if(!names.length) return;
    const newPpl = names.map(name=>({id:uid(),name}));
    if (mode==='replace') {
      setPersonnel(newPpl);
    } else {
      const ex=new Set(personnel.map(p=>p.name));
      setPersonnel(prev=>[...prev,...newPpl.filter(p=>!ex.has(p.name))]);
    }
    close();
  }

  return (
    <div className="overlay" onClick={e=>e.target===e.currentTarget&&close()}>
      <div className="modal">
        <div className="modal-title">👥 导入人员名单 <button className="close" onClick={close}>✕</button></div>
        <div style={{fontSize:'12px',color:'var(--muted)',marginBottom:'10px'}}>
          每行一个姓名，或用逗号/分号分隔。支持从 Excel/CSV 导入（第一列为姓名）。
        </div>
        <textarea className="inp" placeholder={"张三\n李四\n王五\n…"} value={text} onChange={e=>setText(e.target.value)}/>

        <div style={{display:'flex',alignItems:'center',gap:'12px',marginTop:'10px'}}>
          <input ref={fileRef} type="file" accept=".xlsx,.xls,.csv" style={{display:'none'}} onChange={handleFile}/>
          <button className="btn btn-sm" onClick={()=>fileRef.current.click()}>📂 从文件导入</button>
          <div className="radio-row">
            <label><input type="radio" value="add" checked={mode==='add'} onChange={()=>setMode('add')}/> 追加</label>
            <label><input type="radio" value="replace" checked={mode==='replace'} onChange={()=>setMode('replace')}/> 替换全部</label>
          </div>
          <div style={{flex:1}}/>
          <span style={{fontSize:'12px',color:'var(--muted)'}}>{text.split(/[\n,，、;；]/).filter(s=>s.trim()).length} 人</span>
        </div>

        <div style={{display:'flex',justifyContent:'flex-end',gap:'8px',marginTop:'14px'}}>
          <button className="btn" onClick={close}>取消</button>
          <button className="btn btn-primary" onClick={doImport}>导入</button>
        </div>
      </div>
    </div>
  );
}

/* ═══ Export Modal ══════════════════════════════════════════════════════════ */
function ExportModal({ onExport, allDates, close, personnel, dayHours, weekTemplateMap, templateLibrary }) {
  const [sel, setSel]       = useState('both');
  const [previewMode, setPreviewMode] = useState('day');
  const [rangeType, setRangeType] = useState('all'); // 'all' | 'custom'
  const minDate = allDates[0] || '';
  const maxDate = allDates[allDates.length-1] || '';
  const [startDate, setStartDate] = useState(minDate);
  const [endDate,   setEndDate]   = useState(maxDate);
  const [bonusHours, setBonusHours] = useState({});

  const filtered = rangeType==='all' ? allDates
    : allDates.filter(d=>d>=startDate && d<=endDate);
  const weekMap = useMemo(()=>{
    const map = {};
    for (const d of filtered) {
      const mon = getMonday(new Date(d));
      const key = fmt(mon);
      const sun = addDays(mon, 6);
      if (!map[key]) map[key] = { label:`${fmtMid(mon)}~${fmtMid(sun)}`, dates:[] };
      map[key].dates.push(d);
    }
    return map;
  },[filtered]);
  const weekKeys = Object.keys(weekMap).sort();
  const canReviseExport = useMemo(()=>{
    if (!weekKeys.length) return false;
    const libById = Object.fromEntries((templateLibrary || []).map(t=>[t.id, t]));
    return weekKeys.some(k=>{
      const tid = weekTemplateMap?.[k];
      const tpl = libById[tid];
      return !!tpl?.preview?.rawGrid;
    });
  },[weekKeys, weekTemplateMap, templateLibrary]);

  function go() {
    onExport(sel, rangeType==='all'?null:startDate, rangeType==='all'?null:endDate, bonusHours);
    close();
  }

  useEffect(()=>{
    if (sel === 'revise') setPreviewMode('revise');
    else if (previewMode === 'revise') setPreviewMode('day');
  },[sel]);

  const dateInputStyle = {
    padding:'5px 8px',borderRadius:'var(--radius)',border:'1px solid var(--border)',
    background:'var(--bg)',color:'var(--text)',fontSize:'12px',fontFamily:'inherit',outline:'none'
  };

  function setBonus(pid, val) {
    setBonusHours(prev=>({...prev, [pid]: val}));
  }

  function renderPreviewTable(mode) {
    if (mode === 'revise') {
      return (
        <div className="sched-table-wrap" style={{maxHeight:'260px', marginTop:'10px', padding:'12px'}}>
          <div style={{fontSize:'12px',color:'var(--text)',fontWeight:700,marginBottom:'8px'}}>修订视图导出说明</div>
          {!canReviseExport ? (
            <div style={{fontSize:'12px',color:'var(--red)'}}>当前筛选范围内的周未指派可用模板（或模板不含原始视图数据），无法导出修订视图格式。</div>
          ) : weekKeys.length ? (
            <div style={{display:'flex',flexDirection:'column',gap:'8px'}}>
              <div style={{fontSize:'12px',color:'var(--muted)'}}>
                将按模板原始布局导出，每个自然周生成一个工作表，人员位置尽量与修订模式一致。
              </div>
              {weekKeys.map((k, idx)=>(
                <div key={k} className="rule-chip">
                  <strong style={{color:'var(--text)'}}>Sheet {idx+1}</strong>
                  <span className="sp">→</span>
                  <span>{weekMap[k].label}</span>
                </div>
              ))}
            </div>
          ) : (
            <div style={{fontSize:'12px',color:'var(--muted)'}}>当前筛选范围内没有可导出的周记录。</div>
          )}
        </div>
      );
    }
    const cols = mode === 'day'
      ? filtered.map(d=>({ key:d, label:d.slice(5), getValue:pid=>dayHours(d,pid) }))
      : weekKeys.map(k=>({ key:k, label:weekMap[k].label, getValue:pid=>weekMap[k].dates.reduce((s,d)=>s+dayHours(d,pid),0) }));
    return (
      <div className="sched-table-wrap" style={{maxHeight:'260px', marginTop:'10px'}}>
        <table className="sched-table">
          <thead>
            <tr>
              <th style={{position:'sticky',left:0,zIndex:3}}>姓名</th>
              {cols.map(col=><th key={col.key}>{col.label}</th>)}
              <th>奖励工时</th>
              <th>总计</th>
            </tr>
          </thead>
          <tbody>
            {personnel.map(p=>{
              const values = cols.map(col=>col.getValue(p.id));
              const total = values.reduce((s,v)=>s+v,0);
              const bonus = parseFloat(bonusHours[p.id]) || 0;
              return (
                <tr key={p.id}>
                  <td className="col-name" style={{position:'sticky',left:0,zIndex:1}}>{p.name}</td>
                  {values.map((v, idx)=><td key={idx}>{v ? v.toFixed(1) : '—'}</td>)}
                  <td>
                    <input
                      className="inp inp-sm"
                      type="number"
                      step="0.5"
                      min="0"
                      value={bonusHours[p.id] ?? ''}
                      placeholder="0"
                      onChange={e=>setBonus(p.id, e.target.value)}
                    />
                  </td>
                  <td style={{fontWeight:700,color:'var(--yellow)'}}>{(total + bonus).toFixed(1)}</td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
    );
  }

  return (
    <div className="overlay" onClick={e=>e.target===e.currentTarget&&close()}>
      <div className="modal" style={{width:'min(1120px, 94vw)'}}>
        <div className="modal-title">📊 导出 Excel <button className="close" onClick={close}>✕</button></div>

        {/* Content type */}
        <div className="field">
          <label>导出内容</label>
          {[
            {v:'day',   label:'按日统计',       desc:'每列=一天'},
            {v:'week',  label:'按周汇总',       desc:'每列=一周'},
            {v:'both',  label:'日 + 周（推荐）', desc:'含两种统计 + 明细'},
            {v:'revise',label:'修订视图格式',   desc:'按模板原始布局导出，每周一个 sheet', disabled:!canReviseExport},
          ].map(opt=>(
            <label key={opt.v} style={{display:'flex',alignItems:'center',gap:'8px',
              padding:'7px 10px',borderRadius:6,cursor:'pointer',
              background:sel===opt.v?'var(--accent)22':'transparent',
              border:`1px solid ${sel===opt.v?'var(--accent)':'var(--border)'}`,
              marginBottom:'6px',fontSize:'13px',opacity:opt.disabled ? 0.6 : 1,
              cursor:opt.disabled ? 'not-allowed' : 'pointer'}}>
              <input type="radio" value={opt.v} checked={sel===opt.v} onChange={()=>setSel(opt.v)} disabled={opt.disabled}/>
              <div>
                <div style={{fontWeight:600,color:sel===opt.v?'var(--accent)':'var(--text)'}}>{opt.label}</div>
                <div style={{fontSize:'11px',color:'var(--muted)'}}>{opt.desc}</div>
              </div>
            </label>
          ))}
        </div>

        <hr className="divider"/>

        {/* Date range */}
        <div className="field">
          <label>时间范围</label>
          <div className="radio-row" style={{marginBottom:'10px'}}>
            <label><input type="radio" checked={rangeType==='all'} onChange={()=>setRangeType('all')}/> 全部记录（{allDates.length} 天）</label>
            <label><input type="radio" checked={rangeType==='custom'} onChange={()=>setRangeType('custom')}/> 自定义范围</label>
          </div>
          {rangeType==='custom' && (
            <div style={{display:'flex',alignItems:'center',gap:'8px',flexWrap:'wrap'}}>
              <input type="date" value={startDate} min={minDate} max={endDate||maxDate}
                onChange={e=>setStartDate(e.target.value)} style={dateInputStyle}/>
              <span style={{color:'var(--muted)',fontSize:'12px'}}>至</span>
              <input type="date" value={endDate} min={startDate||minDate} max={maxDate}
                onChange={e=>setEndDate(e.target.value)} style={dateInputStyle}/>
              <span style={{fontSize:'11px',color:'var(--muted)'}}>共 {filtered.length} 天</span>
            </div>
          )}
          {rangeType==='custom' && filtered.length===0 && (
            <div style={{fontSize:'11px',color:'var(--red)',marginTop:'5px'}}>⚠ 所选范围内无记录</div>
          )}
        </div>

        <div style={{fontSize:'11px',color:'var(--muted)',marginBottom:'14px'}}>
          {sel==='revise'
            ? '修订视图格式会保留模板原始布局，并按当前工时记录回填到对应槽位。'
            : '导出前可先在预览里补奖励工时。奖励工时会出现在按天 / 按周统计表的总计前一列。'}
        </div>
        <div className="rule-block" style={{marginBottom:'14px'}}>
          <div className="rule-block-title">
            <strong>导出预览</strong>
            <div className="week-mode-toggle">
              <button className={previewMode==='day'?'active':''} onClick={()=>setPreviewMode('day')}>按天预览</button>
              <button className={previewMode==='week'?'active':''} onClick={()=>setPreviewMode('week')}>按周预览</button>
              {canReviseExport && <button className={previewMode==='revise'?'active':''} onClick={()=>setPreviewMode('revise')}>修订视图</button>}
            </div>
          </div>
          <div style={{fontSize:'11px',color:'var(--muted)'}}>
            {previewMode==='revise'
              ? '修订视图预览展示将生成哪些按周工作表，以及它们会按模板原始布局导出。'
              : '当前预览会按所选时间范围展示每列工时，奖励工时可单独录入，不会写回日常记录，只影响本次导出。'}
          </div>
          {renderPreviewTable(previewMode)}
        </div>
        <div style={{display:'flex',justifyContent:'flex-end',gap:'8px'}}>
          <button className="btn" onClick={close}>取消</button>
          <button className="btn btn-primary" disabled={(rangeType==='custom'&&filtered.length===0) || (sel==='revise' && !canReviseExport)} onClick={go}>导出</button>
        </div>
      </div>
    </div>
  );
}

/* ═══ Template View Modal ══════════════════════════════════════════════════ */
function TemplateViewModal({ template, onClear, close }) {
  if (!template) return null;
  const preview = template.preview || {};
  const rawGrid = preview.rawGrid || null;
  const rawMerges = preview.rawMerges || [];
  const totalEntries = Object.values(template.data || {}).reduce((s,d)=>
    s+Object.values(d || {}).reduce((ss,tt)=>ss+Object.values(tt || {}).reduce((n,v)=>n+v,0),0),0);

  function excelColName(idx) {
    let n = idx + 1;
    let s = '';
    while (n > 0) {
      const rem = (n - 1) % 26;
      s = String.fromCharCode(65 + rem) + s;
      n = Math.floor((n - 1) / 26);
    }
    return s;
  }

  function renderRawGrid() {
    if (!rawGrid?.length) {
      return (
        <div style={{padding:'20px',textAlign:'center',fontSize:'12px',color:'var(--muted)'}}>
          当前模板不含原始视图数据，请通过“排班转模板”重新生成后再查看。
        </div>
      );
    }

    const mergeStarts = {};
    const mergeSkips = new Set();
    const maxR = rawGrid.length - 1;
    const maxC = Math.max(...rawGrid.map(row=>row?.length || 0), 0) - 1;

    for (const m of rawMerges) {
      const rowSpan = m.e.r - m.s.r + 1;
      const colSpan = m.e.c - m.s.c + 1;
      mergeStarts[`${m.s.r},${m.s.c}`] = { rowSpan, colSpan };
      for (let rr=m.s.r; rr<=m.e.r; rr++) {
        for (let cc=m.s.c; cc<=m.e.c; cc++) {
          if (rr===m.s.r && cc===m.s.c) continue;
          mergeSkips.add(`${rr},${cc}`);
        }
      }
    }

    return (
      <div className="raw-grid-wrap raw-grid-wrap-lg" style={{maxHeight:'60vh'}}>
        <table className="raw-grid">
          <colgroup>
            <col style={{width:48}} />
            {Array.from({length:maxC+1}, (_, idx)=> <col key={idx} style={{width:120}} />)}
          </colgroup>
          <thead>
            <tr>
              <th className="row-hdr">#</th>
              {Array.from({length:maxC+1},(_,i)=><th key={i}>{excelColName(i)}</th>)}
            </tr>
          </thead>
          <tbody>
            {Array.from({length:maxR+1}, (_, r)=>(
              <tr key={r}>
                <td className="row-hdr">{r+1}</td>
                {Array.from({length:maxC+1}, (_, c)=>{
                  const key = `${r},${c}`;
                  if (mergeSkips.has(key)) return null;
                  const span = mergeStarts[key];
                  const val = rawGrid[r]?.[c]?.val || '';
                  return (
                    <td key={c} rowSpan={span?.rowSpan} colSpan={span?.colSpan} title={val}>
                      {val}
                    </td>
                  );
                })}
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    );
  }

  return (
    <div className="overlay" onClick={e=>e.target===e.currentTarget&&close()}>
      <div className="modal" style={{width:'min(1240px, 96vw)',maxHeight:'90vh',overflow:'hidden',display:'flex',flexDirection:'column'}}>
        <div className="modal-title">
          📋 模板原始视图 — <span style={{color:'var(--yellow)'}}>{template.name}</span>
          <button className="close" onClick={close}>✕</button>
        </div>
        <div style={{fontSize:'12px',color:'var(--muted)',marginBottom:'10px'}}>
          展示模板导入时的原始表格布局（含合并单元格） · 当前模板统计总条数
          <strong style={{color:'var(--accent)'}}> {totalEntries}</strong>
        </div>
        <div style={{flex:1,overflowY:'auto'}}>
          {renderRawGrid()}
        </div>
        <div style={{display:'flex',gap:'8px',marginTop:'14px'}}>
          <button className="btn btn-danger" onClick={onClear}>清除模板</button>
          <div style={{flex:1}}/>
          <button className="btn btn-primary" onClick={close}>关闭</button>
        </div>
      </div>
    </div>
  );
}

/* ═══ Calendar Picker ══════════════════════════════════════════════════════ */
function CalendarPicker({ curDate, setCurDate, view, records, dateLabel, isHighlight }) {
  const [open, setOpen] = useState(false);
  const [panelMode, setPanelMode] = useState('day'); // 'day' | 'month' | 'year'
  const [panelDate, setPanelDate] = useState(() => new Date(curDate));
  const ref = useRef();

  // Sync panel when curDate changes externally
  useEffect(() => { setPanelDate(new Date(curDate)); }, [curDate.toDateString()]);

  // Close on outside click
  useEffect(() => {
    if (!open) return;
    function handler(e) { if (ref.current && !ref.current.contains(e.target)) setOpen(false); }
    document.addEventListener('mousedown', handler);
    return () => document.removeEventListener('mousedown', handler);
  }, [open]);

  const todayStr = fmt(new Date());
  const curStr   = fmt(curDate);

  // Dates that have any record
  const datesToDots = useMemo(() => new Set(Object.keys(records)), [records]);

  // Which dates are in curDate's week (for week view highlighting)
  const weekSet = useMemo(() => {
    if (view !== 'week') return new Set();
    const mon = getMonday(curDate);
    return new Set(Array.from({length:7},(_,i)=>fmt(addDays(mon,i))));
  }, [view, curDate]);

  /* ── Panel navigation ── */
  function prevPanel() {
    setPanelDate(d => {
      const r = new Date(d);
      if (panelMode==='day')   { r.setMonth(r.getMonth()-1); }
      else if (panelMode==='month') { r.setFullYear(r.getFullYear()-1); }
      else { r.setFullYear(r.getFullYear()-12); }
      return r;
    });
  }
  function nextPanel() {
    setPanelDate(d => {
      const r = new Date(d);
      if (panelMode==='day')   { r.setMonth(r.getMonth()+1); }
      else if (panelMode==='month') { r.setFullYear(r.getFullYear()+1); }
      else { r.setFullYear(r.getFullYear()+12); }
      return r;
    });
  }

  function selectDay(d) {
    setCurDate(new Date(d));
    setOpen(false);
    setPanelMode('day');
  }
  function selectMonth(m) {
    setPanelDate(d => { const r=new Date(d); r.setMonth(m); return r; });
    setPanelMode('day');
  }
  function selectYear(y) {
    setPanelDate(d => { const r=new Date(d); r.setFullYear(y); return r; });
    setPanelMode('month');
  }

  /* ── Build day grid ── */
  function buildDayGrid() {
    const year = panelDate.getFullYear();
    const month = panelDate.getMonth();
    const first = new Date(year, month, 1);
    const startDow = first.getDay(); // 0=Sun
    // Start from Monday
    const startOffset = startDow === 0 ? 6 : startDow - 1;
    const cells = [];
    for (let i = 0; i < startOffset; i++) {
      cells.push({ d: addDays(first, -startOffset+i), otherMonth: true });
    }
    const daysInMonth = new Date(year, month+1, 0).getDate();
    for (let i = 1; i <= daysInMonth; i++) {
      cells.push({ d: new Date(year, month, i), otherMonth: false });
    }
    // pad to complete last row
    while (cells.length % 7 !== 0) {
      cells.push({ d: addDays(cells[cells.length-1].d, 1), otherMonth: true });
    }
    return cells;
  }

  const panelTitle = useMemo(() => {
    if (panelMode==='day') return `${panelDate.getFullYear()}年 ${panelDate.getMonth()+1}月`;
    if (panelMode==='month') return `${panelDate.getFullYear()}年`;
    const base = Math.floor(panelDate.getFullYear()/12)*12;
    return `${base} — ${base+11}`;
  }, [panelMode, panelDate]);

  const yearBase = Math.floor(panelDate.getFullYear()/12)*12;

  const WDS = ['一','二','三','四','五','六','日'];
  const MONTHS = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];

  return (
    <div className="cal-anchor" ref={ref}>
      <span
        className={`date-label${isHighlight?' today-indicator':''}`}
        style={{cursor:'pointer',userSelect:'none',borderRadius:6,padding:'2px 8px',
          transition:'background .12s', background: open ? 'var(--surface2)' : 'transparent'}}
        onClick={()=>setOpen(o=>!o)}
        title="点击打开日历"
      >{dateLabel} 📅</span>

      {open && (
        <div className="cal-popup">
          {/* Header */}
          <div className="cal-head">
            <span className="cal-nav" onClick={prevPanel}>‹</span>
            <span className="cal-title" onClick={()=>setPanelMode(m=>m==='day'?'month':m==='month'?'year':'year')}>
              {panelTitle}
            </span>
            <span className="cal-nav" onClick={nextPanel}>›</span>
          </div>

          {/* Day grid */}
          {panelMode==='day' && (<>
            <div className="cal-grid">
              {WDS.map(w=><div key={w} className="cal-wd">{w}</div>)}
              {buildDayGrid().map((cell,i)=>{
                const ds = fmt(cell.d);
                const isSel = view==='day' ? ds===curStr : weekSet.has(ds);
                const isWkStart = view==='week' && weekSet.has(ds) && cell.d.getDay()===(getMonday(curDate).getDay());
                const isWkEnd   = view==='week' && weekSet.has(ds) && cell.d.getDay()===0;
                let cls = 'cal-day';
                if (cell.otherMonth) cls+=' other-month';
                if (ds===todayStr) cls+=' is-today';
                if (view==='day' && ds===curStr) cls+=' selected';
                if (view==='week' && weekSet.has(ds) && !cell.otherMonth) cls+=' in-week';
                if (datesToDots.has(ds) && !cell.otherMonth) cls+=' has-data';
                return (
                  <div key={i} className={cls}
                    onClick={()=>!cell.otherMonth && selectDay(cell.d)}>
                    {cell.d.getDate()}
                  </div>
                );
              })}
            </div>
          </>)}

          {/* Month grid */}
          {panelMode==='month' && (
            <div className="cal-month-grid">
              {MONTHS.map((m,i)=>(
                <div key={i} className={`cal-month-item${panelDate.getMonth()===i?' selected':''}`}
                  onClick={()=>selectMonth(i)}>{m}</div>
              ))}
            </div>
          )}

          {/* Year grid */}
          {panelMode==='year' && (
            <div className="cal-year-grid">
              {Array.from({length:12},(_,i)=>yearBase+i).map(y=>(
                <div key={y} className={`cal-year-item${panelDate.getFullYear()===y?' selected':''}`}
                  onClick={()=>selectYear(y)}>{y}</div>
              ))}
            </div>
          )}

          {/* Footer */}
          <div className="cal-footer">
            <button className="btn btn-sm" style={{flex:1}} onClick={()=>{
              const t=new Date(); setPanelDate(t); setPanelMode('day');
              setCurDate(t); setOpen(false);
            }}>今天</button>
            <button className="btn btn-sm" style={{flex:1}} onClick={()=>setOpen(false)}>关闭</button>
          </div>
        </div>
      )}
    </div>
  );
}


/* ═══ Schedule Import Modal ═════════════════════════════════════════════════ */

/* ── Pure parsing logic (no React) ── */
function PreviewTabs({ parseResult, personnel, types, WD_LABELS, initialTab='summary' }) {
  const [tab, setTab] = useState(initialTab); // 'summary' | 'raw'
  const [zoom, setZoom] = useState(1);
  const cellMatchType = parseResult.cellMatchType || {};
  const cellTypeName = parseResult.cellTypeName || {};
  const rawWrapRef = useRef(null);
  const rawTopScrollRef = useRef(null);
  const [rawWrapWidth, setRawWrapWidth] = useState(0);

  useEffect(()=>{
    if (!rawWrapRef.current) return;
    const el = rawWrapRef.current;
    const update = ()=>setRawWrapWidth(el.clientWidth || 0);
    update();
    if (typeof ResizeObserver !== 'undefined') {
      const ro = new ResizeObserver(update);
      ro.observe(el);
      return ()=>ro.disconnect();
    }
    window.addEventListener('resize', update);
    return ()=>window.removeEventListener('resize', update);
  },[tab]);

  function withAlpha(color, alpha='33') {
    if (!color) return null;
    if (color.startsWith('#') && color.length === 7) return `${color}${alpha}`;
    return color;
  }

  // ── Legend colors
  const CELL_COLORS = {
    matched:   {bg:'var(--green)33',  color:'var(--green)',  border:'var(--green)66',  label:'已匹配人员'},
    unmatched: {bg:'var(--yellow)22', color:'var(--yellow)', border:'var(--yellow)66', label:'未匹配人员'},
    type:      {bg:'var(--accent)22', color:'var(--accent)', border:'var(--accent)55', label:'工时类型'},
  };

  function excelColName(idx) {
    let n = idx + 1;
    let s = '';
    while (n > 0) {
      const rem = (n - 1) % 26;
      s = String.fromCharCode(65 + rem) + s;
      n = Math.floor((n - 1) / 26);
    }
    return s;
  }

  // ── Raw grid renderer ───────────────────────────────────────────────────
  function RawGrid() {
    if (!parseResult.rawGrid) return <div style={{color:'var(--muted)',fontSize:'12px',padding:'20px',textAlign:'center'}}>原始表格数据不可用</div>;

    const grid = parseResult.rawGrid;
    const merges = parseResult.rawMerges || [];
    // Trim trailing empty rows/cols for display
    let maxR = 0, maxC = 0;
    for (let r=0; r<grid.length; r++) {
      for (let cc=0; cc<grid[r].length; cc++) {
        if (grid[r][cc].val) { maxR = Math.max(maxR, r); maxC = Math.max(maxC, cc); }
      }
    }
    // Add a small buffer
    maxR = Math.min(maxR + 1, grid.length - 1);
    maxC = Math.min(maxC + 1, (grid[0]?.length || 1) - 1);
    const mergeStarts = {};
    const mergeSkips = new Set();
    const mergedRows = new Set();
    for (const m of merges) {
      if (m.s.r > maxR || m.s.c > maxC) continue;
      const rowSpan = Math.min(m.e.r, maxR) - m.s.r + 1;
      const colSpan = Math.min(m.e.c, maxC) - m.s.c + 1;
      mergeStarts[`${m.s.r},${m.s.c}`] = { rowSpan, colSpan };
      for (let rr=m.s.r; rr<=Math.min(m.e.r,maxR); rr++) {
        mergedRows.add(rr);
        for (let cc=m.s.c; cc<=Math.min(m.e.c,maxC); cc++) {
          if (rr===m.s.r && cc===m.s.c) continue;
          mergeSkips.add(`${rr},${cc}`);
        }
      }
    }

    const HEADER_KW_VALS = new Set(['签到','楼层','负责人','值班','洗板擦布','洗抹布','洗板','时间']);

    function cellStyle(r, cc) {
      const key = `${r},${cc}`;
      const mt = cellMatchType[key];
      if (mt === 'matched') {
        const typeName = cellTypeName[key];
        const hitType = types.find(t=>t.name===typeName);
        if (hitType) {
          return {
            background: withAlpha(hitType.color, '22'),
            color: hitType.color,
            border:`1px solid ${withAlpha(hitType.color, '88')}`,
            fontWeight:700,
            boxShadow:`inset 0 0 0 1px ${withAlpha(hitType.color, '44')}`
          };
        }
      }
      if (mt && CELL_COLORS[mt]) {
        const col = CELL_COLORS[mt];
        return {background:col.bg, color:col.color, border:`1px solid ${col.border}`, fontWeight:600};
      }
      const val = grid[r]?.[cc]?.val;
      if (!val) return {};
      if (HEADER_KW_VALS.has(val)) return {background:'var(--surface2)',color:'var(--muted)',fontStyle:'italic'};
      return {};
    }

    const displayRows = [];
    let blankRun = [];
    const flushBlankRun = () => {
      if (!blankRun.length) return;
      if (blankRun.length > 5) {
        blankRun.slice(0,2).forEach(r=>displayRows.push({type:'row', r}));
        displayRows.push({type:'collapsed', count: blankRun.length - 4});
        blankRun.slice(-2).forEach(r=>displayRows.push({type:'row', r}));
      } else {
        blankRun.forEach(r=>displayRows.push({type:'row', r}));
      }
      blankRun = [];
    };

    for (let r=0; r<=maxR; r++) {
      const rowHasData = Array.from({length:maxC+1},(_,cc)=>grid[r]?.[cc]?.val).some(Boolean);
      const collapsibleBlank = !rowHasData && !mergedRows.has(r);
      if (collapsibleBlank) blankRun.push(r);
      else {
        flushBlankRun();
        displayRows.push({type:'row', r});
      }
    }
    flushBlankRun();

    const colWidths = Array.from({length:maxC+1}, (_,cc)=>{
      let longest = excelColName(cc).length;
      for (const row of displayRows) {
        if (row.type !== 'row') continue;
        if (mergeSkips.has(`${row.r},${cc}`)) continue;
        const span = mergeStarts[`${row.r},${cc}`];
        if (span?.colSpan > 1) continue;
        const val = grid[row.r]?.[cc]?.val || '';
        longest = Math.max(longest, String(val).length);
      }
      return Math.max(72, Math.min(260, longest * 11 + 26));
    });
    const rowHdrWidth = 48;
    const totalWidth = colWidths.reduce((s,v)=>s+v,0) + rowHdrWidth;
    const available = rawWrapWidth ? Math.max(320, rawWrapWidth - 8) : totalWidth;
    const scale = totalWidth > available ? Math.max(0.52, available / totalWidth) : 1;
    const fittedWidths = colWidths.map(w=>Math.max(56, Math.floor(w * scale)));
    const fittedTotalWidth = fittedWidths.reduce((s, v)=>s+v, 0) + rowHdrWidth;

    return (
      <div ref={rawWrapRef}>
        <div
          className="raw-grid-scroll-top"
          ref={rawTopScrollRef}
          onScroll={e=>{ const el = e.currentTarget.nextElementSibling; if (el && el.scrollLeft !== e.currentTarget.scrollLeft) el.scrollLeft = e.currentTarget.scrollLeft; }}
        >
          <div style={{width:fittedTotalWidth, height:1}} />
        </div>
      <div className="raw-grid-wrap"
        onScroll={e=>{ if (rawTopScrollRef.current && rawTopScrollRef.current.scrollLeft !== e.currentTarget.scrollLeft) rawTopScrollRef.current.scrollLeft = e.currentTarget.scrollLeft; }}>
        <div style={{zoom}}>
        <table className="raw-grid">
          <colgroup>
            <col style={{width:rowHdrWidth}} />
            {fittedWidths.map((w, idx)=><col key={idx} style={{width:w}} />)}
          </colgroup>
          <thead>
            <tr>
              <th className="row-hdr">#</th>
              {Array.from({length:maxC+1},(_,i)=>(
                <th key={i}>{excelColName(i)}</th>
              ))}
            </tr>
          </thead>
          <tbody>
            {displayRows.map((row, idx)=> row.type === 'collapsed' ? (
              <tr key={`collapsed-${idx}`}>
                <td className="row-hdr">…</td>
                <td className="cell-collapsed" colSpan={maxC+1}>已折叠 {row.count} 行连续空白行</td>
              </tr>
            ) : (
              <tr key={row.r}>
                <td className="row-hdr">{row.r+1}</td>
                {Array.from({length:maxC+1},(_,cc)=>{
                  if (mergeSkips.has(`${row.r},${cc}`)) return null;
                  const val = grid[row.r]?.[cc]?.val;
                  if (!val && !mergeStarts[`${row.r},${cc}`]) return <td key={cc} title="" />;
                  const st = cellStyle(row.r, cc);
                  const span = mergeStarts[`${row.r},${cc}`];
                  return (
                    <td key={cc} style={st} title={val||''} rowSpan={span?.rowSpan} colSpan={span?.colSpan}>
                      {val || ''}
                    </td>
                  );
                })}
              </tr>
            ))}
          </tbody>
        </table>
        </div>
      </div>
      </div>
    );
  }

  // ── Summary table ──────────────────────────────────────────────────────
  function SummaryTable() {
    const matchedPersonnel = personnel.filter(p=>
      Object.values(parseResult.result).some(d=>d[p.name])
    );
    return (
      <div className="sched-table-wrap">
        <table className="sched-table">
          <thead>
            <tr>
              <th style={{minWidth:60}}>姓名</th>
              {WD_LABELS.map(w=><th key={w}>{w}</th>)}
              <th>合计</th>
            </tr>
          </thead>
          <tbody>
            {matchedPersonnel.map(p=>{
              let tot = 0;
              return (
                <tr key={p.id}>
                  <td style={{fontWeight:600}}>{p.name}</td>
                  {[0,1,2,3,4,5,6].map(wd=>{
                    const pDay = parseResult.result[wd]?.[p.name];
                    if (!pDay) return <td key={wd} style={{color:'var(--border)'}}>—</td>;
                    const entries = Object.entries(pDay);
                    entries.forEach(([,cnt])=>{ tot+=cnt; });
                    return (
                      <td key={wd} style={{fontSize:'11px'}}>
                        {entries.map(([tn,cnt])=>{
                          const t = types.find(t=>t.name===tn);
                          return <div key={tn} style={{color:t?.color}}>{tn}×{cnt}</div>;
                        })}
                      </td>
                    );
                  })}
                  <td style={{fontFamily:'monospace',color:'var(--accent)',fontWeight:700}}>{tot}</td>
                </tr>
              );
            })}
            {matchedPersonnel.length===0 && (
              <tr><td colSpan={9} style={{textAlign:'center',color:'var(--muted)',padding:'16px'}}>暂无匹配人员</td></tr>
            )}
          </tbody>
        </table>
      </div>
    );
  }

  return (
    <div>
      {/* Tab switcher */}
      <div className="preview-tabs">
        <button className={`preview-tab${tab==='summary'?' active':''}`} onClick={()=>setTab('summary')}>
          📊 汇总（人员×星期）
        </button>
        <button className={`preview-tab${tab==='raw'?' active':''}`} onClick={()=>setTab('raw')}>
          🗂 原始表格（高亮识别区域）
        </button>
      </div>

      {tab==='raw' && (
        <div className="preview-toolbar">
          <button className="btn btn-sm" onClick={()=>setZoom(z=>Math.max(0.7, +(z - 0.1).toFixed(2)))}>缩小</button>
          <span className="zoom-label">{Math.round(zoom * 100)}%</span>
          <button className="btn btn-sm" onClick={()=>setZoom(z=>Math.min(1.8, +(z + 0.1).toFixed(2)))}>放大</button>
          <button className="btn btn-sm" onClick={()=>setZoom(1)}>重置</button>
          <div className="spacer" />
          <span style={{fontSize:'11px',color:'var(--muted)'}}>列宽会根据有数据列自动收缩到当前窗口内，连续 5 行以上空白区自动折叠</span>
        </div>
      )}

      {/* Legend (raw view only) */}
      {tab==='raw' && (
        <div style={{display:'flex',gap:'10px',marginBottom:'6px',flexWrap:'wrap',fontSize:'11px',alignItems:'center'}}>
          {types.map(t=>(
            <span key={t.id} style={{display:'inline-flex',alignItems:'center',gap:'4px'}}>
              <span style={{width:12,height:12,borderRadius:2,background:withAlpha(t.color,'22'),border:`1px solid ${withAlpha(t.color,'88')}`,display:'inline-block'}}/>
              {t.name}
            </span>
          ))}
          {Object.entries(CELL_COLORS).filter(([k])=>k!=='matched').map(([k,v])=>(
            <span key={k} style={{display:'inline-flex',alignItems:'center',gap:'4px'}}>
              <span style={{width:12,height:12,borderRadius:2,background:v.bg,border:`1px solid ${v.border}`,display:'inline-block'}}/>
              {v.label}
            </span>
          ))}
          <span style={{color:'var(--muted)',marginLeft:'auto'}}>已识别人员按工时类型着色；列 A-Z，行号对应 Excel 行</span>
        </div>
      )}

      {tab==='summary' ? <SummaryTable/> : <RawGrid/>}
    </div>
  );
}

function AliasSearchRow({ raw, value, personnel, onChange }) {
  const [query, setQuery] = useState(value || '');
  const [open, setOpen] = useState(false);

  useEffect(()=>{
    setQuery(value || '');
  },[value]);

  const suggestions = useMemo(()=>{
    const trimmed = query.trim();
    const source = trimmed ? personnel.filter(p=>matchSearch(p.name, trimmed)) : personnel;
    return source.slice(0, 30);
  },[personnel, query]);

  function choose(name) {
    onChange(name);
    setQuery(name);
    setOpen(false);
  }

  const exactMatched = personnel.find(p=>p.name===query);

  return (
    <div className="alias-map-row">
      <div className="alias-raw">{raw}</div>
      <div className="alias-current">{value ? `当前映射：${value}` : '当前未映射'}</div>
      <div className="alias-match-panel">
        <input
          className="inp"
          value={query}
          placeholder="搜索姓名 / 拼音首字母"
          onFocus={()=>setOpen(true)}
          onBlur={()=>setTimeout(()=>setOpen(false), 120)}
          onChange={e=>{ setQuery(e.target.value); setOpen(true); }}
        />
        {open && suggestions.length>0 && (
          <div className="alias-suggest">
            {suggestions.map(p=>(
              <button key={p.id} onMouseDown={e=>e.preventDefault()} onClick={()=>choose(p.name)}>
                {p.name}
              </button>
            ))}
          </div>
        )}
      </div>
      <div className="flow-actions">
        <button className="btn btn-sm" onClick={()=>choose(exactMatched.name)} disabled={!exactMatched}>匹配</button>
        <button className="btn btn-sm btn-danger" onClick={()=>{ onChange(''); setQuery(''); setOpen(false); }} disabled={!value}>清除</button>
      </div>
    </div>
  );
}

/* ── React Component ── */
function ScheduleImportModal({ personnel, types, initialRules, onSaveRules, onSave, close }) {
  const [step, setStep]               = useState(1);
  const [fileName, setFileName]       = useState('');
  const [ws, setWs]                   = useState(null);
  const [parseResult, setParseResult] = useState(null);
  const [modalRules, setModalRules]   = useState(()=>normalizeScheduleRules(initialRules));
  const [editData, setEditData]       = useState(null); // editable copy of result
  const [tplName, setTplName]         = useState('');
  const [typeKeyword, setTypeKeyword] = useState('');
  const [typeTarget, setTypeTarget]   = useState('');
  const [weekdayKeyword, setWeekdayKeyword] = useState('');
  const [weekdayTarget, setWeekdayTarget]   = useState(0);
  const [ignoreKeyword, setIgnoreKeyword] = useState('');
  const fileRef = useRef();
  const WD_LABELS = ['周一','周二','周三','周四','周五','周六','周日'];

  function rerunParse(sheet = ws, rules = modalRules) {
    if (!sheet) return;
    const res = parseScheduleSheetNew(sheet, types, personnel, rules);
    setParseResult(res);
    if (!res.error) setEditData(JSON.parse(JSON.stringify(res.result)));
  }

  function handleFile(e) {
    const file = e.target.files[0]; if (!file) return;
    setFileName(file.name);
    setTplName(file.name.replace(/\.[^.]+$/,''));
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const wb = XLSX.read(ev.target.result, {type:'binary'});
        const sheet = wb.Sheets[wb.SheetNames[0]];
        setWs(sheet);
        const res = parseScheduleSheetNew(sheet, types, personnel, modalRules);
        setParseResult(res);
        if (!res.error) {
          setEditData(JSON.parse(JSON.stringify(res.result)));
          setStep(2);
        }
      } catch(err) { setParseResult({error:'读取失败：'+err.message}); }
    };
    reader.readAsBinaryString(file);
    e.target.value = '';
  }

  function updateRules(nextRules) {
    const normalized = normalizeScheduleRules(nextRules);
    setModalRules(normalized);
    rerunParse(ws, normalized);
  }

  function setAlias(raw, val) {
    const personAliases = {...modalRules.personAliases};
    if (val) personAliases[raw] = val;
    else delete personAliases[raw];
    updateRules({...modalRules, personAliases});
  }

  function addTypeRule() {
    const keyword = normStr(typeKeyword);
    if (!keyword || !typeTarget) return;
    updateRules({
      ...modalRules,
      typeRules:[...modalRules.typeRules, {id:uid(), keyword, typeName:typeTarget}],
    });
    setTypeKeyword('');
  }

  function addWeekdayRule() {
    const keyword = normStr(weekdayKeyword);
    if (!keyword) return;
    updateRules({
      ...modalRules,
      weekdayRules:[...modalRules.weekdayRules, {id:uid(), keyword, weekday:Number(weekdayTarget)}],
    });
    setWeekdayKeyword('');
    setWeekdayTarget(0);
  }

  function addIgnoreRule() {
    const keyword = normStr(ignoreKeyword);
    if (!keyword) return;
    updateRules({
      ...modalRules,
      ignoreRules:[...modalRules.ignoreRules, {id:uid(), keyword}],
    });
    setIgnoreKeyword('');
  }

  function removeRule(group, id) {
    updateRules({
      ...modalRules,
      [group]: modalRules[group].filter(rule=>rule.id!==id),
    });
  }

  function saveRuleLibrary() {
    onSaveRules(normalizeScheduleRules(modalRules));
  }

  function resetRuleLibrary() {
    const cleared = makeEmptyScheduleRules();
    setModalRules(cleared);
    onSaveRules(cleared);
    rerunParse(ws, cleared);
  }

  // ── Computed ──────────────────────────────────────────────────────────
  const totalCount = editData
    ? Object.values(editData).reduce((s,d)=>s+Object.values(d).reduce((ss,tt)=>ss+Object.values(tt).reduce((n,v)=>n+v,0),0),0)
    : 0;

  // All person names present in editData
  const editPersons = editData
    ? [...new Set(Object.values(editData).flatMap(d=>Object.keys(d)))].sort()
    : [];
  const totalRuleCount = Object.keys(modalRules.personAliases).length + modalRules.typeRules.length + modalRules.weekdayRules.length + modalRules.ignoreRules.length;
  const personAliasPreview = Object.entries(modalRules.personAliases).slice(0,3).map(([from,to])=>`${from} → ${to}`).join('，');
  const typeRulePreview = modalRules.typeRules.slice(0,3).map(rule=>`${rule.keyword} → ${rule.typeName}`).join('，');
  const weekdayRulePreview = modalRules.weekdayRules.slice(0,3).map(rule=>`${rule.keyword} → ${WD_LABELS[rule.weekday]}`).join('，');
  const ignoreRulePreview = modalRules.ignoreRules.slice(0,4).map(rule=>rule.keyword).join('、');
  const typeKeywordPlaceholder = modalRules.typeRules.length
    ? `例如：${modalRules.typeRules[0].keyword} → ${modalRules.typeRules[0].typeName}`
    : types.length
      ? `例如：晚巡 → ${types[Math.min(1, types.length - 1)].name}`
      : '例如：晚巡 → 值班';
  const weekdayKeywordPlaceholder = modalRules.weekdayRules.length
    ? `例如：${modalRules.weekdayRules[0].keyword} → ${WD_LABELS[modalRules.weekdayRules[0].weekday]}`
    : '例如：周末夜班 → 周六';
  const ignoreKeywordPlaceholder = modalRules.ignoreRules.length
    ? `例如：忽略“${modalRules.ignoreRules[0].keyword}”`
    : '例如：忽略“备用”';

  function doSave() {
    if (!editData) return;
    onSave({
      id: `tpl_${Date.now()}_${Math.floor(Math.random()*100000)}`,
      name: tplName || '排班模板',
      data: editData,
      preview: parseResult ? {
        rawGrid: parseResult.rawGrid,
        rawMerges: parseResult.rawMerges,
        cellMatchType: parseResult.cellMatchType,
        cellTypeName: parseResult.cellTypeName,
        cellSlotMap: parseResult.cellSlotMap,
      } : null,
    });
  }

  return (
    <div className="overlay" onClick={e=>e.target===e.currentTarget&&close()}>
      <div className="modal" style={{width:'min(1240px, 96vw)',maxHeight:'92vh',overflow:'hidden',display:'flex',flexDirection:'column',padding:'18px'}}>
        <div className="modal-title" style={{marginBottom:10}}>
          📅 排班表 → 周模板
          <span style={{fontSize:'11px',color:'var(--muted)',fontWeight:400,marginLeft:8}}>支持规则库、人工校正和保存复用</span>
          <button className="close" onClick={close}>✕</button>
        </div>

        <div className="step-tabs">
          {[['1','上传文件'],['2','规则与映射'],['3','编辑 & 确认']].map(([n,label],i)=>(
            <button key={n} className={`step-tab${step===i+1?' active':step>i+1?' done':''}`}
              onClick={()=>step>i+1&&setStep(i+1)}>{n}. {label}</button>
          ))}
        </div>

        <div style={{flex:1,overflowY:'auto'}}>

        {/* ── Step 1 ── */}
        {step===1 && (
          <div>
            <div style={{fontSize:'12px',color:'var(--muted)',marginBottom:'12px',lineHeight:1.8,
              background:'var(--surface2)',borderRadius:6,padding:'10px 12px'}}>
              <strong style={{color:'var(--text)'}}>支持格式：</strong>
              时间段（<code>7:05-9:35</code>）、类型+时段（<code>晚巡21:00-22:00</code>）、
              日期+时段（<code>周六7:30-9:30</code>）、日期（<code>周一</code>）、
              类型（<code>晚上值日</code>、<code>负责人</code>）均自动匹配工时类型
            </div>
            <div style={{display:'flex',gap:'8px',flexWrap:'wrap',marginBottom:'10px'}}>
              <span className="flow-badge done">别名规则 {Object.keys(modalRules.personAliases).length}</span>
              <span className="flow-badge active">解析规则 {modalRules.typeRules.length + modalRules.weekdayRules.length + modalRules.ignoreRules.length}</span>
            </div>
            <input ref={fileRef} type="file" accept=".xlsx,.xls" style={{display:'none'}} onChange={handleFile}/>
            <div style={{display:'flex',gap:'10px',alignItems:'center'}}>
              <button className="btn btn-primary" onClick={()=>fileRef.current.click()}>📂 选择排班 Excel</button>
              {fileName && <span style={{fontSize:'12px',color:'var(--muted)'}}>{fileName}</span>}
            </div>
            {parseResult?.error && (
              <div style={{marginTop:'12px',padding:'10px',background:'var(--red)1a',
                border:'1px solid var(--red)',borderRadius:6,fontSize:'12px',color:'var(--red)'}}>
                ⚠ {parseResult.error}
              </div>
            )}
          </div>
        )}

        {/* ── Step 2 ── */}
        {step===2 && parseResult && !parseResult.error && (
          <div>
            <div style={{display:'flex',gap:'8px',flexWrap:'wrap',marginBottom:'12px'}}>
              <span className={`flow-badge ${parseResult.unmatched.length ? 'todo' : 'done'}`}>未匹配姓名 {parseResult.unmatched.length}</span>
              <span className="flow-badge active">规则总数 {totalRuleCount}</span>
              <span className="flow-badge active">已识别记录 {Object.values(parseResult.result||{}).reduce((s,d)=>s+Object.values(d).reduce((ss,tt)=>ss+Object.values(tt).reduce((n,v)=>n+v,0),0),0)}</span>
            </div>

            <div className="rule-block">
              <div className="rule-block-title">
                <strong>姓名映射规则</strong>
                <div className="flow-actions">
                  <button className="btn btn-sm" onClick={saveRuleLibrary}>保存规则库</button>
                  <button className="btn btn-sm btn-danger" onClick={resetRuleLibrary}>清空规则库</button>
                </div>
              </div>
              <div style={{fontSize:'12px',color:'var(--muted)',marginBottom:'8px',lineHeight:1.7}}>
                用于把排班表里的别名、简称或错字统一映射到系统人员。保存后下次导入同类排班表会自动复用。
              </div>
              {parseResult.unmatched.length ? (
                <div className="alias-map-list">
                  <div className="alias-help">默认会展示完整人员列表；输入姓名或拼音首字母后会缩小范围，再点选完成替换。</div>
                  {parseResult.unmatched.map(raw=>(
                    <AliasSearchRow
                      key={raw}
                      raw={raw}
                      value={modalRules.personAliases[raw]||''}
                      personnel={personnel}
                      onChange={val=>setAlias(raw, val)}
                    />
                  ))}
                  {personAliasPreview && <div className="rule-note">现有别名规则：{personAliasPreview}</div>}
                </div>
              ) : (
                <div className="rule-empty">当前文件没有未匹配姓名，可以继续配置类型、星期和忽略规则。</div>
              )}
            </div>

            <div className="rule-block">
              <div className="rule-block-title"><strong>类型关键词规则</strong><span style={{fontSize:'11px',color:'var(--muted)'}}>命中关键词时强制指定工时类型</span></div>
              <div className="rule-add-grid compact" style={{marginBottom:'8px'}}>
                <input className="inp" placeholder={typeKeywordPlaceholder} value={typeKeyword} onChange={e=>setTypeKeyword(e.target.value)}/>
                <select className="rule-sel" value={typeTarget} onChange={e=>setTypeTarget(e.target.value)}>
                  <option value="">选择工时类型</option>
                  {types.map(t=><option key={t.id} value={t.name}>{t.name} · {t.hours}h</option>)}
                </select>
              </div>
              <div className="flow-actions" style={{marginBottom:'8px'}}>
                <button className="btn btn-sm" onClick={addTypeRule}>新增类型规则</button>
              </div>
              <div className="rule-list">
                {modalRules.typeRules.length ? modalRules.typeRules.map(rule=>(
                  <div key={rule.id} className="rule-chip">
                    <code>{rule.keyword}</code><span className="sp">→</span><strong>{rule.typeName}</strong>
                    <button className="btn btn-sm btn-danger" onClick={()=>removeRule('typeRules', rule.id)}>删除</button>
                  </div>
                )) : <div className="rule-empty">暂无类型关键词规则。</div>}
              </div>
              {typeRulePreview && <div className="rule-note">现有类型规则：{typeRulePreview}</div>}
            </div>

            <div className="rule-block">
              <div className="rule-block-title"><strong>星期关键词规则</strong><span style={{fontSize:'11px',color:'var(--muted)'}}>遇到非标准写法时强制指定周几</span></div>
              <div className="rule-add-grid compact" style={{marginBottom:'8px'}}>
                <input className="inp" placeholder={weekdayKeywordPlaceholder} value={weekdayKeyword} onChange={e=>setWeekdayKeyword(e.target.value)}/>
                <select className="rule-sel" value={weekdayTarget} onChange={e=>setWeekdayTarget(e.target.value)}>
                  {WD_LABELS.map((label, index)=><option key={label} value={index}>{label}</option>)}
                </select>
              </div>
              <div className="flow-actions" style={{marginBottom:'8px'}}>
                <button className="btn btn-sm" onClick={addWeekdayRule}>新增星期规则</button>
              </div>
              <div className="rule-list">
                {modalRules.weekdayRules.length ? modalRules.weekdayRules.map(rule=>(
                  <div key={rule.id} className="rule-chip">
                    <code>{rule.keyword}</code><span className="sp">→</span><strong>{WD_LABELS[rule.weekday]}</strong>
                    <button className="btn btn-sm btn-danger" onClick={()=>removeRule('weekdayRules', rule.id)}>删除</button>
                  </div>
                )) : <div className="rule-empty">暂无星期关键词规则。</div>}
              </div>
              {weekdayRulePreview && <div className="rule-note">现有星期规则：{weekdayRulePreview}</div>}
            </div>

            <div className="rule-block">
              <div className="rule-block-title"><strong>忽略关键词规则</strong><span style={{fontSize:'11px',color:'var(--muted)'}}>命中后不再把单元格识别为人员姓名</span></div>
              <div className="rule-add-grid single" style={{marginBottom:'8px'}}>
                <input className="inp" placeholder={ignoreKeywordPlaceholder} value={ignoreKeyword} onChange={e=>setIgnoreKeyword(e.target.value)}/>
                <button className="btn btn-sm" onClick={addIgnoreRule}>新增忽略词</button>
              </div>
              <div className="rule-list">
                {modalRules.ignoreRules.length ? modalRules.ignoreRules.map(rule=>(
                  <div key={rule.id} className="rule-chip">
                    <code>{rule.keyword}</code>
                    <button className="btn btn-sm btn-danger" onClick={()=>removeRule('ignoreRules', rule.id)}>删除</button>
                  </div>
                )) : <div className="rule-empty">暂无忽略关键词规则。</div>}
              </div>
              {ignoreRulePreview && <div className="rule-note">当前忽略关键词：{ignoreRulePreview}</div>}
            </div>

            <div style={{fontSize:'12px',color:'var(--yellow)',marginBottom:'12px',padding:'8px 12px',
              background:'var(--yellow)1a',borderRadius:6,border:'1px solid var(--yellow)'}}>
              ⚠ 如果当前解析仍有缺口，先在上面补规则并保存，再进入下一步人工编辑。
            </div>
            <div style={{marginTop:'14px',display:'flex',gap:'8px'}}>
              <button className="btn" onClick={()=>setStep(1)}>← 返回</button>
              <button className="btn btn-primary" onClick={()=>{ setEditData(JSON.parse(JSON.stringify(parseResult.result))); setStep(3); }}>
                下一步 →
              </button>
            </div>
          </div>
        )}

        {/* ── Step 3: Editable table ── */}
        {step===3 && editData && (
          <div>
            {/* Stats bar */}
            <div style={{display:'flex',gap:'12px',marginBottom:'10px',fontSize:'12px',
              alignItems:'center',flexWrap:'wrap'}}>
              <span style={{color:'var(--muted)'}}>
                共 <strong style={{color:'var(--text)'}}>{editPersons.length}</strong> 人 ·
                <strong style={{color:'var(--accent)'}}> {totalCount}</strong> 条记录
              </span>
              {parseResult?.unmatched?.length>0 && (
                <span style={{color:'var(--yellow)'}}>⚠ {parseResult.unmatched.length} 个姓名仍未匹配，可返回继续补规则</span>
              )}
              <span style={{fontSize:'11px',color:'var(--muted)',marginLeft:'auto'}}>
                💡 这里先把周模板校准干净；保存后先指派当前周模板，必要时再写入模板数据，最后回按天核对差异
              </span>
            </div>

            <div className="rule-block" style={{marginBottom:'12px'}}>
              <div className="rule-block-title">
                <strong>原表布局可视化预览</strong>
                <span style={{fontSize:'11px',color:'var(--muted)'}}>与导入 Excel 保持相同网格结构，已识别人员按工时类型着色</span>
              </div>
              <PreviewTabs
                parseResult={parseResult}
                personnel={personnel}
                types={types}
                WD_LABELS={WD_LABELS}
                initialTab="raw"
              />
            </div>

            <div style={{fontSize:'12px',color:'var(--muted)',marginTop:'10px',lineHeight:1.8,
              background:'var(--surface2)',borderRadius:8,padding:'10px 12px'}}>
              当前阶段只保留原始视图确认。若识别仍有问题，请返回上一步补规则；确认无误后直接保存为模板，并在按周修订模式中完成替换。
            </div>

            {/* Footer */}
            <div style={{display:'flex',gap:'8px',alignItems:'center',marginTop:'10px',flexWrap:'wrap'}}>
              <button className="btn" onClick={()=>setStep(2)}>← 返回规则</button>
              <input className="inp" placeholder="模板名称…" value={tplName}
                onChange={e=>setTplName(e.target.value)} style={{flex:1,minWidth:'120px'}}/>
              <button className="btn btn-primary" disabled={!totalCount} onClick={doSave}>
                ✓ 保存为模板
              </button>
            </div>
          </div>
        )}
        </div>
      </div>
    </div>
  );
}

/* ═══ Clear Records Modal ════════════════════════════════════════════════════ */
function ClearRecordsModal({ allDates, onConfirm, close }) {
  const [rangeType, setRangeType] = useState('all');
  const [startDate, setStartDate] = useState(allDates[0] || '');
  const [endDate, setEndDate] = useState(allDates[allDates.length - 1] || '');

  useEffect(()=>{
    setStartDate(allDates[0] || '');
    setEndDate(allDates[allDates.length - 1] || '');
  },[allDates]);

  const targetDates = useMemo(()=>{
    if (rangeType === 'all') return allDates;
    if (!startDate || !endDate || startDate > endDate) return [];
    return allDates.filter(d=>d>=startDate && d<=endDate);
  },[allDates, rangeType, startDate, endDate]);

  const invalidRange = rangeType === 'custom' && (!startDate || !endDate || startDate > endDate);

  return (
    <div className="overlay">
      <div className="modal modal-sm">
        <div className="modal-title">🧹 清空记录</div>
        {!allDates.length ? (
          <p style={{fontSize:'13px',color:'var(--muted)',marginBottom:'16px'}}>当前没有可清空的记录。</p>
        ) : (
          <>
            <div className="radio-row" style={{marginBottom:'12px'}}>
              <label><input type="radio" checked={rangeType==='all'} onChange={()=>setRangeType('all')}/> 全部时间</label>
              <label><input type="radio" checked={rangeType==='custom'} onChange={()=>setRangeType('custom')}/> 指定时间范围</label>
            </div>
            {rangeType==='custom' && (
              <div style={{display:'flex',gap:'8px',alignItems:'center',marginBottom:'10px',flexWrap:'wrap'}}>
                <input className="inp" type="date" value={startDate} min={allDates[0]} max={allDates[allDates.length-1]} onChange={e=>setStartDate(e.target.value)} style={{flex:1,minWidth:'120px'}}/>
                <span style={{fontSize:'12px',color:'var(--muted)'}}>至</span>
                <input className="inp" type="date" value={endDate} min={allDates[0]} max={allDates[allDates.length-1]} onChange={e=>setEndDate(e.target.value)} style={{flex:1,minWidth:'120px'}}/>
              </div>
            )}
            <p style={{fontSize:'12px',color:invalidRange?'var(--red)':'var(--muted)',marginBottom:'14px'}}>
              {invalidRange ? '起止日期无效，请重新选择。' : `将清空 ${targetDates.length} 天记录（不可撤销）。`}
            </p>
          </>
        )}
        <div style={{display:'flex',justifyContent:'flex-end',gap:'8px'}}>
          <button className="btn" onClick={close}>取消</button>
          <button
            className="btn btn-danger"
            style={{background:'var(--red)',color:'#fff'}}
            disabled={!allDates.length || invalidRange || !targetDates.length}
            onClick={()=>onConfirm(rangeType, startDate, endDate)}
          >
            确认清空
          </button>
        </div>
      </div>
    </div>
  );
}

/* ═══ Confirm Modal ═════════════════════════════════════════════════════════ */
function ConfirmModal({ msg, onOk, close, okLabel }) {
  return (
    <div className="overlay">
      <div className="modal modal-sm">
        <div className="modal-title">⚠ 确认操作</div>
        <p style={{fontSize:'13px',color:'var(--text)',marginBottom:'18px',lineHeight:1.6}}>{msg}</p>
        <div style={{display:'flex',justifyContent:'flex-end',gap:'8px'}}>
          <button className="btn" onClick={close}>取消</button>
          <button className="btn btn-danger" style={{background:'var(--red)',color:'#fff'}} onClick={onOk}>{okLabel||'确认'}</button>
        </div>
      </div>
    </div>
  );
}

/* ═══ Mount ═════════════════════════════════════════════════════════════════ */
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
