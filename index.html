<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>工时统计系统</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pinyin-pro@3.24.2/dist/index.js"></script>
<link rel="stylesheet" href="./assets/css/styles.css">
</head>
<body>
<div id="root"></div>
<script>document.body.classList.toggle("light",localStorage.getItem("wh_theme")==="light")</script>
<script src="./assets/js/core.js"></script>
<script type="text/babel">
const { useState, useEffect, useRef, useMemo, useCallback } = React;

/* ═══ Pinyin Search (via pinyin-pro) ══════════════════════════════════════ */
function App() {
  function countCell(cell) {
    if (Array.isArray(cell)) return cell.length;
    const n = parseInt(cell, 10);
    return Number.isFinite(n) && n > 0 ? n : 0;
  }

  function normalizeEntry(entry, fallback = {}) {
    if (entry && typeof entry === 'object') {
      return {
        id: entry.id || uid(),
        source: entry.source || fallback.source || 'legacy',
        createdAt: Number.isFinite(entry.createdAt) ? entry.createdAt : Date.now(),
        absSlotKey: entry.absSlotKey || entry.slotKey || fallback.absSlotKey || null,
        absRow: Number.isFinite(entry.absRow) ? entry.absRow : (Number.isFinite(entry.row) ? entry.row : (fallback.absRow ?? null)),
        absCol: Number.isFinite(entry.absCol) ? entry.absCol : (Number.isFinite(entry.col) ? entry.col : (fallback.absCol ?? null)),
        rowLimit: entry.rowLimit || fallback.rowLimit || null,
        colLimit: entry.colLimit || fallback.colLimit || null,
        typeName: entry.typeName || fallback.typeName || null,
      };
    }
    return {
      id: uid(),
      source: fallback.source || 'legacy',
      createdAt: Date.now(),
      absSlotKey: fallback.absSlotKey || null,
      absRow: fallback.absRow ?? null,
      absCol: fallback.absCol ?? null,
      rowLimit: fallback.rowLimit || null,
      colLimit: fallback.colLimit || null,
      typeName: fallback.typeName || null,
    };
  }

  function normalizeCellEntries(cell, fallback = {}) {
    if (Array.isArray(cell)) return cell.map(item=>normalizeEntry(item, fallback));
    const n = countCell(cell);
    return Array.from({length:n}, ()=>normalizeEntry(null, fallback));
  }

  function normalizeRecordsModel(input) {
    const out = {};
    if (!input || typeof input !== 'object') return out;
    Object.entries(input).forEach(([dateStr, dayObj])=>{
      if (!dayObj || typeof dayObj !== 'object') return;
      out[dateStr] = {};
      Object.entries(dayObj).forEach(([pid, personObj])=>{
        if (!personObj || typeof personObj !== 'object') return;
        out[dateStr][pid] = {};
        Object.entries(personObj).forEach(([tid, cell])=>{
          const n = countCell(cell);
          if (!n && !Array.isArray(cell)) return;
          out[dateStr][pid][tid] = normalizeCellEntries(cell);
        });
        if (!Object.keys(out[dateStr][pid]).length) delete out[dateStr][pid];
      });
      if (!Object.keys(out[dateStr]).length) delete out[dateStr];
    });
    return out;
  }

  const LS_TEMPLATE_LEGACY = 'wh_template';
  const LS_TEMPLATE_LIBRARY = 'wh_template_library';
  const LS_WEEK_TEMPLATE_MAP = 'wh_week_template_map';
  const LS_WEEK_DAY_LOCKS = 'wh_week_day_locks';
  const [personnel, setPersonnel] = useState(()=>loadLS('wh_personnel', DEF_PERSONNEL));
  const [types, setTypes]         = useState(()=>loadLS('wh_types', DEF_TYPES));
  const [records, setRecords]     = useState(()=>normalizeRecordsModel(loadLS('wh_records', {})));
  const [view, setView]           = useState('day');
  const [weekMode, setWeekMode]   = useState('stats');
  const [curDate, setCurDate]     = useState(new Date());
  const [search, setSearch]       = useState('');
  const [modal, setModal]         = useState(null);
  const [confirmCb, setConfirmCb] = useState(null);
  const [theme, setTheme]         = useState(()=>loadLS('wh_theme','dark'));
  const [templateLibrary, setTemplateLibrary] = useState(()=>{
    const list = loadLS(LS_TEMPLATE_LIBRARY, null);
    if (Array.isArray(list)) {
      return list
        .map((tpl, idx)=>normalizeTemplateObject({
          ...tpl,
          id: tpl?.id || `tpl_migrated_${Date.now()}_${idx}`,
        }))
        .filter(Boolean);
    }
    const legacy = loadLS(LS_TEMPLATE_LEGACY, null);
    if (!legacy) return [];
    return [normalizeTemplateObject({ ...legacy, id: `tpl_${Date.now()}` })].filter(Boolean);
  });
  const [selectedTemplateId, setSelectedTemplateId] = useState('');
  const [weekTemplateMap, setWeekTemplateMap] = useState(()=>loadLS(LS_WEEK_TEMPLATE_MAP, {}));
  const [weekDayLocks, setWeekDayLocks] = useState(()=>loadLS(LS_WEEK_DAY_LOCKS, {}));
  const [hiddenIds, setHiddenIds] = useState(()=>{ try{ return new Set(JSON.parse(localStorage.getItem('wh_hidden')||'[]')); }catch{ return new Set(); } });
  const [autoHide,  setAutoHide]  = useState(()=>loadLS('wh_autohide', false));
  const [showDiff,  setShowDiff]  = useState(false);
  const [toast, setToast]         = useState(null);
  const [scheduleRules, setScheduleRules] = useState(()=>normalizeScheduleRules(loadLS('wh_schedule_rules', makeEmptyScheduleRules())));
  const [flowCollapsed, setFlowCollapsed] = useState(()=>loadLS('wh_flow_collapsed', false));
  const importRecRef = useRef();
  const importPplRef = useRef();
  const mainRef = useRef(null);
  const toastTimerRef = useRef(null);

  useEffect(()=>{ localStorage.setItem('wh_personnel',JSON.stringify(personnel)); },[personnel]);
  useEffect(()=>{ localStorage.setItem('wh_types',JSON.stringify(types)); },[types]);
  useEffect(()=>{ localStorage.setItem('wh_records',JSON.stringify(records)); },[records]);
  useEffect(()=>{
    localStorage.setItem('wh_hidden', JSON.stringify([...hiddenIds]));
  },[hiddenIds]);
  useEffect(()=>{
    localStorage.setItem('wh_autohide', JSON.stringify(autoHide));
  },[autoHide]);
  useEffect(()=>{
    localStorage.setItem('wh_schedule_rules', JSON.stringify(scheduleRules));
  },[scheduleRules]);
  useEffect(()=>{
    localStorage.setItem(LS_TEMPLATE_LIBRARY, JSON.stringify(templateLibrary));
    localStorage.removeItem(LS_TEMPLATE_LEGACY);
  },[templateLibrary]);
  useEffect(()=>{
    localStorage.setItem(LS_WEEK_TEMPLATE_MAP, JSON.stringify(weekTemplateMap));
  },[weekTemplateMap]);
  useEffect(()=>{
    localStorage.setItem(LS_WEEK_DAY_LOCKS, JSON.stringify(weekDayLocks));
  },[weekDayLocks]);
  useEffect(()=>{
    localStorage.setItem('wh_flow_collapsed', JSON.stringify(flowCollapsed));
  },[flowCollapsed]);
  useEffect(()=>()=>{ if (toastTimerRef.current) clearTimeout(toastTimerRef.current); },[]);
  // Auto-hide zero-hours people when autoHide is on and view/date changes
  useEffect(()=>{
    if (!autoHide) return;
    setHiddenIds(()=>{
      const n = new Set();
      for (const p of personnel) {
        const h = view==='day'
          ? records?.[fmt(curDate)]?.[p.id]
            ? types.reduce((s,t)=>s+((records[fmt(curDate)][p.id][t.id]||0)*t.hours),0)
            : 0
          : weekDates(getMonday(curDate)).reduce((s,d)=>{
              const dr=records?.[fmt(d)]?.[p.id]||{};
              return s+types.reduce((ss,t)=>ss+(dr[t.id]||0)*t.hours,0);
            },0);
        if (h===0) n.add(p.id);
      }
      return n;
    });
  },[autoHide, view, curDate, records]);
  useEffect(()=>{
    localStorage.setItem('wh_theme', theme);
    document.body.classList.toggle('light', theme==='light');
  },[theme]);

  const monday  = useMemo(()=>getMonday(curDate),[curDate]);
  const wDates  = useMemo(()=>weekDates(monday),[monday]);
  const currentWeekStart = useMemo(()=>fmt(monday), [monday]);
  const assignedTemplateId = weekTemplateMap?.[currentWeekStart] || '';
  const currentTemplate = useMemo(
    ()=>templateLibrary.find(t=>t.id===assignedTemplateId) || null,
    [templateLibrary, assignedTemplateId]
  );
  const selectedTemplate = useMemo(
    ()=>templateLibrary.find(t=>t.id===selectedTemplateId) || null,
    [templateLibrary, selectedTemplateId]
  );
  const isCurrentWeekDayLocked = false;

  useEffect(()=>{
    if (!templateLibrary.length) {
      if (selectedTemplateId) setSelectedTemplateId('');
      return;
    }
    const selectedExists = templateLibrary.some(t=>t.id===selectedTemplateId);
    if (!selectedExists) setSelectedTemplateId(templateLibrary[0].id);
  },[templateLibrary, selectedTemplateId]);

  useEffect(()=>{
    if (!currentTemplate && showDiff) setShowDiff(false);
  },[currentTemplate, showDiff]);
  const filtered        = useMemo(()=>{
    const lib = window.pinyinPro;
    return personnel
      .filter(p=>matchSearch(p.name,search))
      .sort((a,b)=>{
        try {
          if (lib) {
            const pa = lib.pinyin(a.name,{toneType:'none',separator:''}).toLowerCase();
            const pb = lib.pinyin(b.name,{toneType:'none',separator:''}).toLowerCase();
            return pa.localeCompare(pb,'zh');
          }
        } catch{}
        return a.name.localeCompare(b.name,'zh');
      });
  },[personnel,search]);
  // When searching: ignore hiddenIds so all matches appear in table
  const tablePersonnel  = useMemo(()=>search
    ? filtered
    : filtered.filter(p=>!hiddenIds.has(p.id)),
  [filtered, hiddenIds, search]);
  const curStr  = fmt(curDate);

  // diffPersonnel: when diff mode on, add people who appear in template but not in tablePersonnel
  const diffPersonnel = useMemo(()=>{
    if (!showDiff || !currentTemplate) return tablePersonnel;
    const inTable = new Set(tablePersonnel.map(p=>p.id));
    const extra = [];
    // for day view: check relDay; for week view: check all 7 days
    const checkDays = view==='day'
      ? [curDate.getDay()===0?6:curDate.getDay()-1]
      : [0,1,2,3,4,5,6];
    for (const p of personnel) {
      if (inTable.has(p.id)) continue;
      const hasInTpl = checkDays.some(wd=>{
        const d = currentTemplate.data[wd];
        return d && d[p.name] && Object.values(d[p.name]).some(v=>v>0);
      });
      if (hasInTpl) extra.push(p);
    }
    return [...tablePersonnel, ...extra];
  },[showDiff, currentTemplate, tablePersonnel, personnel, view, curDate]);
  const todayStr= fmt(new Date());

  /* ── Record helpers ── */
  function getCount(dateStr, pid, tid) {
    return countCell(records?.[dateStr]?.[pid]?.[tid]);
  }
  function getEntries(dateStr, pid, tid, fallback = {}) {
    const cell = records?.[dateStr]?.[pid]?.[tid];
    return normalizeCellEntries(cell, fallback).sort((a,b)=>{
      const ar = Number.isFinite(a?.absRow) ? a.absRow : Number.POSITIVE_INFINITY;
      const br = Number.isFinite(b?.absRow) ? b.absRow : Number.POSITIVE_INFINITY;
      const ac = Number.isFinite(a?.absCol) ? a.absCol : Number.POSITIVE_INFINITY;
      const bc = Number.isFinite(b?.absCol) ? b.absCol : Number.POSITIVE_INFINITY;
      if (ar !== br) return ar - br;
      if (ac !== bc) return ac - bc;
      return String(a?.id || '').localeCompare(String(b?.id || ''), 'zh');
    });
  }
  function getTplCount(relDay, personName, typeName) {
    return currentTemplate?.data?.[relDay]?.[personName]?.[typeName] || 0;
  }
  const tplEntryIndex = useMemo(()=>{
    const out = {};
    if (!currentTemplate) return out;
    const push = (key, entry) => {
      out[key] = out[key] || [];
      out[key].push(entry);
    };
    const slotMap = currentTemplate?.preview?.cellSlotMap || {};
    Object.entries(slotMap)
      .sort((a,b)=>{
        const [ak,av] = a;
        const [bk,bv] = b;
        const ar = Number.isFinite(av?.row) ? av.row : parseInt(String(ak).split(',')[0],10);
        const ac = Number.isFinite(av?.col) ? av.col : parseInt(String(ak).split(',')[1],10);
        const br = Number.isFinite(bv?.row) ? bv.row : parseInt(String(bk).split(',')[0],10);
        const bc = Number.isFinite(bv?.col) ? bv.col : parseInt(String(bk).split(',')[1],10);
        return ar-br || ac-bc;
      })
      .forEach(([slotKey, slot])=>{
        if (!slot?.personName || !slot?.typeName) return;
        const relDay = Number(slot.weekday);
        if (!Number.isFinite(relDay)) return;
        const key = `${relDay}|${slot.personName}|${slot.typeName}`;
        push(key, normalizeEntry({
          id: `tpl_${slot.slotKey || slotKey}`,
          source: 'template',
          absSlotKey: slot.slotKey || slotKey,
          absRow: Number.isFinite(slot.row) ? slot.row : null,
          absCol: Number.isFinite(slot.col) ? slot.col : null,
          rowLimit: slot.rowLimit || slot.typeName,
          colLimit: slot.colLimit || WD[relDay] || '',
          typeName: slot.typeName,
        }));
      });
    Object.entries(currentTemplate?.data || {}).forEach(([wd, dayMap])=>{
      const relDay = parseInt(wd, 10);
      if (!Number.isFinite(relDay)) return;
      Object.entries(dayMap || {}).forEach(([personName, typeMap])=>{
        Object.entries(typeMap || {}).forEach(([typeName, cntRaw])=>{
          const cnt = parseInt(cntRaw, 10) || 0;
          if (!(cnt > 0)) return;
          const key = `${relDay}|${personName}|${typeName}`;
          out[key] = out[key] || [];
          while (out[key].length < cnt) {
            out[key].push(normalizeEntry({
              id: `tpl_virtual_${relDay}_${personName}_${typeName}_${out[key].length}`,
              source: 'template',
              rowLimit: typeName,
              colLimit: WD[relDay] || '',
              typeName,
            }));
          }
        });
      });
    });
    const sortEntries = arr => arr.sort((a,b)=>{
      const ar = Number.isFinite(a?.absRow) ? a.absRow : Number.POSITIVE_INFINITY;
      const br = Number.isFinite(b?.absRow) ? b.absRow : Number.POSITIVE_INFINITY;
      const ac = Number.isFinite(a?.absCol) ? a.absCol : Number.POSITIVE_INFINITY;
      const bc = Number.isFinite(b?.absCol) ? b.absCol : Number.POSITIVE_INFINITY;
      if (ar !== br) return ar - br;
      if (ac !== bc) return ac - bc;
      return String(a?.id || '').localeCompare(String(b?.id || ''), 'zh');
    });
    Object.values(out).forEach(sortEntries);
    return out;
  },[currentTemplate]);
  function getTplEntries(relDay, personName, typeName) {
    return tplEntryIndex[`${relDay}|${personName}|${typeName}`] || [];
  }
  function dayHours(dateStr, pid) {
    const dr = records?.[dateStr]?.[pid] || {};
    return types.reduce((s,t)=>s+countCell(dr[t.id])*t.hours, 0);
  }
  function weekHours(pid) {
    return wDates.reduce((s,d)=>s+dayHours(fmt(d),pid), 0);
  }
  function totalHoursEver(pid) {
    return Object.keys(records).reduce((s,d)=>s+dayHours(d,pid), 0);
  }
  function sidebarHours(pid) {
    if (view==='day') return dayHours(curStr, pid);
    return weekHours(pid);
  }

  function showToast(msg, type = 'info', duration = 2200) {
    const id = `${Date.now()}_${Math.random().toString(36).slice(2)}`;
    if (toastTimerRef.current) clearTimeout(toastTimerRef.current);
    setToast({ id, msg, type });
    toastTimerRef.current = setTimeout(()=>{
      setToast(prev=>prev?.id===id ? null : prev);
    }, duration);
  }

  function makeEntryByTypeId(tid, base = {}) {
    const typeName = types.find(t=>t.id===tid)?.name || base.typeName || null;
    return normalizeEntry({
      ...base,
      typeName,
      createdAt: Date.now(),
    }, { typeName, source: base.source || 'day' });
  }

  function update(dateStr, pid, tid, delta, source = 'day') {
    setRecords(prev => {
      const r = JSON.parse(JSON.stringify(prev));
      r[dateStr] = r[dateStr] || {};
      r[dateStr][pid] = r[dateStr][pid] || {};
      const curArr = normalizeCellEntries(r[dateStr][pid][tid], { source: 'legacy' });
      if (delta > 0) {
        for (let i=0; i<delta; i++) curArr.push(makeEntryByTypeId(tid, { source }));
      } else if (delta < 0) {
        for (let i=0; i<Math.abs(delta) && curArr.length; i++) curArr.pop();
      }
      if (!curArr.length) {
        delete r[dateStr][pid][tid];
        if (!Object.keys(r[dateStr][pid]).length) delete r[dateStr][pid];
        if (!Object.keys(r[dateStr]).length) delete r[dateStr];
      } else {
        r[dateStr][pid][tid] = curArr;
      }
      return r;
    });
  }

  function removeEntryById(dateStr, pid, tid, entryId, source = 'day') {
    if (!entryId) return;
    setRecords(prev => {
      const r = JSON.parse(JSON.stringify(prev));
      const arr = normalizeCellEntries(r?.[dateStr]?.[pid]?.[tid], { source: 'legacy' });
      const idx = arr.findIndex(e=>e.id===entryId);
      if (idx < 0) return prev;
      arr.splice(idx, 1);
      if (!r[dateStr]) r[dateStr] = {};
      if (!r[dateStr][pid]) r[dateStr][pid] = {};
      if (!arr.length) {
        delete r[dateStr][pid][tid];
        if (!Object.keys(r[dateStr][pid]).length) delete r[dateStr][pid];
        if (!Object.keys(r[dateStr]).length) delete r[dateStr];
      } else {
        r[dateStr][pid][tid] = arr;
      }
      return r;
    });
  }

  function moveEntryToPerson(dateStr, fromPid, toPid, tid, entryId, source = 'day') {
    if (!entryId || !toPid || fromPid === toPid) return;
    setRecords(prev => {
      const r = JSON.parse(JSON.stringify(prev));
      const fromArr = normalizeCellEntries(r?.[dateStr]?.[fromPid]?.[tid], { source: 'legacy' });
      const idx = fromArr.findIndex(e=>e.id===entryId);
      if (idx < 0) return prev;
      const [entry] = fromArr.splice(idx, 1);

      r[dateStr] = r[dateStr] || {};
      r[dateStr][toPid] = r[dateStr][toPid] || {};
      const toArr = normalizeCellEntries(r[dateStr][toPid][tid], { source: 'legacy' });
      toArr.push(normalizeEntry(entry, { source }));
      r[dateStr][toPid][tid] = toArr;

      if (fromArr.length) {
        r[dateStr][fromPid][tid] = fromArr;
      } else if (r[dateStr][fromPid]) {
        delete r[dateStr][fromPid][tid];
        if (!Object.keys(r[dateStr][fromPid]).length) delete r[dateStr][fromPid];
      }
      if (!Object.keys(r[dateStr]).length) delete r[dateStr];
      return r;
    });
  }

  function navigate(delta) {
    setCurDate(d => addDays(d, view==='week' ? delta*7 : delta));
  }

  function switchWeekMode(nextMode) {
    setWeekMode(nextMode);
  }

  function canScrollY(el, deltaY) {
    if (!el) return false;
    const maxTop = el.scrollHeight - el.clientHeight;
    if (maxTop <= 0) return false;
    if (deltaY > 0) return el.scrollTop < maxTop - 1;
    if (deltaY < 0) return el.scrollTop > 1;
    return false;
  }

  function handleMainWheel(e) {
    const outer = mainRef.current;
    if (!outer) return;
    const dy = e.deltaY;
    if (Math.abs(dy) < 0.5 || Math.abs(dy) < Math.abs(e.deltaX || 0)) return;
    if (canScrollY(outer, dy)) return;

    const selectors = ['.raw-grid-wrap', '.grid-wrap', '.sched-table-wrap'];
    const outerRect = outer.getBoundingClientRect();
    const candidates = Array.from(outer.querySelectorAll(selectors.join(',')))
      .filter(el=>{
        if (!canScrollY(el, dy)) return false;
        const rect = el.getBoundingClientRect();
        return rect.bottom > outerRect.top + 8 && rect.top < outerRect.bottom - 8;
      });
    if (!candidates.length) return;

    let target = candidates[0];
    let minDist = Number.POSITIVE_INFINITY;
    candidates.forEach(el=>{
      const rect = el.getBoundingClientRect();
      const center = rect.top + rect.height / 2;
      const dist = Math.abs(center - e.clientY);
      if (dist < minDist) {
        minDist = dist;
        target = el;
      }
    });
    target.scrollTop += dy;
    e.preventDefault();
  }

  /* ── Date label ── */
  const dateLabel = useMemo(() => {
    if (view==='day') {
      return `${curDate.getFullYear()}年${curDate.getMonth()+1}月${curDate.getDate()}日 ${WD_FULL[curDate.getDay()]}`;
    }
    const sun = wDates[6];
    return `${monday.getMonth()+1}月${monday.getDate()}日 — ${sun.getMonth()+1}月${sun.getDate()}日`;
  }, [curDate, view, monday, wDates]);

  const isCurrentToday = view==='day' && curStr===todayStr;
  const isCurrentWeekHasToday = view==='week' && wDates.some(d=>fmt(d)===todayStr);
  const stats = {
    totalRecordDays: Object.keys(records).length,
    totalEntries: Object.values(records).reduce((sum, day) =>
      sum + Object.values(day).reduce((ss, person) =>
        ss + Object.values(person).reduce((n,v)=>n+countCell(v),0), 0), 0),
    aliasRuleCount: Object.keys(scheduleRules.personAliases).length,
    parserRuleCount: scheduleRules.typeRules.length + scheduleRules.weekdayRules.length + scheduleRules.ignoreRules.length,
  };

  function buildWeekRecordPools(weekDatesArr) {
    const exact = {};
    const coord = {};
    const pidToName = Object.fromEntries(personnel.map(p=>[p.id, p.name]));
    const typeById = Object.fromEntries(types.map(t=>[t.id, t]));
    const pushPool = (bucket, key, item) => {
      bucket[key] = bucket[key] || [];
      bucket[key].push(item);
    };
    weekDatesArr.forEach((d, relDay)=>{
      const dateStr = fmt(d);
      const dayRec = records?.[dateStr] || {};
      Object.entries(dayRec).forEach(([pid, personRec])=>{
        const personName = pidToName[pid];
        if (!personName) return;
        Object.entries(personRec || {}).forEach(([tid, cell])=>{
          const typeName = typeById[tid]?.name;
          if (!typeName) return;
          const entries = normalizeCellEntries(cell, {
            source:'legacy',
            typeName,
            rowLimit:typeName,
            colLimit:WD[relDay] || '',
          });
          entries.forEach((entry, idx)=>{
            const xKey = entry.absSlotKey ? `${relDay}|${typeName}|${entry.absSlotKey}` : '';
            const cKey = Number.isFinite(entry.absRow) && Number.isFinite(entry.absCol)
              ? `${relDay}|${typeName}|${entry.absRow},${entry.absCol}`
              : '';
            const itemId = `${dateStr}|${pid}|${tid}|${entry.id || idx}`;
            const item = {
              itemId,
              exactKey: xKey,
              coordKey: cKey,
              personName,
              pid,
              tid,
              entryId: entry.id,
              absSlotKey: entry.absSlotKey || null,
              absRow: Number.isFinite(entry.absRow) ? entry.absRow : null,
              absCol: Number.isFinite(entry.absCol) ? entry.absCol : null,
            };
            if (xKey) pushPool(exact, xKey, item);
            if (cKey) pushPool(coord, cKey, item);
          });
        });
      });
    });
    const sortItems = arr => arr.sort((a,b)=>{
      const ar = Number.isFinite(a.absRow) ? a.absRow : Number.POSITIVE_INFINITY;
      const br = Number.isFinite(b.absRow) ? b.absRow : Number.POSITIVE_INFINITY;
      const ac = Number.isFinite(a.absCol) ? a.absCol : Number.POSITIVE_INFINITY;
      const bc = Number.isFinite(b.absCol) ? b.absCol : Number.POSITIVE_INFINITY;
      if (ar !== br) return ar - br;
      if (ac !== bc) return ac - bc;
      return a.personName.localeCompare(b.personName, 'zh');
    });
    Object.values(exact).forEach(sortItems);
    Object.values(coord).forEach(sortItems);
    return { exact, coord };
  }

  function assignTemplateSlots(templateObj, weekDatesArr) {
    const previewMeta = templateObj?.preview;
    if (!previewMeta?.cellSlotMap) return null;
    const previewSlotEntries = Object.entries(previewMeta.cellSlotMap)
      .map(([key, slot])=>({ key, ...slot }))
      .sort((a,b)=>{
        const [ar,ac]=a.key.split(',').map(Number);
        const [br,bc]=b.key.split(',').map(Number);
        return ar-br || ac-bc;
      });
    const pools = buildWeekRecordPools(weekDatesArr || []);
    // Fallback baseline queue only for legacy templates without per-slot personName.
    const fallbackPools = {};
    Object.entries(templateObj?.data || {}).forEach(([wd, dayMap])=>{
      fallbackPools[wd] = fallbackPools[wd] || {};
      Object.entries(dayMap || {}).forEach(([personName, typeMap])=>{
        Object.entries(typeMap || {}).forEach(([typeName, cnt])=>{
          fallbackPools[wd][typeName] = fallbackPools[wd][typeName] || [];
          for (let i=0; i<(cnt||0); i++) fallbackPools[wd][typeName].push(personName);
        });
      });
      Object.values(fallbackPools[wd]).forEach(arr=>arr.sort((a,b)=>a.localeCompare(b,'zh')));
    });
    const removePoolItem = (bucket, key, itemId) => {
      const queue = bucket[key];
      if (!queue?.length) return;
      const idx = queue.findIndex(it=>it.itemId===itemId);
      if (idx >= 0) queue.splice(idx, 1);
    };
    const byKey = {};
    for (const slot of previewSlotEntries) {
      const baselineFromSlot = slot.personName || null;
      const fallbackQueue = fallbackPools[slot.weekday]?.[slot.typeName] || [];
      const baselinePerson = baselineFromSlot || (fallbackQueue.length ? fallbackQueue.shift() : null);
      const slotAbsKey = slot.slotKey || slot.key || '';
      const exactKey = slotAbsKey ? `${slot.weekday}|${slot.typeName}|${slotAbsKey}` : '';
      const coordKey = Number.isFinite(slot.row) && Number.isFinite(slot.col)
        ? `${slot.weekday}|${slot.typeName}|${slot.row},${slot.col}`
        : '';
      const exactQueue = exactKey ? (pools.exact[exactKey] || []) : [];
      let picked = exactQueue.length ? exactQueue.shift() : null;
      if (picked) removePoolItem(pools.coord, picked.coordKey, picked.itemId);
      if (!picked) {
        const coordQueue = coordKey ? (pools.coord[coordKey] || []) : [];
        picked = coordQueue.length ? coordQueue.shift() : null;
      }
      const currentPerson = picked?.personName || null;
      const state = currentPerson
        ? (currentPerson === baselinePerson ? 'original' : 'changed')
        : (baselinePerson ? 'removed' : 'empty');
      byKey[slot.key] = { ...slot, baselinePerson, currentPerson, currentRef:picked, state };
    }
    return { byKey, slots: previewSlotEntries };
  }

  function buildRevisionSnapshot(templateObj, weekDatesArr) {
    return assignTemplateSlots(templateObj, weekDatesArr);
  }

  function buildRawLikeWorksheet(templateObj, slotByKey = null) {
    const preview = templateObj?.preview;
    if (!preview?.rawGrid) return null;
    const aoa = preview.rawGrid.map((row, r)=>row.map((cell, c)=>{
      if (slotByKey) {
        const key = `${r},${c}`;
        const slotEntry = slotByKey[key];
        // Only substitute cells that are actual person slots
        if (slotEntry !== undefined) return slotEntry.currentPerson || '';
      }
      return cell?.val || '';
    }));
    const ws = XLSX.utils.aoa_to_sheet(aoa);
    ws['!merges'] = (preview.rawMerges || []).map(m=>({
      s:{r:m.s.r,c:m.s.c},
      e:{r:m.e.r,c:m.e.c},
    }));
    const maxCols = Math.max(...aoa.map(row=>row.length), 0);
    ws['!cols'] = Array.from({length:maxCols}, (_, idx)=>{
      let longest = 8;
      aoa.forEach(row=>{ longest = Math.max(longest, String(row[idx] || '').length); });
      return { wch: Math.max(8, Math.min(18, longest + 2)) };
    });
    return ws;
  }

  /* ── Export Excel ── */
  function exportExcel(mode, rangeStart, rangeEnd, bonusHours = {}) {
    let allDates = Object.keys(records).sort();
    if (!allDates.length) { alert('暂无记录可导出'); return; }
    if (rangeStart) allDates = allDates.filter(d=>d>=rangeStart);
    if (rangeEnd)   allDates = allDates.filter(d=>d<=rangeEnd);
    if (!allDates.length) { alert('所选时间段内无记录'); return; }
    const wb = XLSX.utils.book_new();

    /* Sheet: 小时统计(按日) */
    if (mode==='day'||mode==='both') {
      const hdr = ['姓名', ...allDates.map(d=>d.slice(5)), '奖励工时(h)', '合计(h)'];
      const body = personnel.map(p => {
        let tot=0;
        const bonus = parseFloat(bonusHours[p.id]) || 0;
        const row = [p.name, ...allDates.map(d=>{ const h=dayHours(d,p.id); tot+=h; return h||0; }), bonus||0, tot + bonus];
        return row;
      });
      const bonusTotal = personnel.reduce((s,p)=>s+(parseFloat(bonusHours[p.id])||0),0);
      const foot = ['合计', ...allDates.map(d=>personnel.reduce((s,p)=>s+dayHours(d,p.id),0)),
                    bonusTotal,
                    personnel.reduce((s,p)=>s+allDates.reduce((h,d)=>h+dayHours(d,p.id),0),0) + bonusTotal];
      const ws = XLSX.utils.aoa_to_sheet([hdr,...body,foot]);
      _styleSheet(ws, allDates.length+2);
      XLSX.utils.book_append_sheet(wb, ws, '小时统计(按日)');
    }

    /* Sheet: 小时统计(按周) */
    if (mode==='week'||mode==='both') {
      const weekMap = {};
      for (const d of allDates) {
        const mon = getMonday(new Date(d));
        const key = fmt(mon);
        const sun = addDays(mon,6);
        if (!weekMap[key]) weekMap[key]={label:`${fmtMid(mon)}~${fmtMid(sun)}`,dates:[]};
        weekMap[key].dates.push(d);
      }
      const wks = Object.keys(weekMap).sort();
      const hdr = ['姓名', ...wks.map(k=>weekMap[k].label), '奖励工时(h)', '合计(h)'];
      const body = personnel.map(p => {
        let tot=0;
        const bonus = parseFloat(bonusHours[p.id]) || 0;
        const row = [p.name, ...wks.map(k=>{ const h=weekMap[k].dates.reduce((s,d)=>s+dayHours(d,p.id),0); tot+=h; return h||0; }), bonus||0, tot + bonus];
        return row;
      });
      const bonusTotal = personnel.reduce((s,p)=>s+(parseFloat(bonusHours[p.id])||0),0);
      const foot = ['合计', ...wks.map(k=>personnel.reduce((s,p)=>s+weekMap[k].dates.reduce((ss,d)=>ss+dayHours(d,p.id),0),0)),
                    bonusTotal,
                    body.reduce((s,row)=>s+(parseFloat(row[row.length-1])||0),0)];
      const ws = XLSX.utils.aoa_to_sheet([hdr,...body,foot]);
      XLSX.utils.book_append_sheet(wb, ws, '小时统计(按周)');
    }

    /* Sheet: 工时明细 (importable raw data) */
    {
      const hdr = ['姓名','日期', ...types.map(t=>`${t.name}(次)`), ...types.map(t=>`${t.name}(h)`), '总计(h)'];
      const rows = [];
      for (const d of allDates) {
        for (const p of personnel) {
          const dr = records?.[d]?.[p.id];
          if (!dr) continue;
          const dayCounts = types.map(t=>countCell(dr[t.id]));
          const row = [p.name, d,
            ...dayCounts,
            ...types.map((t, idx)=>dayCounts[idx]*t.hours),
            dayHours(d,p.id)];
          rows.push(row);
        }
      }
      if (rows.length) {
        const ws = XLSX.utils.aoa_to_sheet([hdr,...rows]);
        XLSX.utils.book_append_sheet(wb, ws, '工时明细');
      }
    }

    /* Sheet(s): 修订视图格式 */
    if (mode==='revise') {
      const weekMap = {};
      for (const d of allDates) {
        const mon = getMonday(new Date(d));
        const key = fmt(mon);
        const sun = addDays(mon,6);
        if (!weekMap[key]) weekMap[key]={label:`${fmtMid(mon)}~${fmtMid(sun)}`, dates:weekDates(mon)};
      }
      const weekKeys = Object.keys(weekMap).sort();
      if (!weekKeys.length) {
        alert('所选时间段内没有可导出的周记录');
        return;
      }
      const validWeeks = [];
      weekKeys.forEach((key, idx)=>{
        const tplId = weekTemplateMap?.[key];
        const tpl = templateLibrary.find(t=>t.id===tplId);
        if (!tpl?.preview?.rawGrid || !tpl?.preview?.cellSlotMap) return;
        const snapshot = buildRevisionSnapshot(tpl, weekMap[key].dates);
        const ws = buildRawLikeWorksheet(tpl, snapshot?.byKey || {});
        if (!ws) return;
        validWeeks.push(key);
        const label = weekMap[key].label.replace(/[~]/g, '-');
        XLSX.utils.book_append_sheet(wb, ws, `修订_${idx+1}_${label}`);
      });
      if (!validWeeks.length) {
        alert('所选时间段对应周未指派可用模板（或模板不含原始视图），无法导出修订视图格式');
        return;
      }
    }

    XLSX.writeFile(wb, `工时统计_${fmt(new Date())}.xlsx`);
  }

  function _styleSheet(ws, colCount) {
    // Set column widths
    ws['!cols'] = [{ wch:10 }, ...Array(colCount).fill({ wch:8 })];
  }

  function normalizeTemplateObject(input, fallbackName = '工时模板') {
    if (!input || typeof input !== 'object') return null;
    const id = input.id || `tpl_${Date.now()}_${Math.floor(Math.random()*100000)}`;
    const name = String(input.name || fallbackName).trim() || fallbackName;
    const data = input.data && typeof input.data === 'object' ? input.data : {};
    const preview = input.preview && typeof input.preview === 'object' ? input.preview : null;
    return { ...input, id, name, data, preview, updatedAt: Date.now() };
  }

  function saveTemplateToLibrary(inputTemplate, opts = {}) {
    const tpl = normalizeTemplateObject(inputTemplate);
    if (!tpl) return null;
    const selectAfterSave = opts.selectAfterSave !== false;
    setTemplateLibrary(prev=>{
      const idx = prev.findIndex(t=>t.id===tpl.id);
      if (idx >= 0) {
        const merged = { ...prev[idx], ...tpl, id: prev[idx].id, createdAt: prev[idx].createdAt || Date.now() };
        const next = [...prev];
        next[idx] = merged;
        return next;
      }
      return [...prev, { ...tpl, createdAt: Date.now() }];
    });
    if (selectAfterSave) setSelectedTemplateId(tpl.id);
    return tpl;
  }

  function assignTemplateToWeek(templateId, weekStart = currentWeekStart) {
    if (!templateId) return;
    setWeekTemplateMap(prev=>({ ...prev, [weekStart]: templateId }));
  }

  function unassignTemplateFromWeek(weekStart = currentWeekStart) {
    setWeekTemplateMap(prev=>{
      const next = { ...prev };
      delete next[weekStart];
      return next;
    });
  }

  function deleteTemplate(templateId) {
    if (!templateId) return;
    setTemplateLibrary(prev=>prev.filter(t=>t.id!==templateId));
    setWeekTemplateMap(prev=>{
      const next = {};
      Object.entries(prev || {}).forEach(([k,v])=>{ if (v !== templateId) next[k]=v; });
      return next;
    });
    if (selectedTemplateId === templateId) setSelectedTemplateId('');
  }

  /* ── Import Records ── */
  function handleImportRecords(e) {
    const file = e.target.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const wb = XLSX.read(ev.target.result, {type:'binary'});
        const shName = wb.SheetNames.find(n=>n.includes('明细')) || wb.SheetNames[0];
        const ws = wb.Sheets[shName];
        const rows = XLSX.utils.sheet_to_json(ws, {header:1,defval:0});
        if (rows.length < 2) { alert('表格格式不正确，请导入"工时明细"表'); return; }
        const hdr = rows[0];
        // Find type columns (after 姓名, 日期)
        const typeNames = types.map(t=>t.name);
        const typeColIdxs = typeNames.map(n => hdr.findIndex(h=>String(h).startsWith(n)&&String(h).endsWith('次)')));
        const newRec = JSON.parse(JSON.stringify(records));
        let count = 0;
        for (let i=1;i<rows.length;i++) {
          const row = rows[i];
          const name = String(row[0]||'').trim();
          const date = String(row[1]||'').trim();
          if (!name||!date||!/^\d{4}-\d{2}-\d{2}$/.test(date)) continue;
          const person = personnel.find(p=>p.name===name);
          if (!person) continue;
          types.forEach((t,j) => {
            const idx = typeColIdxs[j];
            if (idx<0) return;
            const cnt = parseInt(row[idx])||0;
            if (cnt>0) {
              newRec[date]=newRec[date]||{};
              newRec[date][person.id]=newRec[date][person.id]||{};
              const arr = [];
              for (let k=0; k<cnt; k++) arr.push(makeEntryByTypeId(t.id, { source:'import', rowLimit:t.name, colLimit:WD[new Date(date).getDay()===0?6:new Date(date).getDay()-1] }));
              newRec[date][person.id][t.id]=arr;
              count++;
            }
          });
        }
        setRecords(newRec);
        alert(`✅ 导入完成，共导入 ${count} 条记录`);
      } catch(err) { alert('导入失败：'+err.message); }
    };
    reader.readAsBinaryString(file);
    e.target.value='';
  }

  /* ── Template operations ── */
  function replaceCurrentWeekTemplate() {
    if (!selectedTemplate) return;
    assignTemplateToWeek(selectedTemplate.id, currentWeekStart);
    setShowDiff(true);
    showToast(`已将 ${currentWeekStart} 指派为模板「${selectedTemplate.name}」，并自动开启差异显示。`, 'success');
  }

  function applyTemplateData() {
    if (!selectedTemplate) return;
    const apply = () => {
      assignTemplateToWeek(selectedTemplate.id, currentWeekStart);
      setRecords(prev => {
        const r = JSON.parse(JSON.stringify(prev));
        const slotEntriesByRelDay = {};
        const slotMap = selectedTemplate?.preview?.cellSlotMap || {};
        Object.entries(slotMap)
          .sort((a,b)=>{
            const [ak,av] = a;
            const [bk,bv] = b;
            const ar = Number.isFinite(av?.row) ? av.row : parseInt(String(ak).split(',')[0],10);
            const ac = Number.isFinite(av?.col) ? av.col : parseInt(String(ak).split(',')[1],10);
            const br = Number.isFinite(bv?.row) ? bv.row : parseInt(String(bk).split(',')[0],10);
            const bc = Number.isFinite(bv?.col) ? bv.col : parseInt(String(bk).split(',')[1],10);
            return ar-br || ac-bc;
          })
          .forEach(([slotKey, slot])=>{
          if (!slot?.personName || !slot?.typeName) return;
          const relDay = Number(slot.weekday);
          if (!Number.isFinite(relDay)) return;
          slotEntriesByRelDay[relDay] = slotEntriesByRelDay[relDay] || {};
          slotEntriesByRelDay[relDay][slot.personName] = slotEntriesByRelDay[relDay][slot.personName] || {};
          const typeBucket = slotEntriesByRelDay[relDay][slot.personName];
          typeBucket[slot.typeName] = typeBucket[slot.typeName] || [];
          typeBucket[slot.typeName].push(normalizeEntry({
            source: 'template',
            absSlotKey: slot.slotKey || slotKey,
            absRow: Number.isFinite(slot.row) ? slot.row : null,
            absCol: Number.isFinite(slot.col) ? slot.col : null,
            rowLimit: slot.rowLimit || slot.typeName,
            colLimit: slot.colLimit || WD[relDay] || '',
            typeName: slot.typeName,
          }));
          });
        const applyDay = (dateStr, relDay) => {
          const dayData = selectedTemplate.data[relDay];
          delete r[dateStr];
          if (!dayData) return;
          const nextDay = {};
          for (const p of personnel) {
            const pData = dayData[p.name];
            if (!pData) continue;
            const nextPerson = {};
            for (const t of types) {
              const cnt = pData[t.name] || 0;
              if (!(cnt > 0)) continue;
              const slotList = slotEntriesByRelDay?.[relDay]?.[p.name]?.[t.name] || [];
              const entries = slotList.slice(0, cnt).map(entry=>normalizeEntry(entry, { source:'template', typeName:t.name }));
              while (entries.length < cnt) {
                entries.push(normalizeEntry({
                  source:'template',
                  rowLimit:t.name,
                  colLimit:WD[relDay] || '',
                  typeName:t.name,
                }));
              }
              nextPerson[t.id] = entries;
            }
            if (Object.keys(nextPerson).length) nextDay[p.id] = nextPerson;
          }
          if (Object.keys(nextDay).length) r[dateStr] = nextDay;
        };
        if (view==='week') {
          wDates.forEach((d,i) => applyDay(fmt(d), i));
        } else {
          const dow = curDate.getDay();
          const relDay = dow===0?6:dow-1;
          applyDay(curStr, relDay);
        }
        return r;
      });
      setWeekDayLocks(prev=>{
        const next = { ...(prev || {}) };
        delete next[currentWeekStart];
        return next;
      });
      setModal(null);
      showToast(`已写入模板「${selectedTemplate.name}」到${view==='week'?'当前周':'当天'}记录。`, 'success');
    };
    apply();
  }

  /* ── Visibility helpers ── */
  function toggleHidden(id) {
    setHiddenIds(prev => {
      const n = new Set(prev);
      n.has(id) ? n.delete(id) : n.add(id);
      return n;
    });
  }
  function hideUnworked() {
    setHiddenIds(prev => {
      const n = new Set(prev);
      for (const p of personnel) {
        const h = view==='day' ? dayHours(curStr, p.id) : weekHours(p.id);
        if (h === 0) n.add(p.id);
      }
      return n;
    });
  }
  function showAll() { setHiddenIds(new Set()); setAutoHide(false); }

  /* ── Remove person ── */
  function removePerson(id) {
    setPersonnel(prev=>prev.filter(p=>p.id!==id));
  }

  /* ── Clear records only ── */
  function clearAll() {
    setModal('clear-records');
  }

  function clearRecordsByRange(rangeType, startDate, endDate) {
    const allDates = Object.keys(records).sort();
    if (!allDates.length) {
      alert('暂无记录可清空');
      setModal(null);
      return;
    }
    let targetDates = allDates;
    if (rangeType === 'custom') {
      if (!startDate || !endDate || startDate > endDate) {
        alert('请先选择有效的起止日期');
        return;
      }
      targetDates = allDates.filter(d=>d>=startDate && d<=endDate);
    }
    if (!targetDates.length) {
      alert('所选时间范围内没有可清空记录');
      return;
    }
    const targetSet = new Set(targetDates);
    const remainDates = allDates.filter(d=>!targetSet.has(d));
    const remainWeekKeys = new Set(remainDates.map(d=>fmt(getMonday(new Date(d)))));
    setRecords(prev=>{
      const next = { ...prev };
      targetDates.forEach(d=>{ delete next[d]; });
      return next;
    });
    setWeekDayLocks(prev=>{
      const next = {};
      Object.entries(prev || {}).forEach(([weekKey, locked])=>{
        if (remainWeekKeys.has(weekKey)) next[weekKey] = locked;
      });
      return next;
    });
    setModal(null);
    alert(`已清空 ${targetDates.length} 天记录`);
  }

  /* ── Clear ALL data ── */
  function clearAllData() {
    setConfirmCb(()=>()=>{
      setRecords({}); setPersonnel([]); setTypes(DEF_TYPES);
      setHiddenIds(new Set());
      setTemplateLibrary([]);
      setSelectedTemplateId('');
      setWeekTemplateMap({});
      setWeekDayLocks({});
      localStorage.removeItem('wh_hidden');
      setModal(null);
    });
    setModal('confirm-all');
  }

  /* ══ RENDER ══ */

        <input ref={importRecRef} type="file" accept=".xlsx,.xls" style={{display:'none'}} onChange={handleImportRecords}/>
        <button className="btn btn-sm" onClick={()=>importRecRef.current.click()}>📂 导入记录</button>
        <button className="btn btn-sm" style={{color:'var(--green)',borderColor:'var(--green)'}} onClick={()=>setModal('schedule')}>📅 排班转模板</button>
        {currentTemplate && (
          <button
            className={`btn btn-sm header-diff-btn${showDiff?' diff-active-btn':''}`}
            onClick={()=>setShowDiff(v=>!v)}
            title={showDiff?'关闭差异对比':'与当前周模板对比差异'}
          >
            ⚡ {showDiff?'关闭差异':'显示差异'}
          </button>
        )}
        <button className="btn btn-sm btn-primary" onClick={()=>setModal('export')}>📊 导出</button>
        <button className="theme-btn" onClick={()=>setTheme(t=>t==='dark'?'light':'dark')} title="切换主题">
          {theme==='dark'?'☀️':'🌙'}
        </button>
      </div>

      <div className="app-body">

        {/* ── Sidebar ── */}
        <div className="sidebar">
          <div className="sidebar-head">
            <div className="search-wrap">
              <input placeholder="搜索姓名 / 拼音首字母…" value={search} onChange={e=>setSearch(e.target.value)}/>
              {search && (
                <span onClick={()=>setSearch('')} style={{
                  position:'absolute',right:'7px',cursor:'pointer',fontSize:'13px',
                  color:'var(--muted)',lineHeight:1,userSelect:'none',padding:'2px'
                }} title="清空搜索">✕</span>
              )}
            </div>
          </div>

          {/* Visibility toolbar */}
          <div className="sidebar-toolbar">
            {/* Auto-hide toggle */}
            <label style={{display:'flex',alignItems:'center',gap:'4px',cursor:'pointer',
              fontSize:'10px',padding:'2px 4px',borderRadius:'var(--radius)',
              border:'1px solid var(--border)',background: autoHide?'var(--yellow)22':'var(--surface2)',
              color: autoHide?'var(--yellow)':'var(--muted)',transition:'all .15s',flex:1,
              userSelect:'none'}}
              title="开启后切换日期/周时自动隐藏零工时人员">
              <input type="checkbox" checked={autoHide} onChange={e=>setAutoHide(e.target.checked)}
                style={{accentColor:'var(--yellow)',width:'12px',height:'12px',flexShrink:0}}/>
              自动隐零工时
            </label>
            <button className="btn btn-sm" title="立即隐藏零工时人员"
              onClick={hideUnworked} style={{color:'var(--yellow)',borderColor:'var(--yellow)'}}>
              隐零工时
            </button>
            <button className="btn btn-sm" onClick={showAll}
              style={{color:'var(--green)',borderColor:'var(--green)'}}>
              全显
              {!autoHide && hiddenIds.size>0 && <span className="hide-count">{hiddenIds.size}</span>}
            </button>
          </div>
          <div className="sidebar-toolbar" style={{gap:'4px'}}>
            <button className="btn btn-sm" onClick={()=>{
                const allHidden = filtered.every(p=>hiddenIds.has(p.id));
                setHiddenIds(prev=>{
                  const n=new Set(prev);
                  filtered.forEach(p=>allHidden?n.delete(p.id):n.add(p.id));
                  return n;
                });
              }} style={{flex:1}} title="切换当前列表全选/全不选">
              {filtered.every(p=>hiddenIds.has(p.id))?'✓ 全选显示':'— 全部隐藏'}
            </button>
          </div>

          <div className="person-list">
            {filtered.length===0 && (
              <div style={{padding:'16px 10px',fontSize:'12px',color:'var(--muted)',textAlign:'center'}}>
                {search?'无匹配人员':'暂无人员'}
              </div>
            )}
            {filtered.map(p => {
              const h = sidebarHours(p.id);
              const isHidden = hiddenIds.has(p.id);
              return (
                <div key={p.id} className={`person-item${isHidden?' hidden-row':''}`}>
                  <input type="checkbox" className="pcheck"
                    checked={!isHidden} onChange={()=>toggleHidden(p.id)}
                    title={isHidden?'点击显示（从表格中隐藏）':'点击隐藏（从表格中移除）'}/>
                  <span className="pname" style={{cursor:'pointer'}} onClick={()=>toggleHidden(p.id)}>{p.name}</span>
                  <span className="phours">{h>0?`${h.toFixed(1)}h`:'-'}</span>
                  <span className="pdel" onClick={()=>removePerson(p.id)}>✕</span>
                </div>
              );
            })}
            {search && hiddenIds.size>0 && (
              <div style={{padding:'6px 10px',fontSize:'10px',color:'var(--muted)',borderTop:'1px solid var(--border)',marginTop:'4px'}}>
                搜索模式下表格显示全部匹配结果（忽略隐藏状态）
              </div>
            )}
          </div>
          <div className="sidebar-foot">
            <div>共 {personnel.length} 人
              {search ? ` · 搜索 ${filtered.length} 人` : ''}
              {!search && hiddenIds.size>0 && !autoHide ? ` · 显示 ${filtered.length-[...hiddenIds].filter(id=>filtered.some(p=>p.id===id)).length}` : ''}
            </div>
            <div>类型 {types.length} 种 · 记录 {Object.keys(records).length} 天</div>
            {/* Template status */}
            {currentTemplate ? (
              <div style={{display:'flex',alignItems:'center',gap:'4px',marginTop:'4px',
                padding:'4px 6px',background:'var(--yellow)15',borderRadius:'var(--radius)',
                border:'1px solid var(--yellow)33',fontSize:'11px'}}>
                <span style={{flex:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',
                  color:'var(--yellow)'}} title={currentTemplate.name}>📋 {currentTemplate.name}</span>
                <button className="btn btn-sm" style={{fontSize:'10px',padding:'1px 5px'}}
                  onClick={()=>setModal('view-tpl')}>查看</button>
                <button className="btn btn-sm" style={{fontSize:'10px',padding:'1px 5px',
                  color:'var(--red)',borderColor:'var(--red)'}}
                  onClick={()=>unassignTemplateFromWeek()}>取消指派</button>
              </div>
            ) : (
              <div style={{fontSize:'11px',color:'var(--border)',marginTop:'2px'}}>当前周未指派模板</div>
            )}
            <div className="sidebar-foot-actions" style={{marginTop:'6px'}}>
              <button className="btn btn-sm" style={{flex:1,fontSize:'11px'}} onClick={()=>setModal('people')}>+ 人员</button>
              <button className="btn btn-sm btn-danger" style={{fontSize:'11px'}} onClick={clearAll}
                title="清空所有工时记录（保留人员和类型）">清空记录</button>
            </div>
          </div>
        </div>

        <div className="main" ref={mainRef} onWheel={handleMainWheel}>
          {/* Types summary bar */}
          <div className="info-bar">
            {view==='day' && (<>
              <span className="info-item">📅 <span className="info-val">{curStr}</span></span>
              <span className="info-item">上工人数: <span className="info-val">
                {tablePersonnel.filter(p=>dayHours(curStr,p.id)>0).length}/{tablePersonnel.length}
              </span></span>
              <span className="info-item">当日总工时: <span className="info-val" style={{color:'var(--yellow)'}}>
                {tablePersonnel.reduce((s,p)=>s+dayHours(curStr,p.id),0).toFixed(1)} h
              </span></span>
            </>)}
            {view==='week' && (<>
              <span className="info-item">🗓 周视图</span>
              <span className="info-item">
                模式:
                <span className="week-mode-toggle">
                  <button className={weekMode==='stats'?'active':''} onClick={()=>switchWeekMode('stats')}>统计</button>
                  <button className={weekMode==='revise'?'active':''} onClick={()=>switchWeekMode('revise')}>修订</button>
                </span>
              </span>
              <span className="info-item">总工时: <span className="info-val" style={{color:'var(--yellow)'}}>
                {tablePersonnel.reduce((s,p)=>s+weekHours(p.id),0).toFixed(1)} h
              </span></span>
              {isCurrentWeekDayLocked && <span className="flow-badge todo">本周周修订锁定</span>}
            </>)}
            <span style={{marginLeft:'auto',display:'flex',gap:'6px',flexWrap:'wrap',alignItems:'center'}}>
              {types.map(t=>(
                <span key={t.id} className="badge" style={{color:t.color,borderColor:t.color,background:t.color+'22'}}>
                  {t.name} {t.hours}h
                </span>
              ))}
            </span>
          </div>

          <WorkflowPanel
            personnelCount={personnel.length}
            typeCount={types.length}
            hasTemplate={!!currentTemplate}
            selectedTemplateReady={!!selectedTemplate}
            recordDays={stats.totalRecordDays}
            ruleCount={stats.aliasRuleCount + stats.parserRuleCount}
            view={view}
            weekMode={weekMode}
            weekDayLocked={isCurrentWeekDayLocked}
            collapsed={flowCollapsed}
            onToggleCollapsed={()=>setFlowCollapsed(v=>!v)}
            setView={setView}
            setWeekMode={switchWeekMode}
            openPeople={()=>setModal('people')}
            openTypes={()=>setModal('types')}
            openSchedule={()=>setModal('schedule')}
            openExport={()=>setModal('export')}
            applyTemplateData={selectedTemplate ? applyTemplateData : null}
            replaceTemplate={selectedTemplate ? replaceCurrentWeekTemplate : null}
          />

          {view==='day'
            ? <DayView personnel={diffPersonnel} types={types} dateStr={curStr}
                getCount={getCount} update={update} dayHours={dayHours}
                showDiff={showDiff} curDate={curDate}
                getTplEntries={getTplEntries}
                getEntries={getEntries} removeEntry={removeEntryById} moveEntry={moveEntryToPerson}
                allPersonnel={personnel}/>
            : <WeekView personnel={diffPersonnel} types={types} wDates={wDates}
                dayHours={dayHours} setCurDate={setCurDate} setView={setView}
                showDiff={showDiff} getTplCount={getTplCount} template={currentTemplate}
                records={records}
                setRecords={setRecords}
                weekMode={weekMode} setWeekMode={switchWeekMode}
                weekDayLocked={isCurrentWeekDayLocked}/>
          }
        </div>
      </div>

      {toast && (
        <div
          style={{
            position:'fixed',
            right:'18px',
            bottom:'18px',
            zIndex:3000,
            minWidth:'220px',
            maxWidth:'min(78vw, 520px)',
            padding:'10px 12px',
            borderRadius:'10px',
            border:`1px solid ${toast.type==='success' ? 'var(--green)' : 'var(--border)'}`,
            background:'var(--surface)',
            color:'var(--text)',
            boxShadow:'0 10px 26px rgba(0,0,0,.24)',
            fontSize:'12px',
            lineHeight:1.5
          }}
        >
          {toast.msg}
        </div>
      )}

      {/* ── Modals ── */}
      {modal==='types'      && <TypeModal   types={types}   setTypes={setTypes}   close={()=>setModal(null)}/>}
      {modal==='people'     && <PeopleModal personnel={personnel} setPersonnel={setPersonnel} close={()=>setModal(null)}/>}
      {modal==='export'     && <ExportModal onExport={exportExcel} allDates={Object.keys(records).sort()} close={()=>setModal(null)} personnel={personnel} dayHours={dayHours} weekTemplateMap={weekTemplateMap} templateLibrary={templateLibrary}/>}
      {modal==='clear-records' && <ClearRecordsModal allDates={Object.keys(records).sort()} onConfirm={clearRecordsByRange} close={()=>setModal(null)}/>}
      {modal==='confirm-all'&& <ConfirmModal msg="将清空全部数据：所有工时记录、人员名单（工时类型恢复默认）。此操作不可撤销！" onOk={confirmCb} close={()=>setModal(null)} okLabel="全部清空"/>}
      {modal==='schedule'   && <ScheduleImportModal personnel={personnel} types={types} initialRules={scheduleRules} onSaveRules={setScheduleRules} onSave={tpl=>{ const saved = saveTemplateToLibrary(tpl); setModal(null); showToast(`模板「${saved?.name || ''}」已保存到模板库。`, 'success'); }} close={()=>setModal(null)}/>}
      {modal==='view-tpl'   && <TemplateViewModal template={currentTemplate} onClear={()=>{unassignTemplateFromWeek();setModal(null);}} close={()=>setModal(null)}/>}
    </div>
  );
}

function WorkflowPanel({ personnelCount, typeCount, hasTemplate, selectedTemplateReady, recordDays, ruleCount, view, weekMode, weekDayLocked, collapsed, onToggleCollapsed, setView, setWeekMode, openPeople, openTypes, openSchedule, openExport, applyTemplateData, replaceTemplate }) {
  const cards = [
    {
      key:'people',
      step:'01',
      title:'整理人员',
      desc:'先导入或维护名单，避免排班解析时出现大量未匹配姓名。',
      meta:`当前 ${personnelCount} 人`,
      status: personnelCount ? 'done' : 'active',
      action:<button className="btn btn-sm" onClick={openPeople}>{personnelCount ? '维护人员' : '导入人员'}</button>,
    },
    {
      key:'types',
      step:'02',
      title:'校准工时类型',
      desc:'确认默认工时是否够用。特殊奖励工时或自定义班次建议先配置。',
      meta:`当前 ${typeCount} 种类型`,
      status: typeCount >= 3 ? 'done' : 'active',
      action:<button className="btn btn-sm" onClick={openTypes}>调整类型</button>,
    },
    {
      key:'schedule',
      step:'03',
      title:'转排班为模板',
      desc:'导入排班表、配置解析规则、修正识别结果，再保存为周模板。',
      meta:`已保存 ${ruleCount} 条规则`,
      status: hasTemplate ? 'done' : 'active',
      action:<button className="btn btn-sm btn-primary" onClick={openSchedule}>打开转模板</button>,
    },
    {
      key:'apply',
      step:'04',
      title:'套用并校对',
      desc:'先指派当前周模板（仅替换对比基线），再按需写入模板数据；最后进入周修订并回按天核对差异。',
      meta: hasTemplate ? `当前周已指派模板，模式：${weekMode==='revise'?'修订':'统计'}` : '当前周尚未指派模板',
      status: hasTemplate || selectedTemplateReady ? 'active' : 'todo',
      action:<div className="flow-actions">{replaceTemplate && <button className="btn btn-sm" onClick={replaceTemplate}>替换当前模板</button>}{applyTemplateData && <button className="btn btn-sm btn-primary" onClick={applyTemplateData}>写入模板数据</button>}<button className="btn btn-sm" disabled={weekDayLocked} onClick={()=>{ setView('week'); setWeekMode('revise'); }}>{weekDayLocked?'周修订已锁定':'进入周修订'}</button><button className="btn btn-sm" onClick={()=>setView(view==='day'?'week':'day')}>{view==='day'?'切到按周':'切到按天'}</button></div>,
    },
    {
      key:'export',
      step:'05',
      title:'导出结果',
      desc:'导出按日、按周和工时明细，便于归档、复盘和再次导入。',
      meta:`当前累计 ${recordDays} 天记录`,
      status: recordDays ? 'active' : 'todo',
      action:<button className="btn btn-sm" onClick={openExport} disabled={!recordDays}>导出 Excel</button>,
    },
  ];

  const badgeLabel = status => status==='done' ? '已就绪' : status==='active' ? '下一步' : '待处理';

  return (
    <div className="flow-panel">
      <div className="flow-head">
        <div>
          <div className="flow-title">操作流程面板</div>
          <div className="flow-sub">把“人员维护、工时配置、排班转模板、周修订、按天核对、导出”串成一条线。首次使用按顺序走，日常补录优先从按周修订进入，再回到按天核对。</div>
        </div>
        <div className="flow-head-actions">
          <div className="flow-actions">
            <span className={`flow-badge ${hasTemplate ? 'done' : 'todo'}`}>{hasTemplate ? '当前周已指派模板' : '当前周无模板'}</span>
            <span className={`flow-badge ${recordDays ? 'active' : 'todo'}`}>{recordDays ? `${recordDays} 天记录` : '暂无记录'}</span>
          </div>
          <button className={`flow-toggle ${collapsed?'collapsed':''}`} onClick={onToggleCollapsed}>
            <span className="arrow">⌄</span>
            <span>{collapsed ? '展开流程' : '收起流程'}</span>
          </button>
        </div>
      </div>
      {collapsed ? (
        <div className="flow-summary">
          <div className="flow-summary-card">
            <strong>{personnelCount}</strong>
            <span>在册人员</span>
          </div>
          <div className="flow-summary-card">
            <strong>{typeCount}</strong>
            <span>工时类型</span>
          </div>
          <div className="flow-summary-card">
            <strong>{ruleCount}</strong>
            <span>解析规则</span>
          </div>
          <div className="flow-summary-card">
            <strong>{recordDays}</strong>
            <span>记录天数</span>
          </div>
        </div>
      ) : (
        <div className="flow-grid">
          {cards.map(card=>(
            <div key={card.key} className={`flow-card ${card.status}`}>
              <div className="flow-step">
                <span>{card.step}</span>
                <span className={`flow-badge ${card.status}`}>{badgeLabel(card.status)}</span>
              </div>
              <h3>{card.title}</h3>
              <p>{card.desc}</p>
              <div className="meta">{card.meta}</div>
              <div className="flow-actions">{card.action}</div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

/* ═══ Day View ══════════════════════════════════════════════════════════════ */
function DayView({ personnel, types, dateStr, getCount, update, dayHours, showDiff, getTplEntries, curDate, getEntries, removeEntry, moveEntry, allPersonnel }) {
  if (!personnel.length) return (
    <div className="empty"><div className="icon">👥</div><p>暂无人员，点击左下角「+ 人员」或「导入人员」</p></div>
  );
  if (!types.length) return (
    <div className="empty"><div className="icon">⚙</div><p>暂无工时类型，请先在「工时类型」中添加</p></div>
  );
  const [activeMoveCardKey, setActiveMoveCardKey] = useState('');
  const [moveQuery, setMoveQuery] = useState('');
  const [moveEditorPos, setMoveEditorPos] = useState({ top: 0, left: 0 });
  const dayMoveInputRef = useRef(null);
  const d = curDate ? curDate : new Date(dateStr);
  const relDay = d.getDay()===0 ? 6 : d.getDay()-1;

  useEffect(()=>{
    setActiveMoveCardKey('');
    setMoveQuery('');
  },[dateStr]);

  useEffect(()=>{
    if (activeMoveCardKey && dayMoveInputRef.current) dayMoveInputRef.current.focus();
  },[activeMoveCardKey]);

  useEffect(()=>{
    if (!activeMoveCardKey) return;
    const handleReflow = () => closeMoveEditor();
    window.addEventListener('resize', handleReflow);
    window.addEventListener('scroll', handleReflow, true);
    return () => {
      window.removeEventListener('resize', handleReflow);
      window.removeEventListener('scroll', handleReflow, true);
    };
  },[activeMoveCardKey]);

  function normKeyPart(s) {
    if (typeof normStr === 'function') return normStr(s || '');
    return String(s || '').replace(/\s+/g, ' ').trim();
  }

  function entryToken(entry, typeName = '') {
    if (entry?.absSlotKey) return `slot:${entry.absSlotKey}`;
    return `rel:${normKeyPart(entry?.rowLimit || typeName)}|${normKeyPart(entry?.colLimit || '')}|${normKeyPart(entry?.typeName || typeName)}`;
  }

  function getEntryTitle(entry, fallbackTypeName = '') {
    const rowLabel = normKeyPart(entry?.rowLimit || '');
    const typeLabel = normKeyPart(entry?.typeName || fallbackTypeName || '');
    if (rowLabel && rowLabel !== typeLabel) return rowLabel;
    return rowLabel || typeLabel || fallbackTypeName;
  }

  const moveCandidates = useMemo(()=>{
    const keyword = moveQuery.trim();
    const source = keyword ? allPersonnel.filter(pp=>matchSearch(pp.name, keyword)) : allPersonnel;
    return source.slice(0, 18);
  },[allPersonnel, moveQuery]);

  function closeMoveEditor() {
    setActiveMoveCardKey('');
    setMoveQuery('');
  }

  function openMoveEditor(cardKey, evt) {
    const rect = evt?.currentTarget?.getBoundingClientRect?.();
    const panelW = 280;
    const gap = 8;
    let left = rect ? rect.right + gap : 20;
    let top = rect ? rect.top - 4 : 20;
    if (left + panelW > window.innerWidth - 12) left = (rect ? rect.left : 20) - panelW - gap;
    if (left < 8) left = 8;
    const panelH = 260;
    if (top + panelH > window.innerHeight - 8) top = Math.max(8, window.innerHeight - panelH - 8);
    setMoveEditorPos({ top, left });
    setActiveMoveCardKey(cardKey);
    setMoveQuery('');
  }

  function moveCardEntry({ fromPid, toPid, tid, entryId }) {
    if (!toPid || !entryId || fromPid === toPid) return;
    moveEntry(dateStr, fromPid, toPid, tid, entryId, 'day');
    closeMoveEditor();
  }

  function buildEntryDiff(currentEntries, baselineEntries, typeName) {
    const baselinePool = {};
    baselineEntries.forEach(entry=>{
      const token = entryToken(entry, typeName);
      baselinePool[token] = baselinePool[token] || [];
      baselinePool[token].push(entry);
    });
    const currentCards = currentEntries.map(entry=>{
      const token = entryToken(entry, typeName);
      const queue = baselinePool[token];
      if (queue?.length) {
        queue.shift();
        return { status:'same', entry };
      }
      return { status:'added', entry };
    });
    const removedCards = [];
    Object.values(baselinePool).forEach(queue=>{
      queue.forEach(entry=>removedCards.push({ status:'removed', entry }));
    });
    return { currentCards, removedCards };
  }

  return (
    <div className={`grid-wrap${showDiff?' diff-on':''}`}>
      <table className="grid-table">
        <thead>
          <tr>
            <th className="col-name">姓名</th>
            {types.map(t=>(
              <th key={t.id} className="th-type" style={{borderTopColor:t.color,minWidth:'190px'}}>
                <div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:'2px'}}>
                  <span style={{color:t.color}}>{t.name}</span>
                  <span style={{fontSize:'11px',color:'var(--muted)',fontWeight:400}}>{t.hours} h / 次</span>
                </div>
              </th>
            ))}
            <th className="col-total" style={{minWidth:'85px'}}>合计(h)</th>
          </tr>
        </thead>
        <tbody>
          {personnel.map(p => {
            const th = dayHours(dateStr, p.id);
            return (
              <tr key={p.id}>
                <td className="col-name">{p.name}</td>
                {types.map(t => {
                  const cnt = getCount(dateStr, p.id, t.id);
                  const entries = getEntries(dateStr, p.id, t.id, {
                    source:'legacy',
                    colLimit:WD[relDay] || '',
                    typeName:t.name,
                  });
                  const tplEntries = showDiff ? getTplEntries(relDay, p.name, t.name) : [];
                  const { currentCards, removedCards } = showDiff
                    ? buildEntryDiff(entries, tplEntries, t.name)
                    : { currentCards: entries.map(entry=>({ status:'same', entry })), removedCards: [] };
                  return (
                    <td key={t.id}>
                      <div className="day-cell">
                        {(currentCards.length > 0 || removedCards.length > 0) && (
                          <div className="day-entry-list">
                            {currentCards.map(({ entry, status }, idx)=>{
                              const cardKey = `${dateStr}|${p.id}|${t.id}|${entry.id || idx}`;
                              const isMoveActive = activeMoveCardKey === cardKey;
                              const targetCandidates = moveCandidates.filter(pp=>pp.id!==p.id);
                              return (
                              <div key={entry.id || `${idx}_${t.id}`} className={`day-entry-card ${status}`} style={{position:'relative'}}>
                                <span className="day-entry-title">{getEntryTitle(entry, t.name)}</span>
                                <button className="day-entry-del" title="删除该条记录" onClick={()=>removeEntry(dateStr, p.id, t.id, entry.id, 'day')}>✕</button>
                                <button
                                  className="day-entry-del"
                                  title="移动该条记录"
                                  onClick={e=>isMoveActive ? closeMoveEditor() : openMoveEditor(cardKey, e)}
                                  style={{right:'28px'}}
                                >⇄</button>
                                {isMoveActive && (
                                  <div
                                    className="week-slot-editor day-entry-editor"
                                    style={{position:'fixed',top:`${moveEditorPos.top}px`,left:`${moveEditorPos.left}px`,minWidth:'220px',maxWidth:'280px',zIndex:2000}}
                                    onMouseDown={e=>e.stopPropagation()}
                                    onClick={e=>e.stopPropagation()}
                                  >
                                    <div className="week-slot-editor-head">
                                      <strong>{WD[relDay]} · {entry.typeName || t.name}</strong>
                                      <span>行限位：{getEntryTitle(entry, t.name)}</span>
                                    </div>
                                    <input
                                      ref={dayMoveInputRef}
                                      className="inp"
                                      value={moveQuery}
                                      placeholder="输入目标人员，可搜姓名 / 拼音首字母"
                                      onChange={e=>setMoveQuery(e.target.value)}
                                      onKeyDown={e=>{
                                        if (e.key === 'Enter') {
                                          e.preventDefault();
                                          const exact = targetCandidates.find(pp=>pp.name===moveQuery.trim());
                                          const fallback = targetCandidates[0];
                                          const chosen = exact || fallback;
                                          if (chosen) moveCardEntry({ fromPid:p.id, toPid:chosen.id, tid:t.id, entryId:entry.id });
                                        } else if (e.key === 'Escape') {
                                          e.preventDefault();
                                          closeMoveEditor();
                                        }
                                      }}
                                    />
                                    <div className="week-slot-editor-suggestions">
                                      {targetCandidates.map(pp=>(
                                        <button
                                          type="button"
                                          key={pp.id}
                                          className="week-slot-editor-chip"
                                          onClick={()=>moveCardEntry({ fromPid:p.id, toPid:pp.id, tid:t.id, entryId:entry.id })}
                                        >
                                          {pp.name}
                                        </button>
                                      ))}
                                      {!targetCandidates.length && <span className="week-slot-editor-empty">没有匹配人员</span>}
                                    </div>
                                    <div className="week-slot-editor-actions">
                                      <button className="btn btn-sm" onClick={closeMoveEditor}>取消</button>
                                    </div>
                                  </div>
                                )}
                              </div>
                            )})}
                            {removedCards.map(({ entry }, idx)=>(
                              <div key={`removed_${entry.id || idx}_${t.id}`} className="day-entry-card removed">
                                <span className="day-entry-title">{getEntryTitle(entry, t.name)}</span>
                                <span className="day-entry-meta">已移出</span>
                              </div>
                            ))}
                          </div>
                        )}
                        <div className="counter-wrap">
                          <button
                            className="cbtn minus"
                            disabled={cnt===0}
                            onClick={()=>{
                              if (entries.length) removeEntry(dateStr, p.id, t.id, entries[entries.length-1].id, 'day');
                              else update(dateStr,p.id,t.id,-1,'day');
                            }}
                          >
                            −
                          </button>
                          <div>
                            {entries.length===0 && <div className="cval" style={{color:cnt>0?t.color:'var(--muted)'}}>{cnt}</div>}
                            {cnt>0&&<div className="chours">{(cnt*t.hours).toFixed(1)}h</div>}
                          </div>
                          <button className="cbtn plus" onClick={()=>update(dateStr,p.id,t.id,1,'day')}>+</button>
                        </div>
                      </div>
                    </td>
                  );
                })}
                <td className="col-total" style={{fontSize:'15px'}}>
                  {th>0 ? th.toFixed(1) : <span style={{color:'var(--muted)'}}>—</span>}
                </td>
              </tr>
            );
          })}
          {/* Totals row */}
          <tr className="row-total">
            <td className="col-name">合计</td>
            {types.map(t=>{
              const cnt = personnel.reduce((s,p)=>s+getCount(dateStr,p.id,t.id),0);
              const hrs = cnt * t.hours;
              return (
                <td key={t.id} style={{fontFamily:"'SF Mono','Consolas',monospace",fontSize:'12px'}}>
                  {cnt>0 ? <><span style={{color:t.color}}>{cnt}条</span><span style={{color:'var(--muted)'}}> / {hrs.toFixed(1)}h</span></> : <span style={{color:'var(--muted)'}}>—</span>}
                </td>
              );
            })}
            <td style={{fontFamily:"'SF Mono','Consolas',monospace",fontSize:'15px',color:'var(--yellow)',fontWeight:700}}>
              {personnel.reduce((s,p)=>s+dayHours(dateStr,p.id),0).toFixed(1)}
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  );
}

/* ═══ Week View ═════════════════════════════════════════════════════════════ */
function WeekView({ personnel, types, wDates, dayHours, setCurDate, setView, showDiff, getTplCount, template, records, setRecords, weekMode, setWeekMode, weekDayLocked }) {
  const wTotal = (pid) => wDates.reduce((s,d)=>s+dayHours(fmt(d),pid), 0);
  const colTotal = (d) => personnel.reduce((s,p)=>s+dayHours(fmt(d),p.id), 0);
  const grandTotal = () => wDates.reduce((s,d)=>s+colTotal(d), 0);
  const [activeDay, setActiveDay] = useState(0);
  const [reviseQuery, setReviseQuery] = useState('');
  const [revisePersonId, setRevisePersonId] = useState('');
  const [reviseZoom, setReviseZoom] = useState(1);
  const [selectedSlotKey, setSelectedSlotKey] = useState('');
  const reviseTopScrollRef = useRef(null);
  const reviseGridWrapRef = useRef(null);
  const reviseInlineInputRef = useRef(null);

  function goDay(d) { setCurDate(new Date(d)); setView('day'); }

  // template hours for a person on a weekday (sum across all types)
  function tplDayHours(personName, relDay) {
    if (!template || !getTplCount) return 0;
    const dayData = template.data?.[relDay]?.[personName];
    if (!dayData) return 0;
    return Object.entries(dayData).reduce((s,[tn,cnt])=>{
      const t = types.find(t=>t.name===tn);
      return s + (t ? cnt*t.hours : 0);
    }, 0);
  }

  useEffect(()=>{
    setReviseQuery('');
    setRevisePersonId('');
  },[activeDay]);

  useEffect(()=>{
    setSelectedSlotKey('');
    setReviseQuery('');
    setRevisePersonId('');
  },[template]);

  useEffect(()=>{
    if (selectedSlotKey && reviseInlineInputRef.current) reviseInlineInputRef.current.focus();
  },[selectedSlotKey]);

  const reviseCandidates = useMemo(()=>{
    const source = reviseQuery.trim()
      ? personnel.filter(p=>matchSearch(p.name, reviseQuery.trim()))
      : personnel;
    return source.slice(0, 18);
  },[personnel, reviseQuery]);

  const personIndex = useMemo(()=>Object.fromEntries(personnel.map(p=>[p.name, p])), [personnel]);
  const typeIndexByName = useMemo(()=>Object.fromEntries(types.map(t=>[t.name, t])), [types]);
  const previewMeta = template?.preview || null;
  const getSlotAbsKey = useCallback((slot)=>slot?.slotKey || slot?.key || null, []);
  const previewSlotEntries = useMemo(()=>{
    if (!previewMeta?.cellSlotMap) return [];
    return Object.entries(previewMeta.cellSlotMap)
      .map(([key, slot])=>{
        const [r, c] = key.split(',').map(Number);
        return { key, r, c, ...slot };
      })
      .sort((a,b)=>a.r-b.r || a.c-b.c);
  },[previewMeta]);

  const slotAssignments = useMemo(()=>{
    if (!previewSlotEntries.length) return { byKey:{} };
    const pidToName = Object.fromEntries(personnel.map(p=>[p.id, p.name]));
    const typeById = Object.fromEntries(types.map(t=>[t.id, t]));
    const poolsExact = {};
    const poolsCoord = {};
    const pushPool = (bucket, key, item) => {
      bucket[key] = bucket[key] || [];
      bucket[key].push(item);
    };

    wDates.forEach((d, relDay)=>{
      const dateStr = fmt(d);
      const dayRec = records?.[dateStr] || {};
      Object.entries(dayRec).forEach(([pid, personRec])=>{
        const personName = pidToName[pid];
        if (!personName) return;
        Object.entries(personRec || {}).forEach(([tid, cell])=>{
          const typeName = typeById[tid]?.name;
          if (!typeName) return;
          const arr = Array.isArray(cell)
            ? cell
            : Array.from({length:Math.max(0, parseInt(cell, 10) || 0)}, ()=>({}));
          arr.forEach((entry, idx)=>{
            const itemId = `${dateStr}|${pid}|${tid}|${entry?.id || idx}`;
            const exactKey = entry?.absSlotKey ? `${relDay}|${typeName}|${entry.absSlotKey}` : '';
            const coordKey = Number.isFinite(entry?.absRow) && Number.isFinite(entry?.absCol)
              ? `${relDay}|${typeName}|${entry.absRow},${entry.absCol}`
              : '';
            const item = {
              itemId,
              exactKey,
              coordKey,
              personName,
              pid,
              tid,
              entryId: entry?.id || null,
              absSlotKey: entry?.absSlotKey || null,
              absRow: Number.isFinite(entry?.absRow) ? entry.absRow : null,
              absCol: Number.isFinite(entry?.absCol) ? entry.absCol : null,
            };
            if (exactKey) pushPool(poolsExact, exactKey, item);
            if (coordKey) pushPool(poolsCoord, coordKey, item);
          });
        });
      });
    });
    const sortPool = arr => arr.sort((a,b)=>{
      const ar = Number.isFinite(a.absRow) ? a.absRow : Number.POSITIVE_INFINITY;
      const br = Number.isFinite(b.absRow) ? b.absRow : Number.POSITIVE_INFINITY;
      const ac = Number.isFinite(a.absCol) ? a.absCol : Number.POSITIVE_INFINITY;
      const bc = Number.isFinite(b.absCol) ? b.absCol : Number.POSITIVE_INFINITY;
      if (ar !== br) return ar - br;
      if (ac !== bc) return ac - bc;
      return a.personName.localeCompare(b.personName, 'zh');
    });
    Object.values(poolsExact).forEach(sortPool);
    Object.values(poolsCoord).forEach(sortPool);

    // Fallback baseline queue for legacy templates lacking slot baseline personName.
    const fallbackPools = {};
    Object.entries(template?.data || {}).forEach(([wd, dayMap])=>{
      fallbackPools[wd] = fallbackPools[wd] || {};
      Object.entries(dayMap || {}).forEach(([personName, typeMap])=>{
        Object.entries(typeMap || {}).forEach(([typeName, cnt])=>{
          fallbackPools[wd][typeName] = fallbackPools[wd][typeName] || [];
          for (let i=0; i<(cnt||0); i++) fallbackPools[wd][typeName].push(personName);
        });
      });
      Object.values(fallbackPools[wd]).forEach(arr=>arr.sort((a,b)=>a.localeCompare(b,'zh')));
    });

    const removePoolItem = (bucket, key, itemId) => {
      const q = bucket[key];
      if (!q?.length) return;
      const idx = q.findIndex(it=>it.itemId===itemId);
      if (idx >= 0) q.splice(idx, 1);
    };

    const byKey = {};
    for (const slot of previewSlotEntries) {
      const baselineFromSlot = slot.personName || null;
      const fallbackQueue = fallbackPools[slot.weekday]?.[slot.typeName] || [];
      const baselinePerson = baselineFromSlot || (fallbackQueue.length ? fallbackQueue.shift() : null);
      const slotAbsKey = getSlotAbsKey(slot);
      const exactKey = slotAbsKey ? `${slot.weekday}|${slot.typeName}|${slotAbsKey}` : '';
      const coordKey = Number.isFinite(slot.r) && Number.isFinite(slot.c)
        ? `${slot.weekday}|${slot.typeName}|${slot.r},${slot.c}`
        : '';
      const exactQueue = exactKey ? (poolsExact[exactKey] || []) : [];
      let picked = exactQueue.length ? exactQueue.shift() : null;
      if (picked) removePoolItem(poolsCoord, picked.coordKey, picked.itemId);
      if (!picked) {
        const coordQueue = coordKey ? (poolsCoord[coordKey] || []) : [];
        picked = coordQueue.length ? coordQueue.shift() : null;
      }
      const currentPerson = picked?.personName || null;
      const state = currentPerson
        ? (currentPerson === baselinePerson ? 'original' : 'changed')
        : (baselinePerson ? 'removed' : 'empty');
      byKey[slot.key] = { ...slot, baselinePerson, currentPerson, currentRef:picked, state };
    }
    return { byKey };
  },[previewSlotEntries, template, records, wDates, personnel, types, getSlotAbsKey]);

  if (!personnel.length) return (
    <div className="empty"><div className="icon">👥</div><p>暂无人员，请先导入</p></div>
  );

  function normalizeWeekCellEntries(cell) {
    if (Array.isArray(cell)) return cell.map(e=>e && typeof e==='object' ? e : { id:uid(), source:'legacy' });
    const n = Math.max(0, parseInt(cell, 10) || 0);
    return Array.from({length:n}, ()=>({ id:uid(), source:'legacy' }));
  }

  function removeSlotEntry(r, dateStr, personName, typeName, slot, currentRef = null) {
