/* ═══ Calendar Picker ══════════════════════════════════════════════════════ */
function CalendarPicker({ curDate, setCurDate, view, records, dateLabel, isHighlight }) {
  const [open, setOpen] = useState(false);
  const [panelMode, setPanelMode] = useState('day'); // 'day' | 'month' | 'year'
  const [panelDate, setPanelDate] = useState(() => new Date(curDate));
  const ref = useRef();

  // Sync panel when curDate changes externally
  useEffect(() => { setPanelDate(new Date(curDate)); }, [curDate.toDateString()]);

  // Close on outside click
  useEffect(() => {
    if (!open) return;
    function handler(e) { if (ref.current && !ref.current.contains(e.target)) setOpen(false); }
    document.addEventListener('mousedown', handler);
    return () => document.removeEventListener('mousedown', handler);
  }, [open]);

  const todayStr = fmt(new Date());
  const curStr   = fmt(curDate);

  // Dates that have any record
  const datesToDots = useMemo(() => new Set(Object.keys(records)), [records]);

  // Which dates are in curDate's week (for week view highlighting)
  const weekSet = useMemo(() => {
    if (view !== 'week') return new Set();
    const mon = getMonday(curDate);
    return new Set(Array.from({length:7},(_,i)=>fmt(addDays(mon,i))));
  }, [view, curDate]);

  /* ── Panel navigation ── */
  function prevPanel() {
    setPanelDate(d => {
      const r = new Date(d);
      if (panelMode==='day')   { r.setMonth(r.getMonth()-1); }
      else if (panelMode==='month') { r.setFullYear(r.getFullYear()-1); }
      else { r.setFullYear(r.getFullYear()-12); }
      return r;
    });
  }
  function nextPanel() {
    setPanelDate(d => {
      const r = new Date(d);
      if (panelMode==='day')   { r.setMonth(r.getMonth()+1); }
      else if (panelMode==='month') { r.setFullYear(r.getFullYear()+1); }
      else { r.setFullYear(r.getFullYear()+12); }
      return r;
    });
  }

  function selectDay(d) {
    setCurDate(new Date(d));
    setOpen(false);
    setPanelMode('day');
  }
  function selectMonth(m) {
    setPanelDate(d => { const r=new Date(d); r.setMonth(m); return r; });
    setPanelMode('day');
  }
  function selectYear(y) {
    setPanelDate(d => { const r=new Date(d); r.setFullYear(y); return r; });
    setPanelMode('month');
  }

  /* ── Build day grid ── */
  function buildDayGrid() {
    const year = panelDate.getFullYear();
    const month = panelDate.getMonth();
    const first = new Date(year, month, 1);
    const startDow = first.getDay(); // 0=Sun
    // Start from Monday
    const startOffset = startDow === 0 ? 6 : startDow - 1;
    const cells = [];
    for (let i = 0; i < startOffset; i++) {
      cells.push({ d: addDays(first, -startOffset+i), otherMonth: true });
    }
    const daysInMonth = new Date(year, month+1, 0).getDate();
    for (let i = 1; i <= daysInMonth; i++) {
      cells.push({ d: new Date(year, month, i), otherMonth: false });
    }
    // pad to complete last row
    while (cells.length % 7 !== 0) {
      cells.push({ d: addDays(cells[cells.length-1].d, 1), otherMonth: true });
    }
    return cells;
  }

  const panelTitle = useMemo(() => {
    if (panelMode==='day') return `${panelDate.getFullYear()}年 ${panelDate.getMonth()+1}月`;
    if (panelMode==='month') return `${panelDate.getFullYear()}年`;
    const base = Math.floor(panelDate.getFullYear()/12)*12;
    return `${base} — ${base+11}`;
  }, [panelMode, panelDate]);

  const yearBase = Math.floor(panelDate.getFullYear()/12)*12;

  const WDS = ['一','二','三','四','五','六','日'];
  const MONTHS = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];

  return (
    <div className="cal-anchor" ref={ref}>
      <span
        className={`date-label${isHighlight?' today-indicator':''}`}
        style={{cursor:'pointer',userSelect:'none',borderRadius:6,padding:'2px 8px',
          transition:'background .12s', background: open ? 'var(--surface2)' : 'transparent'}}
        onClick={()=>setOpen(o=>!o)}
        title="点击打开日历"
      >{dateLabel} 📅</span>

      {open && (
        <div className="cal-popup">
          {/* Header */}
          <div className="cal-head">
            <span className="cal-nav" onClick={prevPanel}>‹</span>
            <span className="cal-title" onClick={()=>setPanelMode(m=>m==='day'?'month':m==='month'?'year':'year')}>
              {panelTitle}
            </span>
            <span className="cal-nav" onClick={nextPanel}>›</span>
          </div>

          {/* Day grid */}
          {panelMode==='day' && (<>
            <div className="cal-grid">
              {WDS.map(w=><div key={w} className="cal-wd">{w}</div>)}
              {buildDayGrid().map((cell,i)=>{
                const ds = fmt(cell.d);
                const isSel = view==='day' ? ds===curStr : weekSet.has(ds);
                const isWkStart = view==='week' && weekSet.has(ds) && cell.d.getDay()===(getMonday(curDate).getDay());
                const isWkEnd   = view==='week' && weekSet.has(ds) && cell.d.getDay()===0;
                let cls = 'cal-day';
                if (cell.otherMonth) cls+=' other-month';
                if (ds===todayStr) cls+=' is-today';
                if (view==='day' && ds===curStr) cls+=' selected';
                if (view==='week' && weekSet.has(ds) && !cell.otherMonth) cls+=' in-week';
                if (datesToDots.has(ds) && !cell.otherMonth) cls+=' has-data';
                return (
                  <div key={i} className={cls}
                    onClick={()=>!cell.otherMonth && selectDay(cell.d)}>
                    {cell.d.getDate()}
                  </div>
                );
              })}
            </div>
          </>)}

          {/* Month grid */}
          {panelMode==='month' && (
            <div className="cal-month-grid">
              {MONTHS.map((m,i)=>(
                <div key={i} className={`cal-month-item${panelDate.getMonth()===i?' selected':''}`}
                  onClick={()=>selectMonth(i)}>{m}</div>
              ))}
            </div>
          )}

          {/* Year grid */}
          {panelMode==='year' && (
            <div className="cal-year-grid">
              {Array.from({length:12},(_,i)=>yearBase+i).map(y=>(
                <div key={y} className={`cal-year-item${panelDate.getFullYear()===y?' selected':''}`}
                  onClick={()=>selectYear(y)}>{y}</div>
              ))}
            </div>
          )}

          {/* Footer */}
          <div className="cal-footer">
            <button className="btn btn-sm" style={{flex:1}} onClick={()=>{
              const t=new Date(); setPanelDate(t); setPanelMode('day');
              setCurDate(t); setOpen(false);
            }}>今天</button>
            <button className="btn btn-sm" style={{flex:1}} onClick={()=>setOpen(false)}>关闭</button>
          </div>
        </div>
      )}
    </div>
  );
}


/* ═══ Schedule Import Modal ═════════════════════════════════════════════════ */

/* ── Pure parsing logic (no React) ── */
function normStr(s) {
  if (s == null) return '';
  return String(s).replace(/：/g,':').replace(/[－—\u2014\u2013]/g,'-').replace(/\s+/g,' ').trim();
}

function parseTimeMins(label) {
  const s = normStr(label);
  const m = s.match(/(\d{1,2}):(\d{2})\s*[-~]\s*(\d{1,2}):(\d{2})/);
  if (!m) return null;
  let start = parseInt(m[1])*60+parseInt(m[2]);
  let end   = parseInt(m[3])*60+parseInt(m[4]);
  if (end <= start) end += 24*60;
  return end - start;
}

// Type labels that explicitly map to 1h (shortest type)
const ONE_HOUR_LABELS = new Set(['负责人','晚上值日','值日','巡视','夜巡','值守']);

function classifyByTypes(label, types) {
  const s = normStr(label);
  const shortest = () => [...types].sort((a,b)=>a.hours-b.hours)[0] || null;
  // Explicit 1h labels (负责人, 晚上值日, etc.)
  if (ONE_HOUR_LABELS.has(s) || ONE_HOUR_LABELS.has(label)) return shortest();
  // Type d: pure weekday with no time → 1h
  if (extractWeekday(s) !== null && !/\d{1,2}:\d{2}/.test(s)) return shortest();
  // Type a/b/e: contains a time range → match by duration
  const mins = parseTimeMins(s);
  if (mins != null && mins > 0) {
    let best=null, bestDiff=Infinity;
    for (const t of types) {
      const d = Math.abs(t.hours - mins/60);
      if (d < bestDiff) { bestDiff=d; best=t; }
    }
    if (best && bestDiff <= 0.65) return best;
  }
  // Fallback: keyword contains type name
  for (const t of [...types].sort((a,b)=>b.hours-a.hours)) {
    if (s.includes(t.name)) return t;
  }
  return shortest();
}

const WD_MAP_TABLE = [
  [['星期一','周一'],0],[['星期二','周二'],1],[['星期三','周三'],2],
  [['星期四','周四'],3],[['星期五','周五'],4],[['星期六','周六'],5],
  [['星期日','周日','星期天','周天'],6],
];
function extractWeekday(s) {
  if (!s) return null;
  const n = normStr(s);
  for (const [keys, wd] of WD_MAP_TABLE) {
    for (const k of keys) {
      if (n.startsWith(k) || n === k) return wd;
    }
  }
  return null;
}

const HEADER_KW_SET = new Set(['签到','楼层','负责人','值班','洗板擦布','洗抹布','洗板']);
// Match exact set OR anything starting with "洗"（洗抹布/洗板擦布 etc）
function isHeaderKW(s) {
  if (!s) return false;
  return HEADER_KW_SET.has(s) || s.startsWith('洗');
}
// Keep HEADER_KW as alias for Set-style usage in isPersonName
const HEADER_KW = HEADER_KW_SET;
const SKIP_NAMES = new Set(['无需值日','无需值班','无','时间','综合楼','s1楼','负责人','楼层','值班组','巡视组','周一','周二','周三','周四','周五','周六','周日','周天','星期一','星期二','星期三','星期四','星期五','星期六','星期日','星期天']);

function isPersonName(s) {
  if (!s) return false;
  const t = normStr(s).toLowerCase();
  if (!t) return false;
  if (SKIP_NAMES.has(t)) return false;
  if (SKIP_NAMES.has(s)) return false;
  if (/^\d+$/.test(t)) return false;     // pure number
  if (t.length > 12) return false;        // too long
  if (isHeaderKW(s) || [...HEADER_KW].some(kw=>t.includes(kw))) return false;
  const BAD = ['排班','安排','校历','周末','巡视','综合楼','s1楼','值班组','巡视组'];
  if (BAD.some(k => t.includes(k))) return false;
  // Reject time-range strings and pure weekday names
  if (/\d{1,2}:\d{2}/.test(normStr(s))) return false;
  const cjk = (s.match(/[\u4e00-\u9fff]/g)||[]).length;
  return cjk >= 1;
}

function buildGrid(ws) {
  // Expand merged cells; returns getCellFn(row0, col0) → string|null (0-indexed)
  const mergeVals = {};
  for (const m of (ws['!merges']||[])) {
    const topLeft = ws[XLSX.utils.encode_cell({r:m.s.r, c:m.s.c})];
    const val = topLeft?.v != null ? normStr(String(topLeft.v)) : null;
    for (let r=m.s.r; r<=m.e.r; r++)
      for (let cc=m.s.c; cc<=m.e.c; cc++)
        mergeVals[`${r},${cc}`] = val;
  }
  return function(r, cc) {
    const key = `${r},${cc}`;
    if (key in mergeVals) return mergeVals[key] || null;
    const cell = ws[XLSX.utils.encode_cell({r, c:cc})];
    return cell?.v != null ? normStr(String(cell.v)) : null;
  };
}

function getSheetDims(ws) {
  const ref = ws['!ref'];
  if (!ref) return {maxR:0, maxC:0};
  const rng = XLSX.utils.decode_range(ref);
  return {maxR: rng.e.r, maxC: rng.e.c};
}

function parseScheduleSheetNew(ws, types, personnel, extraRules) {
  const G = buildGrid(ws);
  const {maxR, maxC} = getSheetDims(ws);

  function tryMatch(rawName) {
    if (!rawName) return null;
    const check = (name) => {
      let p = personnel.find(p => p.name === name);
      if (p) return p;
      const part = name.split(/[·•]/)[0].trim();
      p = personnel.find(p => p.name === part || p.name.startsWith(part) || part.startsWith(p.name));
      if (p) return p;
      if (part.length >= 2) p = personnel.find(p => p.name.includes(part) || part.includes(p.name));
      return p || null;
    };
    if (extraRules[rawName]) return check(extraRules[rawName]);
    return check(rawName);
  }

  // Safe read: falls back left up to 2 cells for non-topleft merged cells
  function Gsafe(r, cc) {
    const v = G(r, cc);
    if (v != null) return v;
    if (cc > 0) { const v1 = G(r, cc-1); if (v1 != null) return v1; }
    if (cc > 1) { const v2 = G(r, cc-2); if (v2 != null) return v2; }
    return null;
  }

  // Normalize typeCol to the merge top-left in the header row
  function normTypeCol(hr, col) {
    const val = G(hr, col);
    if (!val) return col;
    let left = col;
    while (left > 0 && G(hr, left-1) === val) left--;
    return left;
  }

  // ── 1. Find 签到 header rows ──────────────────────────────────────────
  const signRowSet = new Set();
  for (let r=0; r<=maxR; r++)
    for (let cc=0; cc<=maxC; cc++)
      if (G(r,cc) === '签到') signRowSet.add(r);
  const signRows = [...signRowSet].sort((a,b)=>a-b);
  if (signRows.length === 0) return {error:'未找到包含「签到」的表头行'};

  const result = {};
  const unmatchedSet = new Set();
  const signRowsExt = [...signRows, maxR+1];

  for (let si=0; si<signRows.length; si++) {
    const hr        = signRows[si];
    const dataStart = hr + 1;
    const dataEnd   = signRowsExt[si+1] - 2;
    if (dataStart > dataEnd) continue;

    // ── 2a. Deduplicate sign_cols: keep first of each consecutive run ──
    const rawSC = [];
    for (let cc=0; cc<=maxC; cc++)
      if (G(hr,cc) === '签到') rawSC.push(cc);
    const signCols = [];
    let runEnd = -2;
    for (const cc of rawSC) {
      if (cc > runEnd+1) signCols.push(cc);
      runEnd = cc;
    }

    // ── 2b. Build groups ──────────────────────────────────────────────
    const groups = [];
    for (const sc of signCols) {
      let foundWd = null, foundWdCol = -1;
      // Scan left from sign col to find weekday header
      for (let cc=sc-1; cc>=0; cc--) {
        const cv = G(hr, cc);
        if (!cv) continue;
        if (isHeaderKW(cv)) continue;
        const wd = extractWeekday(cv);
        if (wd !== null) { foundWd=wd; foundWdCol=cc; break; }
        if (cv === '时间') continue;
        break;
      }

      let pcols;
      if (foundWdCol >= 0) {
        // Standard weekday-column block: extend left through merged header
        const wdVal = G(hr, foundWdCol);
        let leftBound = foundWdCol;
        while (leftBound > 0 && G(hr, leftBound-1) === wdVal) leftBound--;
        pcols = [];
        for (let cc=leftBound; cc<sc; cc++) pcols.push(cc);
      } else {
        // Section-3 style: date/type lives in the data cell itself (e.g. 周一, 周六7:30-9:30)
        // Find typeCol = rightmost '时间' to the left, skipping all separator keywords
        let typeColR = 0;
        for (let cc=sc-1; cc>=0; cc--) {
          const cv = G(hr, cc);
          if (!cv) continue;
          if (cv === '时间') { typeColR = cc; break; }
          if (isHeaderKW(cv)) continue;
          if (extractWeekday(cv) !== null) { typeColR = cc; break; }
          typeColR = cc; break;
        }
        pcols = [];
        for (let cc=typeColR+1; cc<sc; cc++) pcols.push(cc);
      }

      // typeCol: scan left from first pcol to find '时间' source column,
      // then normalize to the merge top-left so data-row lookups hit the actual cell
      let typeCol = 0;
      if (pcols.length > 0) {
        const firstP = pcols[0];
        for (let cc=firstP-1; cc>=0; cc--) {
          const cv = G(hr, cc);
          if (!cv) continue;
          if (cv === '时间') { typeCol = normTypeCol(hr, cc); break; }
          if (isHeaderKW(cv)) continue;
          if (extractWeekday(cv) !== null) continue;
          typeCol = normTypeCol(hr, cc); break;
        }
      }

      groups.push({wd: foundWd, pcols, typeCol, sc});
    }

    // ── 2c. Process data rows ─────────────────────────────────────────
    for (let r=dataStart; r<=dataEnd; r++) {
      for (const grp of groups) {
        const typeRaw = Gsafe(r, grp.typeCol);
        if (!typeRaw) continue;
        const typeNorm = normStr(typeRaw);

        let wd = grp.wd;
        if (wd === null) wd = extractWeekday(typeRaw);
        if (wd === null) continue;

        const wt = classifyByTypes(typeNorm, types);
        if (!wt) continue;

        const seen = new Set();
        for (const cc of grp.pcols) {
          const nm = G(r, cc);
          if (!nm || seen.has(nm) || !isPersonName(nm)) continue;
          seen.add(nm);
          const pObj = tryMatch(nm);
          if (pObj) {
            result[wd] = result[wd]||{};
            result[wd][pObj.name] = result[wd][pObj.name]||{};
            result[wd][pObj.name][wt.name] = (result[wd][pObj.name][wt.name]||0)+1;
          } else {
            unmatchedSet.add(nm);
          }
        }
      }
    }
  }

  return {result, unmatched:[...unmatchedSet]};
}

/* ── PreviewTabs: summary + raw grid view ── */
function PreviewTabs({ parseResult, personnel, types, WD_LABELS }) {
  const [tab, setTab] = useState('summary'); // 'summary' | 'raw'
  const cellMatchType = parseResult.cellMatchType || {};

  // ── Legend colors
  const CELL_COLORS = {
    matched:   {bg:'var(--green)33',  color:'var(--green)',  border:'var(--green)66',  label:'已匹配人员'},
    unmatched: {bg:'var(--yellow)22', color:'var(--yellow)', border:'var(--yellow)66', label:'未匹配人员'},
    type:      {bg:'var(--accent)22', color:'var(--accent)', border:'var(--accent)55', label:'工时类型'},
  };

  // ── Raw grid renderer ───────────────────────────────────────────────────
  function RawGrid() {
    if (!parseResult.rawGrid) return <div style={{color:'var(--muted)',fontSize:'12px',padding:'20px',textAlign:'center'}}>原始表格数据不可用</div>;

    const grid = parseResult.rawGrid;
    // Trim trailing empty rows/cols for display
    let maxR = 0, maxC = 0;
    for (let r=0; r<grid.length; r++) {
      for (let cc=0; cc<grid[r].length; cc++) {
        if (grid[r][cc].val) { maxR = Math.max(maxR, r); maxC = Math.max(maxC, cc); }
      }
    }
    // Add a small buffer
    maxR = Math.min(maxR + 1, grid.length - 1);
    maxC = Math.min(maxC + 1, (grid[0]?.length || 1) - 1);

    const HEADER_KW_VALS = new Set(['签到','楼层','负责人','值班','洗板擦布','洗抹布','洗板','时间']);

    function cellStyle(r, cc) {
      const key = `${r},${cc}`;
      const mt = cellMatchType[key];
      if (mt && CELL_COLORS[mt]) {
        const col = CELL_COLORS[mt];
        return {background:col.bg, color:col.color, border:`1px solid ${col.border}`, fontWeight:600};
      }
      const val = grid[r]?.[cc]?.val;
      if (!val) return {};
      if (HEADER_KW_VALS.has(val)) return {background:'var(--surface2)',color:'var(--muted)',fontStyle:'italic'};
      return {};
    }

    return (
      <div className="raw-grid-wrap">
        <table className="raw-grid">
          <thead>
            <tr>
              <th className="row-hdr">#</th>
              {Array.from({length:maxC+1},(_,i)=>(
                <th key={i}>{String.fromCharCode(65+i)}</th>
              ))}
            </tr>
          </thead>
          <tbody>
            {Array.from({length:maxR+1},(_,r)=>(
              <tr key={r}>
                <td className="row-hdr">{r+1}</td>
                {Array.from({length:maxC+1},(_,cc)=>{
                  const val = grid[r]?.[cc]?.val;
                  const st = cellStyle(r, cc);
                  return (
                    <td key={cc} style={st} title={val||''}>
                      {val ? (val.length>10 ? val.slice(0,9)+'…' : val) : ''}
                    </td>
                  );
                })}
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    );
  }

  // ── Summary table ──────────────────────────────────────────────────────
  function SummaryTable() {
    const matchedPersonnel = personnel.filter(p=>
      Object.values(parseResult.result).some(d=>d[p.name])
    );
    return (
      <div className="sched-table-wrap">
        <table className="sched-table">
          <thead>
            <tr>
              <th style={{minWidth:60}}>姓名</th>
              {WD_LABELS.map(w=><th key={w}>{w}</th>)}
              <th>合计</th>
            </tr>
          </thead>
          <tbody>
            {matchedPersonnel.map(p=>{
              let tot = 0;
              return (
                <tr key={p.id}>
                  <td style={{fontWeight:600}}>{p.name}</td>
                  {[0,1,2,3,4,5,6].map(wd=>{
                    const pDay = parseResult.result[wd]?.[p.name];
                    if (!pDay) return <td key={wd} style={{color:'var(--border)'}}>—</td>;
                    const entries = Object.entries(pDay);
                    entries.forEach(([,cnt])=>{ tot+=cnt; });
                    return (
                      <td key={wd} style={{fontSize:'11px'}}>
                        {entries.map(([tn,cnt])=>{
                          const t = types.find(t=>t.name===tn);
                          return <div key={tn} style={{color:t?.color}}>{tn}×{cnt}</div>;
                        })}
                      </td>
                    );
                  })}
                  <td style={{fontFamily:'monospace',color:'var(--accent)',fontWeight:700}}>{tot}</td>
                </tr>
              );
            })}
            {matchedPersonnel.length===0 && (
              <tr><td colSpan={9} style={{textAlign:'center',color:'var(--muted)',padding:'16px'}}>暂无匹配人员</td></tr>
            )}
          </tbody>
        </table>
      </div>
    );
  }

  return (
    <div>
      {/* Tab switcher */}
      <div className="preview-tabs">
        <button className={`preview-tab${tab==='summary'?' active':''}`} onClick={()=>setTab('summary')}>
          📊 汇总（人员×星期）
        </button>
        <button className={`preview-tab${tab==='raw'?' active':''}`} onClick={()=>setTab('raw')}>
          🗂 原始表格（高亮识别区域）
        </button>
      </div>

      {/* Legend (raw view only) */}
      {tab==='raw' && (
        <div style={{display:'flex',gap:'10px',marginBottom:'6px',flexWrap:'wrap',fontSize:'11px',alignItems:'center'}}>
          {Object.entries(CELL_COLORS).map(([k,v])=>(
            <span key={k} style={{display:'inline-flex',alignItems:'center',gap:'4px'}}>
              <span style={{width:12,height:12,borderRadius:2,background:v.bg,border:`1px solid ${v.border}`,display:'inline-block'}}/>
              {v.label}
            </span>
          ))}
          <span style={{color:'var(--muted)',marginLeft:'auto'}}>列 A-Z，行号对应 Excel 行</span>
        </div>
      )}

      {tab==='summary' ? <SummaryTable/> : <RawGrid/>}
    </div>
  );
}

/* ── React Component ── */
function ScheduleImportModal({ personnel, types, onSave, close }) {
  const [step, setStep]               = useState(1);
  const [fileName, setFileName]       = useState('');
  const [ws, setWs]                   = useState(null);
  const [parseResult, setParseResult] = useState(null);
  const [extraRules, setExtraRules]   = useState({});
  const [editData, setEditData]       = useState(null); // editable copy of result
  const [tplName, setTplName]         = useState('');
  // New person row form
  const [newPerson, setNewPerson]     = useState('');
  const [newWd, setNewWd]             = useState(0);
  const [newType, setNewType]         = useState('');
  const [newCnt, setNewCnt]           = useState(1);
  const fileRef = useRef();
  const WD_LABELS = ['周一','周二','周三','周四','周五','周六','周日'];

  function handleFile(e) {
    const file = e.target.files[0]; if (!file) return;
    setFileName(file.name);
    setTplName(file.name.replace(/\.[^.]+$/,''));
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const wb = XLSX.read(ev.target.result, {type:'binary'});
        const sheet = wb.Sheets[wb.SheetNames[0]];
        setWs(sheet);
        const res = parseScheduleSheetNew(sheet, types, personnel, {});
        setParseResult(res);
        if (!res.error) {
          setEditData(JSON.parse(JSON.stringify(res.result)));
          setStep(res.unmatched.length > 0 ? 2 : 3);
        }
      } catch(err) { setParseResult({error:'读取失败：'+err.message}); }
    };
    reader.readAsBinaryString(file);
    e.target.value = '';
  }

  function setRule(raw, val) {
    const nr = {...extraRules, [raw]: val};
    setExtraRules(nr);
    if (ws) {
      const res = parseScheduleSheetNew(ws, types, personnel, nr);
      setParseResult(res);
      if (!res.error) {
        setEditData(JSON.parse(JSON.stringify(res.result)));
        if (res.unmatched.length === 0) setStep(3);
      }
    }
  }

  // ── Edit helpers ──────────────────────────────────────────────────────
  function setCount(wd, personName, typeName, cnt) {
    setEditData(prev => {
      const d = JSON.parse(JSON.stringify(prev));
      if (cnt <= 0) {
        if (d[wd]?.[personName]) {
          delete d[wd][personName][typeName];
          if (!Object.keys(d[wd][personName]).length) delete d[wd][personName];
          if (!Object.keys(d[wd]||{}).length) delete d[wd];
        }
      } else {
        d[wd] = d[wd]||{}; d[wd][personName] = d[wd][personName]||{};
        d[wd][personName][typeName] = cnt;
      }
      return d;
    });
  }

  function addEntry(wd, personName, typeName, cnt) {
    if (!personName || !typeName || cnt<=0) return;
    setCount(wd, personName, typeName, cnt);
  }

  function addNewRow() {
    const pname = newPerson || (personnel[0]?.name);
    const tname = newType || (types[0]?.name);
    if (!pname || !tname || newCnt<=0) return;
    addEntry(newWd, pname, tname, newCnt);
  }

  function deleteEntry(wd, personName, typeName) {
    setCount(wd, personName, typeName, 0);
  }

  function addTypeToCell(wd, personName) {
    const tname = types[0]?.name;
    if (!tname) return;
    setCount(wd, personName, tname, 1);
  }

  // ── Computed ──────────────────────────────────────────────────────────
  const totalCount = editData
    ? Object.values(editData).reduce((s,d)=>s+Object.values(d).reduce((ss,tt)=>ss+Object.values(tt).reduce((n,v)=>n+v,0),0),0)
    : 0;

  // All person names present in editData
  const editPersons = editData
    ? [...new Set(Object.values(editData).flatMap(d=>Object.keys(d)))].sort()
    : [];

  function doSave() {
    if (!editData) return;
    onSave({name: tplName || '排班模板', data: editData});
  }

  return (
    <div className="overlay" onClick={e=>e.target===e.currentTarget&&close()}>
      <div className="modal" style={{width:760,maxHeight:'92vh',overflow:'hidden',display:'flex',flexDirection:'column',padding:'18px'}}>
        <div className="modal-title" style={{marginBottom:10}}>
          📅 排班表 → 周模板
          <span style={{fontSize:'11px',color:'var(--muted)',fontWeight:400,marginLeft:8}}>可手动编辑后保存</span>
          <button className="close" onClick={close}>✕</button>
        </div>

        <div className="step-tabs">
          {[['1','上传文件'],['2','名称映射'],['3','编辑 & 确认']].map(([n,label],i)=>(
            <button key={n} className={`step-tab${step===i+1?' active':step>i+1?' done':''}`}
              onClick={()=>step>i+1&&setStep(i+1)}>{n}. {label}</button>
          ))}
        </div>

        <div style={{flex:1,overflowY:'auto'}}>

        {/* ── Step 1 ── */}
        {step===1 && (
          <div>
            <div style={{fontSize:'12px',color:'var(--muted)',marginBottom:'12px',lineHeight:1.8,
              background:'var(--surface2)',borderRadius:6,padding:'10px 12px'}}>
              <strong style={{color:'var(--text)'}}>支持格式：</strong>
              时间段（<code>7:05-9:35</code>）、类型+时段（<code>晚巡21:00-22:00</code>）、
              日期+时段（<code>周六7:30-9:30</code>）、日期（<code>周一</code>）、
              类型（<code>晚上值日</code>、<code>负责人</code>）均自动匹配工时类型
            </div>
            <input ref={fileRef} type="file" accept=".xlsx,.xls" style={{display:'none'}} onChange={handleFile}/>
            <div style={{display:'flex',gap:'10px',alignItems:'center'}}>
              <button className="btn btn-primary" onClick={()=>fileRef.current.click()}>📂 选择排班 Excel</button>
              {fileName && <span style={{fontSize:'12px',color:'var(--muted)'}}>{fileName}</span>}
            </div>
            {parseResult?.error && (
              <div style={{marginTop:'12px',padding:'10px',background:'var(--red)1a',
                border:'1px solid var(--red)',borderRadius:6,fontSize:'12px',color:'var(--red)'}}>
                ⚠ {parseResult.error}
              </div>
            )}
          </div>
        )}

        {/* ── Step 2 ── */}
        {step===2 && parseResult && !parseResult.error && (
          <div>
            <div style={{fontSize:'12px',color:'var(--yellow)',marginBottom:'12px',padding:'8px 12px',
              background:'var(--yellow)1a',borderRadius:6,border:'1px solid var(--yellow)'}}>
              ⚠ <strong>{parseResult.unmatched.length}</strong> 个姓名未能自动匹配，请手动指定（留空则跳过）
            </div>
            {parseResult.unmatched.map(raw=>(
              <div key={raw} className="rule-row">
                <code style={{fontSize:'12px',padding:'3px 8px',background:'var(--surface2)',
                  borderRadius:4,minWidth:'80px',color:'var(--red)'}}>{raw}</code>
                <span className="arr">→</span>
                <select className="rule-sel" value={extraRules[raw]||''} onChange={e=>setRule(raw,e.target.value)}>
                  <option value="">— 跳过 —</option>
                  {personnel.map(p=><option key={p.id} value={p.name}>{p.name}</option>)}
                </select>
                {extraRules[raw] && <span style={{fontSize:'11px',color:'var(--green)'}}>✓ {extraRules[raw]}</span>}
              </div>
            ))}
            <div style={{marginTop:'14px',display:'flex',gap:'8px'}}>
              <button className="btn" onClick={()=>setStep(1)}>← 返回</button>
              <button className="btn btn-primary" onClick={()=>{ setEditData(JSON.parse(JSON.stringify(parseResult.result))); setStep(3); }}>
                下一步 →
              </button>
            </div>
          </div>
        )}

        {/* ── Step 3: Editable table ── */}
        {step===3 && editData && (
          <div>
            {/* Stats bar */}
            <div style={{display:'flex',gap:'12px',marginBottom:'10px',fontSize:'12px',
              alignItems:'center',flexWrap:'wrap'}}>
              <span style={{color:'var(--muted)'}}>
                共 <strong style={{color:'var(--text)'}}>{editPersons.length}</strong> 人 ·
                <strong style={{color:'var(--accent)'}}> {totalCount}</strong> 条记录
              </span>
              {parseResult?.unmatched?.length>0 && (
                <span style={{color:'var(--yellow)'}}>⚠ {parseResult.unmatched.length} 人跳过</span>
              )}
              <span style={{fontSize:'11px',color:'var(--muted)',marginLeft:'auto'}}>
                💡 点击单元格内 ✕ 删除条目，下方可新增行
              </span>
            </div>

            {/* Editable person × weekday table */}
            <div className="sched-table-wrap" style={{maxHeight:'340px'}}>
              <table className="edit-tbl">
                <thead>
                  <tr>
                    <th className="col-name">姓名</th>
                    {WD_LABELS.map(w=><th key={w}>{w}</th>)}
                  </tr>
                </thead>
                <tbody>
                  {editPersons.map(pname=>(
                    <tr key={pname}>
                      <td className="col-name">{pname}</td>
                      {[0,1,2,3,4,5,6].map(wd=>{
                        const dayData = editData[wd]?.[pname];
                        const entries = dayData ? Object.entries(dayData) : [];
                        return (
                          <td key={wd}>
                            <div className="edit-cell">
                              {entries.map(([tn,cnt])=>{
                                const t = types.find(t=>t.name===tn);
                                return (
                                  <div key={tn} className="edit-entry">
                                    <select value={tn} onChange={e=>{
                                      const newTn=e.target.value;
                                      if (newTn===tn) return;
                                      setCount(wd,pname,tn,0);
                                      setCount(wd,pname,newTn,cnt);
                                    }} style={{color:t?.color||'var(--text)'}}>
                                      {types.map(t=><option key={t.id} value={t.name}>{t.name}</option>)}
                                    </select>
                                    <span style={{color:'var(--muted)',fontSize:'10px'}}>×</span>
                                    <input type="number" min="1" max="99" value={cnt}
                                      onChange={e=>setCount(wd,pname,tn,parseInt(e.target.value)||1)}/>
                                    <span className="del-entry"
                                      onClick={()=>deleteEntry(wd,pname,tn)}>✕</span>
                                  </div>
                                );
                              })}
                              <button className="add-entry-btn"
                                onClick={()=>addTypeToCell(wd,pname)}>＋</button>
                            </div>
                          </td>
                        );
                      })}
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>

            {/* Add new person row */}
            <div className="add-person-row">
              <span style={{fontSize:'12px',color:'var(--muted)',flexShrink:0}}>新增行：</span>
              <select value={newPerson} onChange={e=>setNewPerson(e.target.value)}
                style={{flex:1,minWidth:'80px'}}>
                <option value="">选择人员…</option>
                {personnel.map(p=><option key={p.id} value={p.name}>{p.name}</option>)}
              </select>
              <select value={newWd} onChange={e=>setNewWd(parseInt(e.target.value))}>
                {WD_LABELS.map((w,i)=><option key={i} value={i}>{w}</option>)}
              </select>
              <select value={newType} onChange={e=>setNewType(e.target.value)}>
                <option value="">选类型…</option>
                {types.map(t=><option key={t.id} value={t.name}>{t.name} {t.hours}h</option>)}
              </select>
              <input type="number" min="1" max="99" value={newCnt}
                onChange={e=>setNewCnt(parseInt(e.target.value)||1)}
                style={{width:'50px'}} placeholder="次"/>
              <button className="btn btn-sm btn-primary" onClick={addNewRow}>添加</button>
            </div>

            {/* Footer */}
            <div style={{display:'flex',gap:'8px',alignItems:'center',marginTop:'10px',flexWrap:'wrap'}}>
              <button className="btn" onClick={()=>setStep(parseResult?.unmatched?.length>0?2:1)}>← 返回</button>
              <input className="inp" placeholder="模板名称…" value={tplName}
                onChange={e=>setTplName(e.target.value)} style={{flex:1,minWidth:'120px'}}/>
              <button className="btn btn-primary" disabled={!totalCount} onClick={doSave}>
                ✓ 保存为模板
              </button>
            </div>
          </div>
        )}
        </div>
      </div>
    </div>
  );
}

/* ═══ Confirm Modal ═════════════════════════════════════════════════════════ */
function ConfirmModal({ msg, onOk, close, okLabel }) {
  return (
    <div className="overlay">
      <div className="modal modal-sm">
        <div className="modal-title">⚠ 确认操作</div>
        <p style={{fontSize:'13px',color:'var(--text)',marginBottom:'18px',lineHeight:1.6}}>{msg}</p>
        <div style={{display:'flex',justifyContent:'flex-end',gap:'8px'}}>
          <button className="btn" onClick={close}>取消</button>
          <button className="btn btn-danger" style={{background:'var(--red)',color:'#fff'}} onClick={onOk}>{okLabel||'确认'}</button>
        </div>
      </div>
    </div>
  );
}
